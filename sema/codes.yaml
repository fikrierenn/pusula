  # ⚠️ STATUS KOD AİLESİ (12.06 kullanıcı — KESİN): kodun BİN basamağı seviyeyi belirler
  #   1xxx = Sipariş BAŞLIK (J_ORDERS.STATUS)   ·  2xxx = Sipariş DETAY (J_ORDER_DETAILS.STATUS)
  #   3xxx = Odak BAŞLIK (J_ORDERS.STATUS)      ·  4xxx = Odak DETAY (J_ORDER_DETAILS.STATUS)
  #   → J_ORDERS.STATUS ∈ {1xxx, 3xxx} (başlık) · J_ORDER_DETAILS.STATUS ∈ {2xxx, 4xxx} (detay)
  #
  # 📦 SİPARİŞ YAŞAM DÖNGÜSÜ (iş akışı — 12.06 kullanıcı):
  #   Sipariş gelir → ODAK'a aktarılır (WMSAKTARMA=1) → Odak lojistik operasyon yapar (durum SÜREKLİ güncellenir)
  #   • 3xxx/4xxx = ODAK OPERASYON ARASI (geçici ara durum — sipariş hâlâ İŞLENİYOR, yaşıyor)
  #   • 1xxx/2xxx = NİHAİ DURUM (iş bitti — kargoya verildi 1005 / iptal 1001 / iade 1006)
  #   → BU YÜZDEN 3004/3006 İADE DEĞİL: Odak'ın ara işlem aşaması (Hazırlanıyor/Tedarik), sipariş geçerli.
  #     Gerçek iptal/iade SADECE nihai (1001,1006,1007) + Odak-iptal ara (3000,4000). NET = bunlar HARİÇ.
  joker.J_ORDERS.STATUS:    # lookup J_ORDER_STATUS.LOGICALREF=NAME. 1xxx=Sipariş başlık, 3xxx=Odak başlık
    lookup: ODAKJOKER.JOKER.dbo.J_ORDER_STATUS
    # ⚠️ 11.06 KESİN DÜZELTME (önceki harita TAMAMEN YANLIŞTI → e-ticaret cirosunu %70 eksik veriyordu):
    #   3004/3006 İADE DEĞİL — normal Odak sipariş aşaması (Hazırlanıyor/Tedarik Edilecek). Ciroda KALIR.
    net_iptal_iade: [1001, 1006, 1007, 3000, 4000]   # NET ciro = TOPLAM − bu kodlar (gerçek iptal/iade/kayıp)
    values:
      1000: Sipariş Alındı (normal)
      1001: Sipariş İptal Edildi (İPTAL)
      1005: Sipariş Kargoya Verildi (ana hacim, normal)
      1006: Sipariş İade Geldi (İADE)
      1007: Kayıp Kargo (iade say)
      3000: "Odak - İptal (İPTAL)"
      3001: "Odak - Sipariş Alındı/Yeni (normal)"
      3003: "Odak - Onay Bekliyor (normal)"
      3004: "Odak - Sipariş Hazırlanıyor (NORMAL — iade DEĞİL!)"
      3006: "Odak - Tedarik Edilecek (NORMAL — iade DEĞİL!)"
      3009: "Odak - Kargoya Verildi (normal)"
      4000: "Odak - İptal (satır, İPTAL)"
    note: "J_ORDERS.STATUS ana sipariş statüsü. Net = SUM(TOTALPRICE WHERE STATUS NOT IN (1001,1006,1007,3000,4000)). 3004/3006 normal aşama — DÜŞÜRME. Eski {1006,3004,3006} filtresi yanlıştı (B-29/dashboard/brief etkilendi, 11.06 düzeltildi)."
    # funnel grupları + Mayıs dağılım (curator 17.06: eski bare 'J_ORDERS.STATUS' kaydından birleştirildi)
    funnel_gruplari:
      isleniyor: [1000, 1002, 1003, 1004, 1008, 3001, 3002, 3003, 3004, 3005, 3007, 3008, 4001-4008, 2001, 2003, 2006, 2008]
      tedarik_bekliyor: [2000, 2002, 2007, 3006, 4006]
      kargoya_verildi: [1005, 3009, 4009]
      iade_geldi: [1006]
      iptal: [1001, 3000, 4000]
      kayip_sorunlu: [1007, 1009]
    may_2026_dagilim: {3-Kargoya Verildi: 67796, 5-İptal: 1160, 4-İade: 850, 1-İşleniyor: 39, 2-Tedarik Bekliyor: 2}
    confidence: 0.95
    last_verified: 2026-06-15   # 15.06 J_ORDER_STATUS full scan + Mayıs GROUP BY (ttl 180g → 2026-12)
    evidence: "11.06 net-iptal düzeltme + 15.06 J_ORDER_STATUS full scan/Mayıs dağılım. Tek kaynak (curator 17.06 dup birleşti)."
