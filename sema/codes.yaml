  #   • 1xxx/2xxx = NİHAİ DURUM (iş bitti — kargoya verildi 1005 / iptal 1001 / iade 1006)
  #   → BU YÜZDEN 3004/3006 İADE DEĞİL: Odak'ın ara işlem aşaması (Hazırlanıyor/Tedarik), sipariş geçerli.
  #     Gerçek iptal/iade SADECE nihai (1001,1006,1007) + Odak-iptal ara (3000,4000). NET = bunlar HARİÇ.
