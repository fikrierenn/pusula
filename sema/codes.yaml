# BKM Semantik Katman — KOD/ENUM SÖZLÜĞÜ (lookup değerleri)
# Canlı doğrulanmış. Yeni kod öğrenilince ekle.
version: 1
updated: 2026-06-12

codes:
  irsHrk.ehTip:        # dbo.irsTip_vw (34 değer)
    lookup: dbo.irsTip_vw
    satis_gross: [1, 4, 100]
    iade: [3, 5, 101]
    net_ciro: "SUM(gross) - SUM(iade); ehTutarN daima pozitif"
    values:
      0: Alış
      1: Satış
      2: Alış İade
      3: Satış İade
      4: Mağaza Satış
      5: Mağaza Satış İade
      6: Hizmet
      7: Gider
      8: Mağaza Mağaza (mağazalar arası transfer)
      9: Mağaza Depo
      10: Yerel Alım (tedarikçi giriş)
      11: Depo Depo
      12: Alış Mağaza İade
      13: Depo Mağaza (sipariş; eTarih≠eTarihS olabilir)
      14: İade ve İmha
      16: Stok EKLE
      17: Merkezi Düzeltme
      99: Sayım (geriye dönük yazılır, max 189 gün)
      100: POS Satış (yazar kasa perakende)
      101: POS Satış İade

  fat.eTip:            # dbo.fatTip_vw — fat SADECE faturalar (perakende kasa YOK → irsHrk 100)
    lookup: dbo.fatTip_vw
    values: {0: Alış, 1: Satış (B2B), 2: Alış İade, 3: Satış İade, 4: Mağaza Satış, 5: Mağaza Satış İade}

  depo.emir.emTip:     # depo.emTip — WMS iş emri = GÖREV
    lookup: depo.emTip
    values:
      0: YERLEŞTİRME EMRİ (Raflama / putaway)
      1: BESLEME EMRİ (replenishment)
      2: TOPLAMA EMRİ (picking)
      3: ARAÇ PLANLAMA EMRİ (şoför / sevkiyat planı)
      4: HAVUZ EMRİ

  depo.paletIcHrk.pHrkTip:
    note: "0=raflama/yerleştirme ana hareket, 1=toplama paleti, 2=besleme. pGC: 0=giriş 1=çıkış."
  depo.paletIcHrkTip:
    values: {0: KULLANICI, 1: EMİR, 2: SAYIM, 3: GERİ AL}
  depo.paletTip:
    values: {0: PALET, 1: KASA, 2: ROT, 3: ÇIKIŞ KASASI}

  encore.Sales.DocumentsTypeId:   # POS belge tipi — rapor filtresi IN (1,2,3,6,7,8)
    values:
      1: Fiş
      2: Fatura
      3: "Satış İade (negatif sign: CASE WHEN =3 THEN -GrossTotal)"
      6: Personel Fiş
      7: Personel Fatura
      8: Sınav Okulları
    note: "SUM'da iade sign'lı düşülür; AVG'da iade hariç (DocumentsTypeId<>3)."

  encore.SalesProducts.BarcodeNo_1001:
    note: "BarcodeNo='1001' = GERİ DÖNÜŞÜM satırı — ciro/kategori raporlarında HARİÇ tut (sp.BarcodeNo<>'1001'). Fiş-düzeyi dışlama: LEFT JOIN spb ON BarcodeNo='1001' ... WHERE spb.Id IS NULL."

  joker.J_ORDER_PAY_TYPES:    # PAYDEFREF=ID
    lookup: ODAKJOKER.JOKER.dbo.J_ORDER_PAY_TYPES
    values:
      -1: Havale/EFT
      -3: Kapıda Ödeme (COD)
      -13: iyzico (tüm online kart, ~%94)
  joker.J_ORDER_CARGO_STATUS: # CARGODELIVERYSTATUS
    values:
      0: İşlem görmemiş
      1: TESLİM EDİLDİ
      2: İADE GELDİ
      3: KAYIP KARGO
      4: HAREKET GÖRÜYOR
  joker.J_ORDERS.STATUS:    # lookup J_ORDER_STATUS.LOGICALREF=NAME (45 değer). ISDETAIL: 0=ana, 1/2=detay satır, 3/4=Odak aşama
    lookup: ODAKJOKER.JOKER.dbo.J_ORDER_STATUS
    # ⚠️ 11.06 KESİN DÜZELTME (önceki harita TAMAMEN YANLIŞTI → e-ticaret cirosunu %70 eksik veriyordu):
    #   3004/3006 İADE DEĞİL — normal Odak sipariş aşaması (Hazırlanıyor/Tedarik Edilecek). Ciroda KALIR.
    net_iptal_iade: [1001, 1006, 1007, 3000, 4000]   # NET ciro = TOPLAM − bu kodlar (gerçek iptal/iade/kayıp)
    values:
      1000: Sipariş Alındı (normal)
      1001: Sipariş İptal Edildi (İPTAL)
      1005: Sipariş Kargoya Verildi (ana hacim, normal)
      1006: Sipariş İade Geldi (İADE)
      1007: Kayıp Kargo (iade say)
      3000: "Odak - İptal (İPTAL)"
      3001: "Odak - Sipariş Alındı/Yeni (normal)"
      3003: "Odak - Onay Bekliyor (normal)"
      3004: "Odak - Sipariş Hazırlanıyor (NORMAL — iade DEĞİL!)"
      3006: "Odak - Tedarik Edilecek (NORMAL — iade DEĞİL!)"
      3009: "Odak - Kargoya Verildi (normal)"
      4000: "Odak - İptal (satır, İPTAL)"
    note: "J_ORDERS.STATUS ana sipariş statüsü. Net = SUM(TOTALPRICE WHERE STATUS NOT IN (1001,1006,1007,3000,4000)). 3004/3006 normal aşama — DÜŞÜRME. Eski {1006,3004,3006} filtresi yanlıştı (B-29/dashboard/brief etkilendi, 11.06 düzeltildi)."
  joker.J_ORDERS.APPLICATION:
    values: ["Mobil Uygulama (Android)", "Mobil Uygulama (iOS)", "Mobil Site", "Web Sitesi"]

  depo.adres.adrsAlanTipID:    # WMS lokasyon alan tipi (12.06 — gerçek üretim sorguları)
    values:
      0: RAF (raf stoğu — toplanabilir)
      1: "GR (Giriş Rampası / Mal Kabul)"
      5: "Özel alan — adrsAd ayırır: 'JokerHavuz' (havuz), 'TRNS' (transfer), 'CK01' (çıkış kasası)"
    note: "Depo stok dağılımı: SUM PIVOT adrsAlanTip × pUStkID. Raf/Mal Kabul/Joker Havuz/Transfer kovaları."

  joker.J_ORDER_DETAILS.STATUS:   # ürün/detay satır aşaması (ISDETAIL seviyesi — J_ORDER_STATUS 2xxx)
    bekleyen_toplama: [2000, 2002, 2003, 2007]   # WMS raflama bekleyen filtresi
    values:
      2000: Tedarik Bekleniyor
      2002: Ürün Tedariğe Gönderildi
      2003: Ürünlerin Hepsi Rafta
      2005: Ürün İptal Edildi
      2007: Ürünün Tedarikçiden Siparişi Verilmiş
      2009: Ürün Kargoya Verildi
      2010: Ürün İade Geldi
    note: "Satır seviye (J_ORDERS.STATUS ana sipariş; bu DETAY). Bekleyen toplama: WMSAKTARMA=1 AND ORDERS.STATUS=1000 AND DETAILS.STATUS IN (2000,2002,2003,2007)."

  mekanID:
    values: {1: FSM, 4477: Özlüce, 4478: İst.Yolu, 12: Ana/Merkez Depo, 4480: Ek Depo, 4835: Ek Depo}
    depo_grubu: [12, 4480, 4835]    # cari/envanter sorgularında "Depo"
    magaza_grubu: [1, 4477, 4478]   # "Mağaza"
  frmID_onemli:
    values:
      0: GENEL
      1: FSM Mğz
      4477: ÖZLÜCE Mğz
      4478: İST YOLU Mğz
      56: BURSA KÜLTÜR (Heykel — aktif cari, alış)
      60398: HEYKEL TRANSFER DEPOSU (mekan/firma)
      60400: Heykel Transfer
