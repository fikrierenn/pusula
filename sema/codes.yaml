  #   1xxx = Sipariş BAŞLIK (J_ORDERS.STATUS)   ·  2xxx = Sipariş DETAY (J_ORDER_DETAILS.STATUS)
  #   3xxx = Odak BAŞLIK (J_ORDERS.STATUS)      ·  4xxx = Odak DETAY (J_ORDER_DETAILS.STATUS)
  #   → J_ORDERS.STATUS ∈ {1xxx, 3xxx} (başlık) · J_ORDER_DETAILS.STATUS ∈ {2xxx, 4xxx} (detay)
