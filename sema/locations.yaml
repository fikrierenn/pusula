# BKM Semantik Katman — MEKÂNLAR (mağaza / kafe / merkez / depo) ve dış anahtarları
# Canonical, makine-okunur. Uygulamalar mağaza kümesini BURADAN alır; ERP posMagaza tip/durumundan TÜRETMEZ.
# Kanonik anahtar `id` (Solum `UnitKey`); sistem başına dış anahtar `keys` (Solum `IUnitMap.ExternalKey`).
# Tüketici: bkm-magaza (LocationCatalog : IUnitMap), dashboard LokasyonConfig (ada göre eşleme BIRAKILIR).
#
# NEDEN (GMY kararları, 23-24.09.2026):
#   · "Heykel ve Şura mağaza, kafeler de kapsama girsin" — ERP'de Heykel/Şura mağaza mekânı YOK
#     (60398 HEYKEL TRANSFER bir transfer DEPOSUdur, GMY 24.09), Şura hiç yok, kafeler yok.
#   · "Bir eşleme tablosu — DerinSIS, Zirve, ERP12 vs. için karşılık; ehMekan DerinSIS'te, şube Zirve'de neyse."
#   · "Kafeler kullanıcı tablosunda olur ama farklı programlar kullanırlar" → kind: cafe, uygulama kapsamı ayrı.
#   Ölçüm (24.09): Zirve vw_PersonelDepartman AltLokasyon aktif kümesi 12 değer; ERP posMagaza tip 0: 1/4477/4478 (+4479 pasif).
#
# ALANLAR: id (kebab, İngilizce, değişmez) · name (görünen ad, Türkçe) · kind: store|cafe|headquarters|depot ·
#   parent (kafe → bağlı mağaza; yalnız gösterim/gruplama, YETKİ değil) · active · stock_source: derinsis|wms|none
#   (none = "bu mekân için yerel stok tutulmuyor"; boş ≠ sıfır) · keys: {derinsis_mekan, zirve_lokasyon, zirve_altlokasyon, zirve, ad_ou, erp12}
#   Bir sistem karşılığı yoksa anahtar YAZILMAZ (NULL değil, yok).
#   zirve = "Lokasyon/AltLokasyon" BİLEŞİK anahtar (25.09.2026, kimlik sözleşmesi T5): AltLokasyon TEK BAŞINA belirsiz —
#   ölçülen 12 aktif değerde HEYKEL hem MAĞAZALAR hem GENEL MÜDÜRLÜK altında var (plan 50 §4.1d). Zirve köprüsü kişiyi
#   `Lokasyon + '/' + AltLokasyon` ile çözer (IUnitMap.Resolve("zirve", …): tam eşleşme + Trim, büyük harf Türkçe, yazım Zirve'deki
#   gibi). zirve_lokasyon/zirve_altlokasyon parçaları KALIR (dashboard süzgeci `Lokasyon LIKE 'MA%'`); bileşik anahtar parçalarla
#   tutmazsa LocationCatalog yüklemede FIRLATIR — iki gerçek doğmaz.
