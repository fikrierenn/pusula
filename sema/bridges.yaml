# BKM Semantik Katman — KÖPRÜLER (cross-table / cross-db join tanımları)
# Canonical, makine-okunur. Her köprü canlı şemada doğrulandı.
# Continuous-learning: yeni köprü öğrenilince buraya atomic ekle (id+confidence+evidence+date).
# İnsan özeti: sorgular/SEMANTIK_KATMAN.md (bundan türetilir).
version: 1
updated: 2026-06-12

bridges:
  # --- ERP iç (DerinSISBkm) ---
  - id: irshrk-stk
    from: dbo.irsHrk.ehstkID
    to: dbo.urn.stkID
    scope: derinsis
    confidence: 1.0
    note: "Satış/stok hareketi → ürün. En temiz ürün/kategori köprüsü. ehTip 1/4/100 satış."
    evidence: "kalıcı"
  - id: irshrk-mekan
    from: dbo.irsHrk.ehMekan
    to: dbo.mekan_vw.mekanID
    scope: derinsis
    confidence: 1.0
  - id: irs-irsayr
    from: dbo.irsAyr.ehID
    to: dbo.irs.eID
    scope: derinsis
    confidence: 1.0
    note: "Evrak satır → başlık. irsHrk birleşik hareket (ehID+ehstkID+ehTip grup)."
  - id: fat-fatayr
    from: dbo.fatAyr.ehID
    to: dbo.fat.eID
    scope: derinsis
    confidence: 1.0
  - id: irs-firma
    from: dbo.irs.eFirma
    to: dbo.frm.frmID
    scope: derinsis
    confidence: 1.0
    note: "Evrak → cari/firma. Mağaza frmID=1/4477/4478, GENEL=0, tedarikçi=diğer."

  # --- WMS / depo (10.06 keşif) ---
  - id: palet-irs
    from: depo.paletIcHrk.piIrsID
    to: dbo.irs.eID
    scope: derinsis
    confidence: 0.95
    note: "İç hareket → irsaliye (tip+firma için). pGC 0=giriş 1=çıkış."
    evidence: "10.06"
  - id: emirayr-emir
    from: depo.emirAyr.emPaletID
    to: depo.emirSat.satPID
    then:
      from: depo.emirSat.satEmirID
      to: depo.emir.emID
    scope: derinsis
    confidence: 0.9
    note: "Toplama operasyonu (emirAyr) → emir → emTip (görev). emirSat sadece [satPID,satEmirID] köprü."
    evidence: "10.06"

  # --- EncoreMerkez POS ↔ DerinSIS ERP ---
  - id: products-code-stkid
    from: EncoreMerkez.dbo.Products.Code
    to: DerinSISBkm.dbo.urn.stkID
    join_type: INNER
    join_sql: "u.stkID = CONVERT(int, p.Code)"
    guard: "ISNUMERIC(p.Code)=1"      # compat 110 — TRY_CONVERT yok
    match: "%99.98 (798.349/798.527)"
    scope: cross-db
    confidence: 0.99
    note: "Code stkKod DEĞİL (~%9), barkod hiç değil. POS per-fiş/per-mağaza → doğru kategori/marka."
    evidence: "09.06 — Oyuncak ciro 700K→10,96M doğrulandı"
  - id: salesproducts-products
    from: EncoreMerkez.dbo.SalesProducts.ProductsId
    to: EncoreMerkez.dbo.Products.Id
    scope: encoremerkez
    confidence: 1.0
    note: "SalesProducts WHERE IsValid=1 ZORUNLU."
  - id: stores-posmagaza
    from: EncoreMerkez.dbo.Stores.Code
    to: DerinSISBkm.dbo.posMagaza.mekanKod
    join_sql: "MG.mekanKod COLLATE Turkish_CI_AS = st.Code COLLATE Turkish_CI_AS"
    scope: cross-db
    confidence: 1.0
    note: "POS mağaza → mekanID. Zincir: Sales.PosId→Pos.StoreId→Stores.Code→posMagaza.mekanID. Her POS-mağaza raporunun standart join'i."
    evidence: "generate_brief.py + G4 ile sürekli kullanımda"
  - id: urnbrkd-barkod
    from: EncoreMerkez.dbo.SalesProducts.BarcodeNo
    to: DerinSISBkm.dbo.urnBrkd.urnBarkod
    then:
      from: dbo.urnBrkd.urnBrkdStkID
      to: dbo.urn.stkID
    guard: "urnBrkdOnce=0"
    scope: cross-db
    confidence: 0.9
    note: "Barkod GEREKİYORSA bu zincir; urn.stkKod ile join YASAK (stkKod≠barkod). Tercih: products-code-stkid köprüsü."
  - id: sales-users-kasiyer
    from: EncoreMerkez.dbo.Sales.UsersId
    to: EncoreMerkez.dbo.Users.Id
    scope: encoremerkez
    confidence: 1.0
    note: "Kasiyer adı = Users.Name. P6 haftalık kasiyer performans köprüsü."
    evidence: "11.06 — hafta 01-07.06: 16 kasiyer, fiş toplamı brief ile tutarlı"
  - id: sales-customer-name
    from: EncoreMerkez.dbo.Sales.CustomersId
    to: DerinCrm.dbo.Customer.Id
    scope: cross-db
    confidence: 1.0
    note: "Yazarkasa müşteri adı. Customer.Name/PhoneNumber/CardNumber. Group1Id=2=personel müşteri."
    evidence: "09.06 — DerinSISBkmCrm.mst (T…) EŞLEŞMEZ, EncoreMerkezCrm BOŞ."

  # --- E-ticaret (ODAKJOKER.JOKER) ---
  - id: orderdetails-orders
    from: ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS.ORDERREF
    to: ODAKJOKER.JOKER.dbo.J_ORDERS.ORDERID
    scope: joker
    confidence: 1.0
    note: "ORDERID (LOGICALREF DEĞİL!). ORDERID = 'TS…' kodundaki sayı."
    evidence: "09.06"
  - id: orderdetails-items
    from: ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS.ITEMREF
    to: ODAKJOKER.JOKER.dbo.J_ITEMS.LOGICALREF
    scope: joker
    confidence: 1.0
  - id: items-derinsis
    from: ODAKJOKER.JOKER.dbo.J_ITEMS.DERINSIS_ID
    to: DerinSISBkm.dbo.urn.stkID
    scope: cross-db
    confidence: 1.0
    note: "E-ticaret ürün → DerinSIS kategori. Marka direkt J_ITEMS.BRAND."
  - id: orders-paytype
    from: ODAKJOKER.JOKER.dbo.J_ORDERS.PAYDEFREF
    to: ODAKJOKER.JOKER.dbo.J_ORDER_PAY_TYPES.ID
    scope: joker
    confidence: 1.0
    note: "ID ile (LOGICALREF değil). Kapıda Ödeme=-3, iyzico=-13, Havale=-1."
  - id: orders-cargo
    from: ODAKJOKER.JOKER.dbo.J_ORDERS.CARGOREF
    to: ODAKJOKER.JOKER.dbo.J_CARGO.ID
    scope: joker
    confidence: 1.0
  - id: orders-cargostatus
    from: ODAKJOKER.JOKER.dbo.J_ORDERS.CARGODELIVERYSTATUS
    to: ODAKJOKER.JOKER.dbo.J_ORDER_CARGO_STATUS.STATUS
    scope: joker
    confidence: 1.0
  - id: orders-delivery
    from: ODAKJOKER.JOKER.dbo.J_ORDERS.DELIVERYREF
    to: ODAKJOKER.JOKER.dbo.J_ORDER_DELIVERY_ADDRESS.LOGICALREF
    scope: joker
    confidence: 1.0
    note: "DCITY (il), DTOWN (ilçe). ORDERCODE join Odak-bekleyen siparişlerde BOŞ → bekleyen sipariş ili için CCITY proxy (bekleyen-siparis-il)."
  - id: orders-client
    from: ODAKJOKER.JOKER.dbo.J_ORDERS.CLIENTREF
    to: ODAKJOKER.JOKER.dbo.J_ORDER_CLIENTS.LOGICALREF
    scope: joker
    confidence: 1.0
    note: "→ CUSTOMERREF (0/NULL=misafir). J_ORDER_CLIENTS standart (J_CLCARD değil). Bekleyen sipariş ili için CCITY proxy (bkz. bekleyen-siparis-il)."
  - id: bekleyen-siparis-il
    from: ODAKJOKER.JOKER.dbo.J_ORDERS.CLIENTREF
    to: ODAKJOKER.JOKER.dbo.J_ORDER_CLIENTS.CCITY
    scope: joker
    confidence: 0.9
    note: "Bekleyen sipariş (SENDDATE NULL) İL kaynağı = müşteri ili CCITY. ⚠ Teslimat ili J_ORDER_DELIVERY_ADDRESS.DCITY Odak-bekleyen siparişlerde DOLU DEĞİL (kargoya verilmemiş, ORDERCODE join 0 satır) → CCITY proxy. Aşama: STATUS 1000=Toplanma, 3001/3003/3004=Önsipariş-Hazırlanan, 3006=Temin Bekleyen. L3 raporu."
    evidence: "2026-06-12 — MCP: DCITY join 0 satır; CCITY join İstanbul 1.492/Ankara 630/İzmir 343/Bursa 238, toplam ~5.874 bekleyen."
  - id: hedef-kategori
    from: BKMDATA.dbo.Hedef.ktgId
    to: DerinSISBkm.dbo.urnKtgr2.ktgrID
    scope: cross-db
    confidence: 0.95
    note: "Hedef kategori köprüsü = KTGR2 seviyesi. Aynı zamanda urn.urnKtgrID2 = urnKtgr2.ktgrID (gerçekleşen net'i kategoriye bağlamak için). ktgId örnek: 15=Kitap, 8=Hazırlık Kitapları, 12=Kırtasiye, 2=Çocuk Kitabı. M1 hedef/gerçekleşen raporu."
    evidence: "2026-06-12 — MCP: Hedef yil=2026 ay=6 mekanId=1 → urnKtgr2 join Kitap/Hazırlık/Kırtasiye/Çocuk; ay hedefi SUM(hedef) FSM 14,25M doğrulandı."
  - id: salescampaign-sales
    from: EncoreMerkez.dbo.SalesProductCampaigns.SalesId
    to: EncoreMerkez.dbo.Sales.Id
    scope: encoremerkez
    confidence: 0.95
    note: "Kampanya satır → satış başlığı. TotalDiscount NEGATİF=indirim → SUM(-TotalDiscount)=indirim TL. Gün sayısı=COUNT(DISTINCT satış günü). CampaignName='' = manuel/set indirimi. M2 kampanya mağaza raporu."
    evidence: "2026-06-12 — MCP: FSM 01→12 Haz 9 kampanya/1,11M indirim/5.024 fiş; 3AL2ÖDE(K) 427K, SABİT FİYAT(K) 297K."

  # --- WMS palet-stok zinciri (12.06 — gerçek üretim sorguları) ---
  - id: palet-urn-adres
    from: depo.paletUrnTnm.pUID
    to: depo.paletTnm.pID
    then:
      from: depo.paletTnm.pSonPozID
      to: depo.adres.adrsID
    scope: derinsis
    confidence: 1.0
    note: "Palet ürün → palet → son konum adresi → alan tipi (adrsAlanTipID). Depo raf/havuz/transfer stok dağılımı. pUAdetN>0, adrsAlanTipID IN (0,1,5)."
    evidence: "DEPO ÖZET DURUM.sql + BÜTÜNLEŞİK TOPLAMA DEPO DURUM.sql (yıllardır prod)"
  - id: paleturn-stk
    from: depo.paletUrnTnm.pUStkID
    to: dbo.urn.stkID
    scope: derinsis
    confidence: 1.0
    note: "Palet ürün → DerinSIS ürün. pUBarkod da var (ürünün palet barkodu)."
  - id: stoksonaltdepo-stk
    from: stokSonAltDepo_vw.ehstkID
    to: dbo.urn.stkID
    scope: derinsis
    confidence: 1.0
    note: "Anlık stok view → ürün. ehAltDepo=0 ZORUNLU. ehMekan ile depo(12,4480,4835)/mağaza(1,4477,4478) ayrımı. Envanter+cari özet."
    UYARI: "MERKEZ DEPO stoğu için ehMekan=12 KULLANMA — irsHrk muhasebe bakiyesi EKSİK (2,14M) gerçek fiziksel WMS palet 4,38M (15.06). Mağaza (1/4477/4478) stoğu bu view'den OK; merkez depo daima WMS palet (id: wms-depo-stok)."
  - id: wms-depo-stok
    from: depo.paletUrnTnm.pUStkID
    to: dbo.urn.stkID
    scope: derinsis
    confidence: 1.0
    note: |
      KANONİK merkez depo stoğu (gece job 'MaliyetRaporu-Ceren' ile aynı). stokSonAltDepo mekan=12 DEĞİL.
      SELECT pu.pUStkID stkID, SUM(pu.pUAdetN) stok
      FROM depo.paletUrnTnm pu
        JOIN depo.paletTnm pt ON pt.pID=pu.pUID
        JOIN depo.adres   a  ON a.adrsID=pt.pSonPozID
      WHERE pu.pUAdetN>0 AND a.adrsAd NOT IN ('CK01') AND pu.pUID NOT IN ('42560','20353')
      GROUP BY pu.pUStkID
    evidence: "15.06 — job sorgusu + WMS toplam 4.381.910 adet (stokSonAltDepo mekan=12 sadece 2.144.814). Dashboard GetUrunlerAsync + scripts/olu_stok_excel.py bunu kullanır."
  - id: depotoplanacak-orders
    from: ODAKJOKER.JOKER.dbo.J_DEPO_TOPLANACAK.ORDERREF
    to: ODAKJOKER.JOKER.dbo.J_ORDERS.ORDERID
    scope: joker
    confidence: 1.0
    note: "Toplanacak sipariş → sipariş. WMS bekleyen raflama. J_DETAIL_BOXES (raflanmış) ile ihtiyaç=sipariş−raflanmış."
  - id: encore-kampanya-kalem
    from: EncoreMerkez.SalesProductCampaigns.SalesId+ProductSequence
    to: EncoreMerkez.SalesProducts.SalesId+Sequence
    scope: encore
    confidence: 0.97
    note: "Kampanya indirim oranı köprüsü (12.06). join: sp.SalesId=spc.SalesId AND sp.Sequence=spc.ProductSequence AND sp.IsValid=1. Grain=kampanyalı kalem. 3AL2ÖDE oran %25,7 doğrulandı (kullanıcı '%24 gibi' ile uyumlu). spc.DistributedAmount=-TotalDiscount (indirimin kendisi, brüt DEĞİL); brüt=sp.TotalPrice(net)+indirim."
