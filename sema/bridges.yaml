    confidence: 0.97
    note: |
      Kampanya indirim oranı köprüsü (12.06). join: sp.SalesId=spc.SalesId AND sp.Sequence=spc.ProductSequence AND sp.IsValid=1.
      Grain=kampanyalı kalem. 3AL2ÖDE oran %25,7 doğrulandı. spc.DistributedAmount=-TotalDiscount (indirimin kendisi, brüt DEĞİL); brüt=sp.TotalPrice(net)+indirim.
      ⚠ FAN-OUT GOTCHA (16.06): SalesProductCampaigns bir ürün satırına N indirim satırı üretir (3al2öde 52 adet=26 çift=52 spc).
      SalesProducts JOIN SalesProductCampaigns'te SUM(sp.TotalPrice) join fan-out'unda N× SAYILIR → kampanya brüt/net ŞİŞER
      (~%3.8 agg, çok-adetli satırda 52×). DOĞRU: indirim spc'den (SUM -DistributedAmount), brüt/net satır-başı 1× ayrı/DISTINCT CTE'den.
      İndirim ve yük% zaten doğruydu (spc'den); fan-out SADECE brüt+net'i şişiriyordu. Fix: commit 609f3dd MagazaQueries.cs."
