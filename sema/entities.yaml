  # ⚠ ÇELİŞKİ KAYDI — merkez stoğunda WMS ve ERP defteri birbirini tutmuyor
  MERKEZ_STOK_WMS_ERP_CELISKISI:
    rule: >-
      Merkez stoğu WMS'ten okunur (sql-server-conventions § MERKEZ DEPO STOĞU) ama WMS de
      MUTLAK DOĞRU DEĞİL. İki yön birlikte bilinir; WMS ile defter çelişiyorsa sayı ŞÜPHELİDİR
      ve fiziksel sayım yapılmadan karara dayanak alınmaz.
    yonler:
      defter_pozitif_wms_yok: "9.146 çeşit / 1.996.995 adet — ERP defteri kalıntı/negatif taşıyor. WMS'in tercih sebebi bu."
      wms_pozitif_defter_sifir: "349 çeşit / 3.757 adet — HAYALET. 261'inde merkez satışı, 342'sinde belgesiz palet hareketi var."
    mekanizma: >-
      Satış ERP'de kesilir, WMS'ten DÜŞÜLMEZ; mal rafta kalır, sonra elle giriş alanına taşınır
      (depo.paletIcHrk piIrsID=0, pHrkTip=0 KULLANICI). stkID 248104 uçtan uca izlendi:
      23.02.2026 İst.Yolu→merkez transfer (+1, irsaliye 7121400, WMS'e işlendi) ·
      22.05.2026 merkez SATIŞ −1 (belge 7135278, WMS'te karşılığı YOK) ·
      10.07.2026 elle palet taşıması raf 44711 → GR01 37250 (belgesiz). Sonuç ERP 0 / WMS 1.
    yigilma: >-
      Hayalet KİTAP tarafında: Akademi 84 çeşidin 76'sı (%90) · Kitap 127'nin 77'si (%61) ·
      Kırtasiye 15.803'ün 142'si (%0,9) · Oyuncak %0,8. Merkez depo kitap tutmuyor; oradaki
      tek-adetler kalıntı (kullanıcı teyidi: "depoda kitap yok normalde").
    applied_in:
      ekran: "dashboard GetDepoAdresAsync — WMS adresleri + defter bakiyesi birlikte döner, çelişki ekranda uyarı."
      rapor: "scripts/gr_palet_supheli_excel.py — GR 234 satır / 456.525 ₺; tüm alanlar 998 satır / 3.479.742 ₺ (etiket)."
    evidence: "2026-09-09 — arşiv sorgular/2026-09-09-wms-erp-hayalet-stok.sql"
    last_verified: "2026-09-09"

  DerinSISBkm.depo.paletIcHrk:
    type: table
    role: "WMS palet iç hareket defteri — bir ürünün paletler/adresler arası dolaşımı"
    yon_kurali: >-
      piİlkID hareketin SAHİBİ palet, piSonID KARŞI palet. KANITLANDI: iki hipotez
      stok_adres_palet_vw ile karşılaştırıldı, yalnız bu tuttu (stkID 235636 → palet 37250: 2,
      palet 230598: 3 — view ile birebir; ters hipotez −2 / −3 veriyordu).
    kodlar:
      pGC: "0 = giriş (780.009 satır, hepsi pozitif) · 1 = çıkış (979.868'i negatif)"
      pHrkTip: "0 KULLANICI · 1 EMİR · 2 SAYIM · 3 GERİ AL (lookup depo.paletIcHrkTip)"
      piIrsID: "0 = BELGESİZ iç taşıma (irsaliyeye bağlı değil). Hayalet stok vakalarında 342/349'da var."
    isim_tuzagi: >-
      ⚠ Kolon adı TÜRKÇE İ ile: `piİlkID`. ASCII `piIlkID` yazımı Err 207 "Geçersiz sütun adı"
      verir (2026-09-09'da bu hataya düşüldü).
    evidence: "2026-09-09 — stkID 235636 ve 248104 üzerinde yön kanıtı + kod kümesi sayımı."
    last_verified: "2026-09-09"

  DerinSISBkm.depo.stok_adres_palet_vw:
    type: view
