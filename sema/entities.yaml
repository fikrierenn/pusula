  # POS
  EncoreMerkez.dbo.Sales: {type: table, pk: Id, key: [Date, CustomersId, UsersId, DocumentsTypeId, GrossTotal, DiscountTotal, VatTotal], note: "Date=satış datetime (SaleDate DEĞİL); header indirim=DiscountTotal (DiscountTotalDirect/Campaign SalesProducts kalem-düzeyinde, header'da YOK); net KDV-hariç=GrossTotal-DiscountTotal-VatTotal. Sales'te IsValid YOK (o SalesProducts'ta). 18.06 sys.columns doğrulandı"}
  EncoreMerkez.dbo.SalesProducts:
    type: table
    pk: Id
    key: [SalesId, Sequence, ProductsId, VatPercent, Amount, TotalPrice, VatTotal, DiscountTotalDirect, DiscountTotalIndirect, DiscountTotalCampaign, BarcodeNo, IsValid]
    filter: "IsValid=1 ZORUNLU"
    grain: "fiş satırı (SalesId + Sequence)"
    tutar_semantigi: "**TotalPrice = KDV DAHİL ve İNDİRİM SONRASI (net tahsil edilen).** VatTotal, TotalPrice'ın İÇİNDEDİR → KDV-hariç satır = `TotalPrice - VatTotal`. Kanıt: 2500 @ VatPercent=20 → VatTotal 416,66 = 2500 − 2500/1,20 (KDV-hariç olsaydı 500 olurdu). Liste fiyatı = TotalPrice + DiscountTotalDirect + DiscountTotalIndirect."
    indirim_ayrismasi: "**Sales.DiscountTotal = SUM(DiscountTotalDirect) + SUM(DiscountTotalIndirect).** Indirect = fiş/genel indirimin satıra dağıtılmış payı; Direct = satıra doğrudan yazılan (Campaign onun alt kümesi, ölçülen günde Direct'e EŞİT). ⚠️ CLAUDE.md'nin 'sadece DiscountTotalDirect kullan' kuralı Sınav fişlerinde İNDİRİMİ %85 EKSİK ölçer (18.08.2026: Direct 5.981,79 · Indirect 33.231,00 · header 39.212,79). TotalPrice her iki indirimden de arınmıştır → net ciro için SUM(TotalPrice) güvenli, indirim TUTARI raporlanacaksa Direct+Indirect."
    mutabakat: "Fiş düzeyi BİREBİR (18.08.2026, 24/24 fiş): `Sales.GrossTotal − Sales.DiscountTotal = SUM(SP.TotalPrice)` ve `Sales.VatTotal = SUM(SP.VatTotal)` (fark 0,00)."
    note: "kalem-düzeyi indirim DiscountTotalDirect; DiscountTotalCampaign alt-küme. TaxableTotal kolonu PRATİKTE NULL (2026-08 örneğinde tamamı) — kullanma."
    confidence: 0.95
    evidence: "2026-08-19 — sorgular/2026-08-19-sinav-encore-kdv-denetim.sql blok 1-3; 721 satır / 24 fiş canlı mutabakat."
    last_verified: "2026-08-19"
