# BKM Semantik Katman — ENTITY (tablo/view) SÖZLÜĞÜ
# Omurga tablolar + bu oturum keşfedilen WMS. Tam liste: sorgular/SEMANTIK_KATMAN.md §2.
version: 1
updated: 2026-08-17

databases:
  DerinSISBkm: {rol: "ERP+WMS+muhasebe", semalar: [dbo, bkm, depo, ent, mhs, earsv, edftr, web, b2b, "sil(KULLANMA)"], tarih: "DMY — CONVERT(date,'dd.MM.yyyy',104)"}
  EncoreMerkez:
    rol: "POS (yazar kasa)"
    compat:
      sql_compat_level: 110
      unavailable: [STRING_AGG, TRIM, IIF, TRY_CONVERT]
      alternatives: {STRING_AGG: "STUFF + FOR XML PATH", TRIM: "LTRIM(RTRIM())", IIF: "CASE WHEN", TRY_CONVERT: "ISNUMERIC + CONVERT"}
  DerinCrm: {rol: "yeni sadakat CRM (müşteri adı)"}
  ODAKJOKER.JOKER: {rol: "e-ticaret (linked server)", tarih: "YYYYMMDD ISO — DMY burada SESSİZ HATA"}
  BKMDATA: {rol: "Hedef tablosu + veri ambarı"}
  BKMMaliyet: {rol: "maliyet/marj"}
  BKM_GENEL: {rol: "Zirve ERP — BORDRO/PERSONEL/SGK (ayrı sunucu; MCP: zirve). DerinSIS'ten AYRI sistem. Personel görev-ünvan otoritesi (perbilgi.Gorevi serbest metin)."}
  Mosaik: {rol: "Mosaik portal (reporthub, .NET modüler; MCP: portalhub) DB — SOP/Kvkk/Forms/Circular + görev-tanımı modülü (planlı). ReportHUB DB DEĞİL (o recovery_pending/eski). Doküman/versiyon/onay/workflow + AppModules kayıt + ModuleRoleAccess yetki + AuditLog + Kvkk envanteri."}

ai_hints:   # sorgu üretirken her zaman geçerli
  - "yyyy-MM-dd tarih formatı HİÇBİR yerde kullanılmaz."
  - "Cross-db string join → COLLATE Turkish_CI_AS."
  - "Canlı sorguda WITH(NOLOCK) (özellikle irsHrk, depo.*)."
  - "MCP sql_query: CTE yok, top-level ORDER BY yok, multi-statement yok — tek SELECT yaz."
  - "urn.stkKod BARKOD DEĞİL — ürün eşleşmesi daima stkID üstünden."
  - "'ODAK stok' / e-tic depo stoğu sorulunca → ent.odak_depo_Stok (stkID,StokMiktar). stokSonAltDepo_vw mekan-toplamıyla HESAPLAMA — mekan 26142/4480/4835 transit, dahil edersen sessiz over-count. Ürün master (marka/yazar/maliyet/fiyat/kategori) → bkm.UrunBilgi."

entities:
  # ERP çekirdek
  dbo.urn:
    pk: stkID
    key: [stkKod, stkAd, urnMrkID, urnKtgr2ID, urnTip, fiyatS]
    note: "stkKod barkod DEĞİL → eşleme stkID üstünden"
    urnTip: "0=normal ürün (856K), 1=gider/hizmet kalemi (250 kayıt — muhasebe, hepsi Tanımsız kategorisinde). Ölü stok sorgusunda WHERE urnTip=0 ZORUNLU."
    fiyatS: "satış/liste fiyatı (KDV dahil). Sıfır-maliyetli imputation anchor: AVG(ORT_ALIS/fiyatS) kategori bazında → ürün maliyeti = fiyatS × oran. Filtre: fiyatS>0 AND ORT_ALIS<fiyatS."
    olu_stok_exclusions:
      stkID: [81809]
      note: "81809=İskonto ve Fiyat Farkı (Kırtasiye) — muhasebe kalemi yanlış kategoride, urnTip=0 olduğu için urnTip filtresi yakalamıyor"
      kategoriler_ek: ["Zkargo", "KARGO"]
      kategoriler_ek_note: "Zkargo=alış kargo giderleri; KARGO=gelir kalemleri (stkKod KARGO1/KARGO2, stkID 144860/144963)"
    last_verified: "2026-06-17"
  dbo.irsHrk:
    pk: ehID
    grain: "birleşik hareket (ehID+ehstkID+ehTip)"
    note: "ciro/stok ana kaynağı"
    columns:
      ehTrhS: {label: "İş tarihi", description: "Stok/ciro DAIMA bu tarih (=irs.eTarihS). hrkTarih=audit log."}
      ehTip: {label: "Hareket tipi", description: "1/4/100=satış, 3/5/101=iade → codes.yaml"}
      ehAdetN: {label: "Adet (net)", description: "Çıkışta NEGATİF (satış/iade)"}
      ehTutarN: {label: "Tutar KDV hariç", description: "= ehTutar−ehIndirim. DAIMA POZİTİF — iade sign'ı CASE ile çevir"}
      ehAltDepo: {label: "Alt depo", description: "ehAltDepo=0 filtresi ZORUNLU (raporlarda)"}
  dbo.irs: {pk: eID, key: [eNo, eMekan, eFirma, eTip, eTarihS, eGC], note: "evrak başlık"}
  dbo.frm: {pk: frmID, key: [frmKod, frmAd, frmTip]}
  dbo.mekan_vw: {tip: view, key: [mekanID, mekanAd, mekanTip]}

  # POS
  EncoreMerkez.dbo.Sales: {pk: Id, key: [Date, CustomersId, UsersId, DocumentsTypeId, GrossTotal, DiscountTotal, VatTotal], note: "Date=satış datetime (SaleDate DEĞİL); header indirim=DiscountTotal (DiscountTotalDirect/Campaign SalesProducts kalem-düzeyinde, header'da YOK); net KDV-hariç=GrossTotal-DiscountTotal-VatTotal. Sales'te IsValid YOK (o SalesProducts'ta). 18.06 sys.columns doğrulandı"}
  EncoreMerkez.dbo.SalesProducts: {key: [SalesId, ProductsId, BarcodeNo, DiscountTotalDirect, DiscountTotalCampaign, IsValid], filter: "IsValid=1 ZORUNLU", note: "kalem-düzeyi indirim DiscountTotalDirect (toplam); DiscountTotalCampaign alt-küme"}
  EncoreMerkez.dbo.Products: {pk: Id, key: [Code], note: "Code=urn.stkID köprüsü"}
  DerinCrm.dbo.Customer: {pk: Id, key: [Name, PhoneNumber, CardNumber, Group1Id], note: "Id=Sales.CustomersId; Group1Id=2 personel"}

  # WMS / depo (10.06)
  depo.emir: {pk: emID, key: [emTip, emBhTip, kTarih, emDepoID], note: "iş emri; emTip=görev (depo.emTip lookup)"}
  depo.emirAyr: {pk: emAyrID, key: [emPaletID, emAdet, emTamam, emKisi, emTarih], grain: "TOPLAMA operasyonu (picking)", note: "emKisi=gerçek operatör"}
  depo.emirSat: {key: [satPID, satEmirID], note: "palet↔emir köprü (2 kolon)"}
  depo.paletIcHrk: {key: [piAdet, pikKisi, pikTarih, pGC, pHrkTip, piIrsID], grain: "iç hareket (raflama+toplama)", note: "pikKisi=operatör"}
  depo.paletSevkLog: {key: [psAdet, psKabulİrsID, psSevkİrsID, psEmirID, kKisi], note: "sevk-çıkış; kKisi=sistem-kullanıcısı (operatör DEĞİL)"}
  # WMS palet-stok (12.06 — gerçek üretim sorguları D:\Belgelerim\sql\)
  depo.paletUrnTnm: {key: [pUStkID, pUBarkod, pUAdetN, pUID], grain: "palet × ürün satırı", note: "pUStkID=urn.stkID, pUAdetN>0=dolu, pUID=palet ref (paletTnm.pID). Depo anlık raf/havuz stoğu kaynağı."}
  depo.paletTnm: {pk: pID, key: [pSonPozID], note: "palet başlık; pSonPozID=adres.adrsID (paletin son konumu)"}
  depo.adres: {pk: adrsID, key: [adrsAlanTipID, adrsAd], note: "depo lokasyon; adrsAlanTipID=alan tipi (codes), adrsAd özel ('JokerHavuz'/'TRNS'/'CK01')"}
  depo.stok_adres_palet_vw: {tip: view, key: [PaletID, stkID, stok, adrsAlanTipID], note: "palet×adres×stok düz view (palet içerik sorgusu)"}
  ent.JokerCKStok_vw: {tip: view, key: [pUStkID, toplamAdet], note: "Joker CK (çıkış kasası) stok view"}
  ent.odak_depo_Stok: {tip: tablo, key: [stkID, StokMiktar], note: "ODAK (e-tic) depo fulfillment stoğu. stkID=urn.stkID (1:1, 487.567 satır, 349.756 çeşit stokta, ~7,0-7,16M adet). LOKAL DerinSIS (linked-server BKM_STOKLAR.MERKEZDEPO_STOK'tan AYRI değer/kaynak; bunu kullan — hızlı). Dashboard ürün drill 'ODAK' kolonu. ⚠ 'ODAK stok' sorulduğunda KANONİK = BU TABLO; stokSonAltDepo_vw mekan-toplamıyla HESAPLAMA (24.06 vakası: vw mekan 26142 İPTAL-Transfer 129K dahil edilip sessiz over-count yapıldı). 14.06 keşif, 24.06 teyit."}
  bkm.UrunBilgi: {tip: view, pk: stkID, key: [stkID, mrkAd, Yazar, SatisFiyat, SonAlis, Kategori3], note: "Denormalize ÜRÜN MASTER VIEW (sys.objects=VIEW) — en pratik ürün lookup; tek view'dan marka+yazar+maliyet+fiyat+kategori (urn+urnMrk join'e gerek yok, rapor scriptleri buradan). Kolonlar: stkKod/BarkodAna/stkAd, mrkID/mrkAd(marka=yayınevi), YazarId/Yazar, frmID/FirmaAd(ana tedarikçi), KatAna/Kat1..5/Kategori2/Kategori3(metin hiyerarşi; Kategori3=urnKtgr2.ktgrAd ör 'Hazırlık Kitapları'), SatisFiyat(üst/liste fiyat birim), SonAlis(son alış maliyet birim, 0=güncellenmemiş), OzelWebFiyat, AlisKDVYuzde/SatisKDVYuzde, urnTip(0=normal), AnaTedarikciId. 24.06 kolon+tip teyit (eski kısa stub ile birleşti)."}
  dbo.bakiyeVDGG_vw: {tip: view, key: [cKod, borc, alacak, bakiye, GecenB, GelecekB], note: "Cari bazlı bakiye + vade yaşlandırma. cKod=frm.frmID. bakiye=net (alacak+borç-işaretli; borç negatif depolanır). GecenB=vadesi GEÇMİŞ tutar, GelecekB=YAKLAŞAN (henüz vadesi gelmemiş). Risk limiti = frm.frmBakiyeLimit (aşım = ABS(bakiye)>limit). Dashboard /cari-risk (B-124). ⚠ AĞIR ~8s (tüm car agg). frmKod prefix: 320=satıcı,120=alıcı,100/101/103/300=banka/çek,6xx/7xx=gider. Diğer: bakiye_vw/bakiyeGrup_vw, satOdeBakiyeVDGG_vw (satıcı), carOdemePlan_vw (ödeme planı), cek_vw (çek). 2026-06-25 canlı."}
  stokSonAltDepo_vw: {tip: view, key: [ehstkID, ehMekan, ehAltDepo, stok], note: "ANLIK mağaza+depo stok (ehAltDepo=0 zorunlu). ehMekan POZİTİF stok: 12=Merkez Depo (~2,14M), 1=FSM, 4477=Özlüce, 4478=İst.Yolu, 60398=Heykel. NEGATİF/transit-sanal (hariç tut): 4480 (-348K), 26142 (-2,16M), 4835 (0). Dashboard ürün drill stok dağılımı = mekan IN (1,4477,4478,12) — şube toplamı irsHrk ehAdetN toplamıyla BİREBİR (14.06: 102+144+613=859). Envanter/cari özet kaynağı."}
  # JOKER WMS toplama (bekleyen sipariş raflama)
  ODAKJOKER.JOKER.dbo.J_DEPO_TOPLANACAK: {key: [ORDERREF], note: "depoda toplanacak sipariş listesi (ORDERREF=J_ORDERS.ORDERID)"}
  ODAKJOKER.JOKER.dbo.J_DETAIL_BOXES: {key: [ITEMREF, DETAILREF, LOGICALREF], note: "raflanmış koli; COUNT=raflanmış adet. İhtiyaç = sipariş − raflanmış."}
  ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS_COMP: {key: [DETAILREF, COMPITEMREF, COMPBARCODE, QUANTITY], note: "kompozit/set ürün açılımı (J_ORDER_DETAILS.LOGICALREF=DETAILREF)"}

  # Hedef / veri ambarı
  BKMDATA.dbo.Hedef: {key: [mekanId, yil, ay, gun, ktgId, hedef], grain: "mekan × kategori × GÜN (günlük satır)", note: "ay hedefi = SUM(hedef) WHERE yil,ay. mekanId 1/4477/4478 retail, 12=Depo. ktgId=urnKtgr2.ktgrID (bridge hedef-kategori). Haziran 2026: FSM 14,25M/Özlüce 23,5M/İst.Yolu 13M/Depo 77M. M1 paydası."}

  # PDKS (işgücü — OPENQUERY)
  pdks: {tip: openquery, filter: "Per_Grp1='MAĞAZALAR'", magaza_eslesme: "Per_Grp2 = mağaza adı", note: "OPENQUERY iç literal ''..''  — vrd.Vardiya tabloları GEREKMEZ. S1 SPLH + işgücü üçgeni kaynağı."}
  # PDKS saatlik çalışan headcount — KABUL EDİLEN MANTIK (2026-06-30, TrafikQueries.GetPdksPersonelAsync)
  pdks_saatlik_personel:
    kaynak: "OPENQUERY([PDKS]) TTagZei z JOIN TPerTab p ON p.Per_PersNr=z.TZe_PersNr; filter Per_Grp1='MAĞAZALAR' AND Per_Grp2='FSM' AND TZe_VonZeit/BisZeit NOT NULL"
    grain: "haftagünü(0=Pzt..6=Paz) × saat(0-23) → ort. eş-zamanlı çalışan personel"
    kural_1_vardiya_araligi: "Kişi başı GÜN içinde MIN(giriş saati) → MAX(son dolu saat). Öğle molası segmenti satır kırar (ör. 10-13 + 14-18) → segment-bazlı saymak mola saatinde SAHTE DÜŞÜŞ üretir. MIN-MAX span mola saatini de 'vardiyada' sayar (doğru)."
    kural_2_cikis_saati: "Son dolu saat = çıkış dakikası>0 ise DATEPART(hour) (18:30→18 dahil), tam saatte çıktıysa hour-1 (18:00→17, saat 18'de yok). Yoksa 18:30 çalışan saat 18'de hiç sayılmaz = sahte uçurum. Giriş saati floor (10:30→10, açılış kısmi saati sayılır)."
    kural_3_ortalama: "AVG = SUM(o saatteki kişi) / o haftagününün ÇALIŞILAN TOPLAM gün sayısı (opdays). Sadece-dolu-güne bölmek (eski AVG) boş saatleri 0 saymaz → uç saatler şişer. Boş saat 0 paya girer."
    dogrulama: "2026-06-30, Haziran 4 Salı: 16=24·17=23·18=21·19=16·20=13 (yumuşak iniş). Eski hatalı sürüm 18'de 21→14 keskin uçurum gösteriyordu (çıkış-floor bug). 27.06 Cmt span: 9→27 plato →12 pürüzsüz."
    not: "Trafik sayfası 'Personel–Trafik Uyumu' haritasının success-bandı/karne hesabı bunu kullanır. Sadece FSM (Per_Grp2='FSM'); diğer mağaza gerekince parametrize."

  # E-ticaret
  ODAKJOKER.JOKER.dbo.J_ORDERS: {pk: LOGICALREF, biz_key: ORDERID, key: [CLIENTREF, PAYDEFREF, CARGOREF, DELIVERYREF, APPLICATION, TOTALPRICE, CARGOPRICE, SERVICEPRICE, VOUCHERCODE, STATUS, CARGODELIVERYSTATUS, BASEORDERID, SUBORDERS, ORDERTYPE], note: "⚠ TÜREMİŞ SİPARİŞ (çift-sayım tuzağı): BASEORDERID (int, NULL=ana) = türemiş siparişin ana ORDERID'si; SUBORDERS>0 = bu sipariş bölünmüş (çocuğu var, 'asıl'); ORDERTYPE 0=ana · 2=türemiş. Sipariş bölününce hem asıl hem türemiş J_ORDERS'ta durur → RAPOR/ANALİZDE ASILI ÇIKAR (türemiş güncel): AND NOT EXISTS(SELECT 1 FROM ODAKJOKER.JOKER.dbo.J_ORDERS b WHERE b.BASEORDERID=o.ORDERID). Tem-2026 kart: 93.500 sipariş = 139 superseded-ana + 225 türemiş-çocuk (~%0,15, ama iptal-ilişkili → problemli satırda daha yoğun). 2026-07-30 canlı. ⚠ SERVICEPRICE ÇİFT ANLAMLI, PAYDEFREF'e göre okunur: PAYDEFREF=-3 (Kapıda Ödeme) → COD hizmet bedeli (8.167/8.167 dolu, %100). PAYDEFREF=-13 (iyzico/kart) → VADE FARKI (JOKER API'de ayrı alan: Payment.LateChargeAmount; API'nin CashOnDeliveryAmount'ı ayrı ve bu siparişlerde 0). Haz+Tem 2026: 4.266/135.803 iyzico siparişi (%3,1) dolu = 981.754 ₺ — COD toplamının (693.378 ₺) üstünde, ciro/maliyet raporunda COD sanılırsa yanlış sınıflanır. Tutar kimliği: TOTALPRICE = SUM(D.QUANTITY*D.SELLINGPRICE) + CARGOPRICE + SERVICEPRICE (kuruşu kuruşuna, 12 sipariş × JOKER API karşılaştırması). VADE FARKI TARİFESİ (sabit oran, sepetten bağımsız; taban = satır toplamı + CARGOPRICE - VOUCHERVALUE): %10,44 · %13,52 · %16,29 · %19,62 · %31,14 · %38,33 (Tem-2026: 1.331 sipariş bu 6 kademede). ⚠ FAİZSİZ TAKSİT YOK (kullanıcı teyit 2026-07-30) → SERVICEPRICE>0 = KESİN taksitli, =0 = KESİN peşin (kart -13'te; proxy değil tam ayrım). TAKSİT SAYISI HİÇBİR YERDE YAZILI DEĞİL — JOKER'de taksit kolonu YOK (tüm DB kolon taraması: TAKSIT/INSTALLMENT/VADE/KOMISYON = 0 eşleşme); API'nin Payment.InstallmentCount alanı beslenmiyor (vade farkı dolu siparişte bile 1 dönüyor). Kademe→taksit eşlemesi iyzico panelinden doğrulanmayı bekliyor (teyit bekliyor, confidence 0.5). BANK kolonu boş (%94), TRANSACTIONID/ROUND/FIRM/ISLEM_ACIKLAMA da boş — taksit izi yok. 2026-07-17 canlı keşif."}
  ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS: {key: [ORDERREF, ITEMREF, QUANTITY, SELLINGPRICE, SELLINGPRICEWITHOUTDISCOUNT, STATUS], note: "ORDERREF=J_ORDERS.ORDERID · ITEMREF=J_ITEMS.LOGICALREF. STATUS=SATIR durumu (2xxx/4xxx, lookup J_ORDER_STATUS) — İPTAL/İADE ANALİZİNİN DOĞRU GRAIN'İ (header J_ORDERS.STATUS kısmi iptali kaçırır, bkz codes.yaml joker.J_ORDER_DETAILS.STATUS). İptal=2005, İade=2010, Baskısı-yok/fiili-iptal=2004. İptal/iade kolonları: IPTALNO, IPTALSEBEP(varchar), IPTALTARIH(datetime), IADESEBEPNO, IADEMIKTAR, IADEACIKLAMA, IADETALEP, IADETALEPTARIH, ODEMEDURUM(smallint). ⚠ DURUM kolonu ölü (hep NULL). 2026-07-30 canlı."}
  ODAKJOKER.JOKER.dbo.J_ITEMS: {pk: LOGICALREF, key: [NAME, BRAND, DERINSIS_ID], note: "BRAND direkt marka; DERINSIS_ID=urn.stkID"}
  ODAKJOKER.JOKER.dbo.BASKISIYOK: {key: [LOGICALREF, TARIH, DETAILREF, ORDERREF, ITEMREF, USERREF, BARCODE, QUANTITY], note: "Baskısı yok (etiket basılmadan) yapılan e-tic sipariş satırları. DETAILREF→J_ORDER_DETAILS.LOGICALREF, ITEMREF→J_ITEMS.LOGICALREF, USERREF→EM_USERS.LOGICALREF, ORDERREF→J_ORDERS.ORDERID, TARIH=işlem zamanı (datetime). Adet/Tutar = BASKISIYOK.QUANTITY (B) × D.SELLINGPRICE. ⚠ B.QUANTITY=0 satırları İPTAL kaynaklı (bug, 58/1681 son-30g) → RAPORDA DEVRE DIŞI: WHERE B.QUANTITY>0. (D.QUANTITY iptali sayar, KULLANMA.) çeşit=distinct B.BARCODE. SELLINGPRICE=0=hediye çeki (normal, Tutar 0 Adet dolu). Dashboard /baskisi-yok (B-126) + e-tic 30g trend. 2026-06-26 kolon teyit + iptal-0 filtre."}
  ODAKJOKER.JOKER.dbo.EM_USERS: {pk: LOGICALREF, key: [FULLNAME], note: "JOKER panel kullanıcıları; BASKISIYOK.USERREF→LOGICALREF, FULLNAME=işlemi yapan."}

  # EncoreMerkez kampanya
  EncoreMerkez.dbo.SalesProductCampaigns: {pk: Id, key: [SalesId, CampaignId, CampaignName, TotalDiscount], grain: "satış × kampanya kalemi", note: "TotalDiscount NEGATİF=indirim. SalesId→Sales.Id. M2 kampanya raporu kaynağı."}

  # ── BKMMaliyet — FIFO maliyet sistemi (asıl proje D:\Dev\fifo; pusula=sema). 2026-06-19 ──
  # ERP kaynağı: DerinSISBkm (prod) / DerinSIS_Local (BT-FIKRI demo). SP master: fifo/v2-production/00_V2_MASTER_FULL.sql
  BKMMaliyet.dbo.FifoKatman:
    pk: KatmanId
    key: [StkId, GirisTarihi, KaynakTip, GirisMiktar, KalanMiktar, BirimMaliyet, Durum]
    grain: "ürün × giriş katmanı (FIFO maliyet havuzu, mekan-bağımsız PARTITION BY StkId)"
    note: "BirimMaliyet<=0 OLAMAZ (fifo-domain §6). KaynakTip→codes. Eldeki birim maliyet=SUM(KalanMiktar*BirimMaliyet)/SUM(KalanMiktar) WHERE KalanMiktar>0."
    last_verified: "2026-06-19"
  BKMMaliyet.dbo.FifoCikisDetay:
    pk: CikisId
    key: [StkId, HareketTarihi, HareketTipi, MekanId, KatmanId, Miktar, BirimMaliyet, CikisTutar, SatisTutar]
    grain: "satış/iade çıkış × tüketilen katman segmenti"
    note: "marj = SatisTutar(gelir) − CikisTutar(SMM). CikisTutar COMPUTED=Miktar×BirimMaliyet (UPDATE edilemez). SatisTutar=irsHrk ehTutarN miktar-oranlı. HareketTipi SATIS/IADE. çıkış SMM=irsHrk kaynaklı (irs/irsAyr DEĞİL)."
    last_verified: "2026-06-19"
  BKMMaliyet.dbo.FifoAcilisEnvanter: {pk: "(EnvanterTarihi,MekanId,StkId)", key: [StokMiktar], note: "açılış stok snapshot=irsHrk KÜMÜLATİF (ehTrhS<=devir, ehAltDepo=0, mekan 1/12/4477/4478) — GEÇMİŞ-doğru, anlık-stok view DEĞİL."}
