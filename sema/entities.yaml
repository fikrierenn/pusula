      ⚠ **JOB AYLIK KOŞMUYOR:** tüm tabloda tek yazım günü var (14.08.2026); WMS için tek dönem
      (31.08.2026), yani DEPO GEÇMİŞİ YOK. Mağaza tarafı (Kaynak='irsHrk') defterden backfill
      edildiği için 2021→2026 tüm aylar dolu (2026 Oca-Ağu eksiksiz).
      Ölçüm 2026-09-03: 29.234.965 satır · 64 dönem · 1,87 GB (PK 1.244,6 MB + IX 624,0 MB) ·
      0 negatif · 0 mükerrer. Canlı WMS (RAF+GİRİŞ) 3.995.265 vs snapshot 4.249.866 → 20 günde
      254.601 fark."
