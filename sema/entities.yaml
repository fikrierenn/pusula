    evidence: "2026-06-12 — MCP: DCITY join 0 satır; CCITY join İstanbul 1.492 / Ankara 630 / İzmir 343 / Bursa 238, toplam ~5.874 bekleyen."
    measurement: "2026-09-11 — bu kayıt `bridges.yaml`da bir KÖPRÜ olarak duruyordu (`from: J_ORDERS.CLIENTREF` / `to: J_ORDER_CLIENTS.CCITY`) ve `sema kopru` canlı koşunca patladı: \"nvarchar değeri 'Eskişehir' int veri türüne dönüştürülürken işlem başarısız oldu\". Yani kayıt join yuvalarına bir DEĞER kolonu yazmıştı. Gerçek join zaten ayrı kayıtta ve temiz ölçülmüş (`bridges:orders-client`, 0 öksüz / 4.704.484). Köprüyü düzeltmek onu orders-client'ın kopyası yapacaktı (duplikasyon yasak) → kayıt KURAL olarak buraya ayrıldı, eski köprü silinmedi, `status: superseded` ile emekliye alındı."
    last_verified: "2026-09-11"

