# BKM Semantik Katman — ENTITY (tablo/view) SÖZLÜĞÜ
# Omurga tablolar + bu oturum keşfedilen WMS. Tam liste: sorgular/SEMANTIK_KATMAN.md §2.
version: 1
updated: 2026-06-17

databases:
  DerinSISBkm: {rol: "ERP+WMS+muhasebe", semalar: [dbo, bkm, depo, ent, mhs, earsv, edftr, web, b2b, "sil(KULLANMA)"], tarih: "DMY — CONVERT(date,'dd.MM.yyyy',104)"}
  EncoreMerkez:
    rol: "POS (yazar kasa)"
    compat:
      sql_compat_level: 110
      unavailable: [STRING_AGG, TRIM, IIF, TRY_CONVERT]
      alternatives: {STRING_AGG: "STUFF + FOR XML PATH", TRIM: "LTRIM(RTRIM())", IIF: "CASE WHEN", TRY_CONVERT: "ISNUMERIC + CONVERT"}
  DerinCrm: {rol: "yeni sadakat CRM (müşteri adı)"}
  ODAKJOKER.JOKER: {rol: "e-ticaret (linked server)", tarih: "YYYYMMDD ISO — DMY burada SESSİZ HATA"}
  BKMDATA: {rol: "Hedef tablosu + veri ambarı"}
  BKMMaliyet: {rol: "maliyet/marj"}

ai_hints:   # sorgu üretirken her zaman geçerli
  - "yyyy-MM-dd tarih formatı HİÇBİR yerde kullanılmaz."
  - "Cross-db string join → COLLATE Turkish_CI_AS."
  - "Canlı sorguda WITH(NOLOCK) (özellikle irsHrk, depo.*)."
  - "MCP sql_query: CTE yok, top-level ORDER BY yok, multi-statement yok — tek SELECT yaz."
  - "urn.stkKod BARKOD DEĞİL — ürün eşleşmesi daima stkID üstünden."

entities:
  # ERP çekirdek
  dbo.urn:
    pk: stkID
    key: [stkKod, stkAd, urnMrkID, urnKtgr2ID, urnTip, fiyatS]
    note: "stkKod barkod DEĞİL → eşleme stkID üstünden"
    urnTip: "0=normal ürün (856K), 1=gider/hizmet kalemi (250 kayıt — muhasebe, hepsi Tanımsız kategorisinde). Ölü stok sorgusunda WHERE urnTip=0 ZORUNLU."
    fiyatS: "satış/liste fiyatı (KDV dahil). Sıfır-maliyetli imputation anchor: AVG(ORT_ALIS/fiyatS) kategori bazında → ürün maliyeti = fiyatS × oran. Filtre: fiyatS>0 AND ORT_ALIS<fiyatS."
    olu_stok_exclusions:
      stkID: [81809]
      note: "81809=İskonto ve Fiyat Farkı (Kırtasiye) — muhasebe kalemi yanlış kategoride, urnTip=0 olduğu için urnTip filtresi yakalamıyor"
      kategoriler_ek: ["Zkargo", "KARGO"]
      kategoriler_ek_note: "Zkargo=alış kargo giderleri; KARGO=gelir kalemleri (stkKod KARGO1/KARGO2, stkID 144860/144963)"
    last_verified: "2026-06-17"
  bkm.Urunbilgi: {tip: view, note: "en pratik ürün lookup: stkID, BarkodAna, mrkAd, Kategori3, SatisFiyat"}
  dbo.irsHrk:
    pk: ehID
    grain: "birleşik hareket (ehID+ehstkID+ehTip)"
    note: "ciro/stok ana kaynağı"
    columns:
      ehTrhS: {label: "İş tarihi", description: "Stok/ciro DAIMA bu tarih (=irs.eTarihS). hrkTarih=audit log."}
      ehTip: {label: "Hareket tipi", description: "1/4/100=satış, 3/5/101=iade → codes.yaml"}
      ehAdetN: {label: "Adet (net)", description: "Çıkışta NEGATİF (satış/iade)"}
      ehTutarN: {label: "Tutar KDV hariç", description: "= ehTutar−ehIndirim. DAIMA POZİTİF — iade sign'ı CASE ile çevir"}
      ehAltDepo: {label: "Alt depo", description: "ehAltDepo=0 filtresi ZORUNLU (raporlarda)"}
  dbo.irs: {pk: eID, key: [eNo, eMekan, eFirma, eTip, eTarihS, eGC], note: "evrak başlık"}
  dbo.frm: {pk: frmID, key: [frmKod, frmAd, frmTip]}
  dbo.mekan_vw: {tip: view, key: [mekanID, mekanAd, mekanTip]}

  # POS
  EncoreMerkez.dbo.Sales: {pk: Id, key: [Date, CustomersId, UsersId, DocumentsTypeId, GrossTotal, DiscountTotal, VatTotal], note: "Date=satış datetime (SaleDate DEĞİL); header indirim=DiscountTotal (DiscountTotalDirect/Campaign SalesProducts kalem-düzeyinde, header'da YOK); net KDV-hariç=GrossTotal-DiscountTotal-VatTotal. Sales'te IsValid YOK (o SalesProducts'ta). 18.06 sys.columns doğrulandı"}
  EncoreMerkez.dbo.SalesProducts: {key: [SalesId, ProductsId, BarcodeNo, DiscountTotalDirect, DiscountTotalCampaign, IsValid], filter: "IsValid=1 ZORUNLU", note: "kalem-düzeyi indirim DiscountTotalDirect (toplam); DiscountTotalCampaign alt-küme"}
  EncoreMerkez.dbo.Products: {pk: Id, key: [Code], note: "Code=urn.stkID köprüsü"}
  DerinCrm.dbo.Customer: {pk: Id, key: [Name, PhoneNumber, CardNumber, Group1Id], note: "Id=Sales.CustomersId; Group1Id=2 personel"}

  # WMS / depo (10.06)
  depo.emir: {pk: emID, key: [emTip, emBhTip, kTarih, emDepoID], note: "iş emri; emTip=görev (depo.emTip lookup)"}
  depo.emirAyr: {pk: emAyrID, key: [emPaletID, emAdet, emTamam, emKisi, emTarih], grain: "TOPLAMA operasyonu (picking)", note: "emKisi=gerçek operatör"}
  depo.emirSat: {key: [satPID, satEmirID], note: "palet↔emir köprü (2 kolon)"}
  depo.paletIcHrk: {key: [piAdet, pikKisi, pikTarih, pGC, pHrkTip, piIrsID], grain: "iç hareket (raflama+toplama)", note: "pikKisi=operatör"}
  depo.paletSevkLog: {key: [psAdet, psKabulİrsID, psSevkİrsID, psEmirID, kKisi], note: "sevk-çıkış; kKisi=sistem-kullanıcısı (operatör DEĞİL)"}
  # WMS palet-stok (12.06 — gerçek üretim sorguları D:\Belgelerim\sql\)
  depo.paletUrnTnm: {key: [pUStkID, pUBarkod, pUAdetN, pUID], grain: "palet × ürün satırı", note: "pUStkID=urn.stkID, pUAdetN>0=dolu, pUID=palet ref (paletTnm.pID). Depo anlık raf/havuz stoğu kaynağı."}
  depo.paletTnm: {pk: pID, key: [pSonPozID], note: "palet başlık; pSonPozID=adres.adrsID (paletin son konumu)"}
  depo.adres: {pk: adrsID, key: [adrsAlanTipID, adrsAd], note: "depo lokasyon; adrsAlanTipID=alan tipi (codes), adrsAd özel ('JokerHavuz'/'TRNS'/'CK01')"}
  depo.stok_adres_palet_vw: {tip: view, key: [PaletID, stkID, stok, adrsAlanTipID], note: "palet×adres×stok düz view (palet içerik sorgusu)"}
  ent.JokerCKStok_vw: {tip: view, key: [pUStkID, toplamAdet], note: "Joker CK (çıkış kasası) stok view"}
  ent.odak_depo_Stok: {tip: tablo, key: [stkID, StokMiktar], note: "ODAK (e-tic) depo fulfillment stoğu. stkID=urn.stkID (1:1, 486K ürün, ~7,16M adet). LOKAL DerinSIS (linked-server BKM_STOKLAR.MERKEZDEPO_STOK'tan AYRI değer/kaynak; bunu kullan — hızlı). Dashboard ürün drill 'ODAK' kolonu. 14.06 keşif."}
  stokSonAltDepo_vw: {tip: view, key: [ehstkID, ehMekan, ehAltDepo, stok], note: "ANLIK mağaza+depo stok (ehAltDepo=0 zorunlu). ehMekan POZİTİF stok: 12=Merkez Depo (~2,14M), 1=FSM, 4477=Özlüce, 4478=İst.Yolu, 60398=Heykel. NEGATİF/transit-sanal (hariç tut): 4480 (-348K), 26142 (-2,16M), 4835 (0). Dashboard ürün drill stok dağılımı = mekan IN (1,4477,4478,12) — şube toplamı irsHrk ehAdetN toplamıyla BİREBİR (14.06: 102+144+613=859). Envanter/cari özet kaynağı."}
  # JOKER WMS toplama (bekleyen sipariş raflama)
  ODAKJOKER.JOKER.dbo.J_DEPO_TOPLANACAK: {key: [ORDERREF], note: "depoda toplanacak sipariş listesi (ORDERREF=J_ORDERS.ORDERID)"}
  ODAKJOKER.JOKER.dbo.J_DETAIL_BOXES: {key: [ITEMREF, DETAILREF, LOGICALREF], note: "raflanmış koli; COUNT=raflanmış adet. İhtiyaç = sipariş − raflanmış."}
  ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS_COMP: {key: [DETAILREF, COMPITEMREF, COMPBARCODE, QUANTITY], note: "kompozit/set ürün açılımı (J_ORDER_DETAILS.LOGICALREF=DETAILREF)"}

  # Hedef / veri ambarı
  BKMDATA.dbo.Hedef: {key: [mekanId, yil, ay, gun, ktgId, hedef], grain: "mekan × kategori × GÜN (günlük satır)", note: "ay hedefi = SUM(hedef) WHERE yil,ay. mekanId 1/4477/4478 retail, 12=Depo. ktgId=urnKtgr2.ktgrID (bridge hedef-kategori). Haziran 2026: FSM 14,25M/Özlüce 23,5M/İst.Yolu 13M/Depo 77M. M1 paydası."}

  # PDKS (işgücü — OPENQUERY)
  pdks: {tip: openquery, filter: "Per_Grp1='MAĞAZALAR'", magaza_eslesme: "Per_Grp2 = mağaza adı", note: "OPENQUERY iç literal ''..''  — vrd.Vardiya tabloları GEREKMEZ. S1 SPLH + işgücü üçgeni kaynağı."}

  # E-ticaret
  ODAKJOKER.JOKER.dbo.J_ORDERS: {pk: LOGICALREF, biz_key: ORDERID, key: [CLIENTREF, PAYDEFREF, CARGOREF, DELIVERYREF, APPLICATION, TOTALPRICE, CARGOPRICE, SERVICEPRICE, VOUCHERCODE, STATUS, CARGODELIVERYSTATUS]}
  ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS: {key: [ORDERREF, ITEMREF, QUANTITY, SELLINGPRICE, SELLINGPRICEWITHOUTDISCOUNT], note: "ORDERREF=J_ORDERS.ORDERID"}
  ODAKJOKER.JOKER.dbo.J_ITEMS: {pk: LOGICALREF, key: [NAME, BRAND, DERINSIS_ID], note: "BRAND direkt marka; DERINSIS_ID=urn.stkID"}

  # EncoreMerkez kampanya
  EncoreMerkez.dbo.SalesProductCampaigns: {pk: Id, key: [SalesId, CampaignId, CampaignName, TotalDiscount], grain: "satış × kampanya kalemi", note: "TotalDiscount NEGATİF=indirim. SalesId→Sales.Id. M2 kampanya raporu kaynağı."}

  # ── BKMMaliyet — FIFO maliyet sistemi (asıl proje D:\Dev\fifo; pusula=sema). 2026-06-19 ──
  # ERP kaynağı: DerinSISBkm (prod) / DerinSIS_Local (BT-FIKRI demo). SP master: fifo/v2-production/00_V2_MASTER_FULL.sql
  BKMMaliyet.dbo.FifoKatman:
    pk: KatmanId
    key: [StkId, GirisTarihi, KaynakTip, GirisMiktar, KalanMiktar, BirimMaliyet, Durum]
    grain: "ürün × giriş katmanı (FIFO maliyet havuzu, mekan-bağımsız PARTITION BY StkId)"
    note: "BirimMaliyet<=0 OLAMAZ (fifo-domain §6). KaynakTip→codes. Eldeki birim maliyet=SUM(KalanMiktar*BirimMaliyet)/SUM(KalanMiktar) WHERE KalanMiktar>0."
    last_verified: "2026-06-19"
  BKMMaliyet.dbo.FifoCikisDetay:
    pk: CikisId
    key: [StkId, HareketTarihi, HareketTipi, MekanId, KatmanId, Miktar, BirimMaliyet, CikisTutar, SatisTutar]
    grain: "satış/iade çıkış × tüketilen katman segmenti"
    note: "marj = SatisTutar(gelir) − CikisTutar(SMM). CikisTutar COMPUTED=Miktar×BirimMaliyet (UPDATE edilemez). SatisTutar=irsHrk ehTutarN miktar-oranlı. HareketTipi SATIS/IADE. çıkış SMM=irsHrk kaynaklı (irs/irsAyr DEĞİL)."
    last_verified: "2026-06-19"
  BKMMaliyet.dbo.FifoAcilisEnvanter: {pk: "(EnvanterTarihi,MekanId,StkId)", key: [StokMiktar], note: "açılış stok snapshot=irsHrk KÜMÜLATİF (ehTrhS<=devir, ehAltDepo=0, mekan 1/12/4477/4478) — GEÇMİŞ-doğru, anlık-stok view DEĞİL."}
  BKMMaliyet.dbo.FifoSorunluStoklar: {pk: "(EnvanterTarihi,MekanId,StkId,SorunTipi)", key: [StokMiktar, Aciklama], note: "SorunTipi→codes (FIYAT_YOK/ALIS_YOK/...TAMAMLANDI)"}
  BKMMaliyet.dbo.FifoDevreDisiUrunler: {pk: StkId, key: [Sebep, EkleyenKullanici], note: "non-inventory (poşet-bagging/gider/hediye-çeki/demirbaş). Envanterde KALIR, FIFO katmanı kurulMAZ. fifo-domain §2/§3: stkID-curated (isim-pattern DEĞİL — 'Geri Dönüşüm' çocuk kitabı/'Poşet Dosya' kırtasiye gerçek ürün)."}
  BKMMaliyet.dbo.FifoFallbackFiyatlari: {pk: "(StkId,SatinalmaSarti,MekanId)", key: [BirimMaliyet], note: "fallback fiyat; SatinalmaSarti='DEVIR_FALLBACK' açılışta devreye girer"}
  BKMMaliyet.dbo.OrtalamaAylikMaliyet: {pk: "(YilAy,StkId)", note: "aylık ortalama maliyet (FIFO'dan bağımsız) = (AyBaşıTutar+GirişTutar)/(AyBaşıMiktar+GirişMiktar)"}
  # ERP kaynak (FIFO tüketir): DerinSIS irsHrk(stok/çıkış), fat+fatAyr(alış), fytOzl(satınalma şartı fiyatı), bkm.UrunBilgi(stkID/SatisFiyat/SonAlis/Kategori3/KatAna)
