    perf_notu: "Rol çıkarımında kategori-payı hesabı için satır-başı korelasyonlu alt-sorgu (CROSS APPLY içinde ikili subquery) 24,9s sürdü — KULLANMA. Doğrusu: kullanıcı×kategori sayımını TEK GROUP BY ile al, payı dışarıda (Python/C#/pencere fonksiyonu) hesapla. sql-server-conventions 'filtreyi aşağı it / korelasyonlu agregat kaçın' kuralının aynısı."
    rol_zaman_bagimliligi: "⚠️ **ROLLER ZAMAN İÇİNDE DEĞİŞİYOR — atıf ZAMAN-DUYARLI olmalı.** Kanıt: omerfaruk.kirmaci bugün İst.Yolu md yrd, ÖNCEDEN akademi şefiydi (kullanıcı teyidi 2026-08-18). Bugünkü unvanı geçmiş kararlara etiketlemek yanlış fonksiyona atıf üretir (ör. 2025 akademi kararları 'md yrd kararı' diye okunur). GEREKLİ: rol kaydına GEÇERLİLİK TARİHİ (rol_baslangic/rol_bitis) — statik whitelist YETMEZ. Pratik çözüm: (a) atıf raporunda kişi + karar TARİHİ birlikte gösterilir, rol etiketi o tarihteki rolden okunur; (b) rol geçmişi İK tarafında (iky şeması) veya elle tutulan tabloda tutulmalı; (c) rol geçmişi yoksa atıf KİŞİ + ŞUBE + KATEGORİ ile yapılır, UNVAN etiketi kullanılmaz. Kardeş tuzak: hesap_birlestirme (aynı kişi çok hesap) — biri kimlik, bu zaman boyutu."
