  bekleyen_siparis_il_proxy:
    details: "SINIR: CCITY müşterinin FATURA/kayıt ili, teslimat ili olmayabilir — sipariş başka ile gönderilecekse bu sayı yanıltır. 'Bekleyen sipariş nerede bekliyor' sorusuna değil, 'kime gidecek' sorusuna yaklaşık cevap verir."
