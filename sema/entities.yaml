    note: "Bekleyen sipariş (SENDDATE NULL) raporunda İL = müşteri ili `J_ORDER_CLIENTS.CCITY`. Teslimat ili `J_ORDER_DELIVERY_ADDRESS.DCITY` bu siparişlerde DOLU DEĞİL (kargoya verilmemiş; ORDERCODE join 0 satır döndü) → CCITY vekil (proxy) olarak kullanılır. Aşama kodları: STATUS 1000=Toplanma · 3001/3003/3004=Önsipariş-Hazırlanan · 3006=Temin Bekleyen. L3 raporu."
    rule: "İl kırılımı için önce `bridges:orders-client` ile join kur (CLIENTREF→LOGICALREF), SONRA CCITY'yi OKU. CCITY bir join anahtarı değildir. DCITY bekleyen siparişte kullanılamaz; sevk edilmiş siparişte tercih edilmelidir (gerçek teslimat ili)."
