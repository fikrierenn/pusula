    note: >-
      View gövdesi okundu: paletUrnTnm ⋈ paletTnm(pID=pUID) ⋈ adres(pSonPozID=adrsID),
      WHERE pUAdetN > 0, Stok = SUM(pUAdetN). Yani "WMS Stok" ile paletUrnTnm.pUAdetN
      AYNI ŞEYDİR — ayrı bir sayım değil, aynı kolonun gruplanmışı.
    gizli_kalan: >-
      ⚠ `pUAdetN > 0` süzgeci yüzünden view SIFIR ve NEGATİF satırları GÖSTERMEZ.
      ÖLÇÜLDÜ 2026-09-09: paletUrnTnm 136.945 satırın 80.108'i sıfır, 43'ü negatif
      (−907 adet). "WMS'te yok" demek "paletUrnTnm'de kaydı yok" demek DEĞİL.
    grain: "(pUID, pUStkID) TEKİL — mükerrer ikili 0. View'deki SUM kozmetik."
    adres_kapisi: "adres JOIN'i INNER → pSonPozID'si depo.adres'te olmayan palet view'de görünmez."
    evidence: "2026-09-09 — sys.sql_modules view gövdesi + paletUrnTnm sayımları."
    last_verified: "2026-09-09"

  DerinSISBkm.depo.emir + emirAyr:
