      ⚠⚠ `emirAyr.emSonPozID` bir POZİSYON DEĞİL, **stkID (ÜRÜN)**. Kanıt:
      `paletUrnTnm ON pUID = emİlkPozID AND pUStkID = emSonPozID`. `emİlkPozID` = PALET
      (Türkçe İ ile; ASCII yazım Err 207). `emAyrID` = EMİR id (satır id değil; satır no
      `emSira`). Bu üç ad karıştırılırsa sorgu sessizce boş/yanlış döner.
    sayim_emri_deseni: >-
      Fiziki sayım emri: emIlkAdres = emSonAdres = adrsID (YERİNDE sayım, taşıma yok) ·
      emAdet = sistemin iddia ettiği adet · emTamam = 0 · emDurum 0 açık / 1 kapalı.
      Emir kapanışı ve sayacak terminaller `dbo.BKM_TerminalSayimKullaniciEkle` ile
      `depo.emirTerm`e yazılır (o SP'de termID + 17 termKod GÖMÜLÜ — kadro değişince bayatlar).
    evidence: "2026-09-09 — WMS-GunlukSayimEmiri job gövdesi + BKM_TerminalSayimKullaniciEkle (667 krk)."
    last_verified: "2026-09-09"

