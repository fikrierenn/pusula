    rol_haritasi: "İSİMLİ HESAP → ROL/ŞUBE (kullanıcı teyidi 2026-08-18, her hesap TEK şube): eren.boran2 = İST.YOLU mağaza MD YRD (29.253 talep, %99,5 onaylı, 131 aktif gün, 26.11.2024→13.08.2026) · eren.boran = AYNI KİŞİ ikinci hesabı (İST.YOLU, 778 talep, 6 gün) · sirac.yigit = ÖZLÜCE mağaza MD YRD (441 talep 2 GÜNDE, yalnız 62 onaylı) · seyda.cindan = ÖZLÜCE **Çocuk Kitabı kategori/reyon sorumlusu** (15.231 talep, %100 onaylı, 52 gün; talebinin %99'u Çocuk Kitabı — 15.076 talep/8.047 ürün/27.384 adet; ürün-deseninden çıkarıldı 2026-08-18) · omerfaruk.kirmaci = İST.YOLU mağaza MD YRD (358 talep TEK GÜNDE 19.04.2026, %100 — tek seferlik toplu iş) · HARİÇ: hakan.cetin (yazılımcı) · kubra.kulaksizoglu (iç denetim/iş geliştirme). FSM'de isimli hesap YOK — yalnız reyon hesapları (fsm.kultur/akademi/oyuncak/kirtasiye/cocuk2/sinav/hazirlik1)."
    hesap_birlestirme: "⚠️ **eren.boran + eren.boran2 AYNI KİŞİ** (İST.YOLU md yrd, iki hesap). Atıfta BİRLEŞTİRİLMELİ — yoksa aynı kişi iki alıcı sayılır, hem hacim hem isabet oranı bölünür. Genel kural: isimli hesaplarda ad-soyad eşleşmesi + aynı mekan → tek kişi varsay, kullanıcıya teyit ettir."
    normalizasyon: "Atıf metriği **AKTİF GÜN sayısına normalize edilmeli**, mutlak talebe değil: eren.boran2 131 aktif gün (süreklilik) vs omerfaruk.kirmaci 358 talep / 1 GÜN (tek seferlik toplu iş) vs sirac.yigit 441 talep / 2 gün. Aynı 'talep sayısı' bambaşka davranışlar demek. Kardeş kural: atif_adalet_uyarisi (mutlak sayı yasak)."
    onay_kontrol_nuansi: "'Onay = formalite' tespiti YUMUŞATILDI: genel onay oranı ~%100 ama sirac.yigit 62/441 (%14) ve ozl.oyuncak 896/1.357 (%66) gösteriyor ki onay BAZI durumlarda gerçekten reddediyor → onay adımı tümüyle formalite değil, seçici çalışıyor. Neyin reddedildiği ayrı analiz konusu (reddedilen talep = engellenen kötü karar mı, yoksa süreç tıkanması mı?)."
    yapisal_bulgu: "**KARAR KATMANI = MAĞAZA MÜDÜR YARDIMCILARI**, merkezî satınalmacı DEĞİL (kullanıcı teyitleri 2026-08-18: eren.boran/boran2 · sirac.yigit · omerfaruk.kirmaci hepsi md yrd). Yani sipariş TALEBİ mağaza yönetiminde doğuyor, merkez ONAYLIYOR. Sonuç: (a) accountability hedefi 'satınalmacı' değil TALEP EDEN MAĞAZA YÖNETİCİSİ + onaylayan; (b) İST.YOLU 3 isimli hesap (eren×2, omerfaruk) · ÖZLÜCE 2 (sirac, seyda) → kişi-seviyesi atıf bu iki şubede mümkün; (c) FSM'de isimli hesap YOK → FSM kararları yalnız reyon hesaplarından, kişiye atıf İMKÂNSIZ (şube-arası kişi kıyası yapılamaz)."
    rol_cikarim_heuristigi: "Bilinmeyen hesabın rolü ÜRÜN DESENİNDEN çıkarılabilir — 'en büyük kategori payı' + 'aktif gün': MD YRD = yayılmış (eren.boran2 12 kategori/%57 · eren.boran %44 · sirac.yigit %43) · REYON/KATEGORİ sorumlusu = konsantre + sürekli (seyda.cindan %98/52 gün · ist.cocuk %98 · ist.kultur %85). ⚠️ **SINIR: konsantrasyon UNVANI değil DAVRANIŞI ölçer** — omerfaruk.kirmaci md yrd olmasına rağmen %99 konsantre çünkü TEK GÜNDE 358 talep (bir kerelik toplu sipariş). Heuristik daima aktif-gün ile birlikte okunur; tek-seferlik işlerde yanıltır. Kesin rol için kullanıcı teyidi şart."
    perf_notu: "Rol çıkarımında kategori-payı hesabı için satır-başı korelasyonlu alt-sorgu (CROSS APPLY içinde ikili subquery) 24,9s sürdü — KULLANMA. Doğrusu: kullanıcı×kategori sayımını TEK GROUP BY ile al, payı dışarıda (Python/C#/pencere fonksiyonu) hesapla. sql-server-conventions 'filtreyi aşağı it / korelasyonlu agregat kaçın' kuralının aynısı."
