  # PDKS VARDİYA PLANI (TagMod) — 2026-09-05 keşif, sorgular/2026-09-05-vardiya-plani-ciro-uyum.sql
  pdks_vardiya_plani:
    source: "OPENQUERY([PDKS]): TTagZei.TZe_TagMod (kişi-güne ATANAN PLAN kodu) → TTagMod (model tanımı). Plan penceresi = Tag_KernVonZeit–Tag_KernBisZeit, planlı mola = Tag_Pau1VonZeit–Tag_Pau1BisZeit."
    grain: "kişi × gün → 1 plan kodu (TagMod). Fiili = aynı satırların TZe_VonZeit/BisZeit segmentleri."
    plan_vs_fiili: "PLAN = TagMod modeli (TTagMod). FİİLİ = segmentler. İkisi AYRI ölçüm — 'vardiya planı doğru mu' sorusu plan eğrisiyle, 'plana uyuldu mu' sorusu segmentlerle cevaplanır. TZe_TagSollzeit = planlı saat (7.3 = 7s30dk, ondalık DEĞİL saat.dakika)."
    zeitart_kodlari: "TZe_ZeitArt: NCAL = normal çalışma segmenti · FM1/FM3 = fazla mesai dilimleri (FM3 hafta tatili/genel tatil ağırlıklı). TZe_AbwArt: NG = NORMAL GÜN (devamsızlık DEĞİL, herkeste var) · RESTA = resmî tatil · DESIZ = 'DEVAMSIZ' · DOGUM/UCSIZ/HASTA."
    desiz_tuzagi: "⚠ **DESIZ ('DEVAMSIZ') devamsızlık oranı olarak RAPORLANMAZ.** 29.08-04.09.2026 ölçümü: 217 kişi-günün 178'i TagMod='SABIT' (03:00-03:01 kukla pencere = saat takibi olmayan kadro), 22'si 818, 14'ü TagMod'suz; **G1-G4 vardiyalı personelde SIFIR**. Yani kod, kart basmayan kadroyu otomatik 'devamsız' işaretliyor. Ham oran alınırsa Özlüce %25,7 çıkar ve YANLIŞ olur."
    sabit_modeli: "TagMod SABIT/SBT9 penceresi 03:00-03:01 (kukla) → plan eğrisine KATILMAZ, ayrı sayılır. Fiili kişi-saatin yalnız %1,5'i bunlarda (7.204 kişi-saatin 107'si) → plan↔fiili kıyası güvenli."
    magaza_ayraci: "Per_Grp1 LIKE 'MA%LAR' (MAĞAZALAR) + LTRIM(RTRIM(Per_Grp2)) IN ('FSM','ÖZLÜCE','İST.YOLU'). KAFELER ayrı Per_Grp1. Per_Grp2'de HEYKEL/ŞURA da var (POS'ta karşılığı yok). Per_Grp2 sondaki boşlukla gelir → LTRIM/RTRIM zorunlu."
    vardiya_katalogu: "Kalıcı olan MODEL YAPISI (kodlar değişebilir, liste değil kural): mağaza vardiyaları iki ana dalga = sabah (G1 09:00-17:30, G2 10:00-18:30) + akşam (G3 13:30-22:00, G4 14:30-23:00); ofis/yönetici 9 saatlik tek dalga (818/830-1/919). HER modelin molası TEK ve SABİT bir saate çakılı (G3→17:00, G2→13:00, G4→18:00) — kademeli mola YOK. Güncel pencereler TTagMod'dan CANLI okunur."
    evidence: "2026-09-05 canlı — 942 kişi-gün / 183 personel / 2.267 segment (29.08-04.09.2026). Fazla mesai 1.423 kişi-saat/hafta (FM3 1.036 + FM1 387). ⚠ DÜZELTME (aynı gün, ham okutmayla): 'mola boşluğu ölçüldü' İDDİASI YANLIŞTI — TTagZei segment boşluğu türetilmiş, bkz pdks_kart_okutma."
    last_verified: "2026-09-05"
    ttl_days: 180

  # PDKS HAM KART OKUTMASI (TZeiBuf) — 2026-09-05, TTagZei'nin türetilmiş olduğunu kanıtladı
  pdks_kart_okutma:
    source: "OPENQUERY([PDKS]) TZeiBuf: ZBu_ErfDatum (tarih) + ZBu_ErfZeit (saat) + ZBu_PersNr + ZBu_LesNr (okuyucu) + ZBu_Storniert (iptal) + ZBu_Benutzer (elle giriş; BKM'de HEP NULL = sahte okutma yok). Tam geçmiş tutuluyor, buffer değil."
    grain: "tek kart okutması (kişi × an)"
    okuyucu_magaza: "LesNr → mağaza: 1=FSM · 2=ÖZLÜCE · 4,5=Y.YOLU (İst.Yolu) · 3=HEYKEL · 10=ŞURA Heykel. TLesTab.Les_LesOrt'tan canlı okunur."
    giris_cikis_ayrimi_YOK: "⚠ `ZBu_ErfFunk` BKM'de TEK DEĞER (20) — giriş/çıkış kodu AYRIMI YOK. Yön, gün içi sıraya göre çıkarılır (ilk=giriş, son=çıkış). 'ErfFunk=1 giriş / 2 çıkış' varsayımı burada GEÇERSİZ."
    MOLA_OKUTULMUYOR: "⚠⚠ **Mola için kart okutulmuyor.** 29.08-04.09.2026: 940 kişi-günün 915'inde TAM 2 okutma, 25'inde 1, **4 okutmalı gün SIFIR**. Sonuç: `TTagZei`'deki mola boşluğu (ör. G3'te 17:00-18:00) ÖLÇÜM DEĞİL, TagMod modelinden TÜRETİLMİŞ. 'Saat X'te kaç kişi sahada' sorusunun mola kısmı VERİYLE CEVAPLANAMAZ — plan varsayımıdır. (Bu kayıt, 'segment boşluğundan mola ölçtüm' hatasının düzeltmesidir.)"
    eksik_okutma_plandan_tamamlanir: "`TTagZei.TZe_InfKz='m'` (+ InfKzKo/InfKzGe='m') = eksik okutma bayrağı; sistem günü TagMod planından TAMAMLAR ve bordroya tam gün yazar. Ölçüm: 42 kişi-gün / 92 segment; kart okutması 22'sinde SIFIR, 18'inde 1. O günlerde yazılan 322 kişi-saat (haftalık 6.798'in %4,7'si), hiç okutması olmayanlar 177 ks. Kontrol zayıflığı — İK/iç denetim konusu."
    yuvarlama: "TTagZei kayıtlı başlangıç/bitiş ≠ kart saati. Giriş okutması kayıtlı başlangıçtan medyan 4 dk ÖNCE, çıkış okutması kayıtlı bitişten medyan 2 dk SONRA (birebir eşleşme giriş %6,4 · çıkış %11,6). Kart-içi süre 7.905 ks vs kayıtlı çalışma 6.798 ks (fark %14 = model molası + yuvarlama)."
    kullanim_kurali: "Vardiya/kapsama analizinde: **giriş-çıkış SINIRLARI kartla ölçülür (güvenilir), mola ölçülemez**. Kapsama eğrisi iki sınırla verilir — üst sınır kart-içi süre (mola düşülmemiş), alt sınır model molası düşülmüş. Tek rakam vermek ölçümü olmayan varsayımı ölçüm gibi sunar."
    evidence: "2026-09-05 canlı — 1.876 okutma / 940 kişi-gün (29.08-04.09.2026, FSM+Özlüce+İst.Yolu). Arşiv: sorgular/2026-09-05-vardiya-plani-ciro-uyum.sql blok 6-9."
    last_verified: "2026-09-05"
    ttl_days: 180

