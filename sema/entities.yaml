  ent.odak_depo_Stok: {type: table, key: [stkID, StokMiktar], note: "ODAK (e-tic) depo fulfillment stoğu. stkID=urn.stkID (1:1, 487.567 satır, 349.756 çeşit stokta, ~7,0-7,16M adet). LOKAL DerinSIS (linked-server BKM_STOKLAR.MERKEZDEPO_STOK'tan AYRI değer/kaynak; bunu kullan — hızlı). Dashboard ürün drill 'ODAK' kolonu. ⚠ 'ODAK stok' sorulduğunda KANONİK = BU TABLO; stokSonAltDepo_vw mekan-toplamıyla HESAPLAMA (24.06 vakası: vw mekan 26142 İPTAL-Transfer 129K dahil edilip sessiz over-count yapıldı). 14.06 keşif, 24.06 teyit.", last_verified: "2026-08-18"}
  bkm.UrunBilgi: {type: view, pk: stkID, key: [stkID, mrkAd, Yazar, SatisFiyat, SonAlis, Kategori3], note: "Denormalize ÜRÜN MASTER VIEW (sys.objects=VIEW) — en pratik ürün lookup; tek view'dan marka+yazar+maliyet+fiyat+kategori (urn+urnMrk join'e gerek yok, rapor scriptleri buradan). Kolonlar: stkKod/BarkodAna/stkAd, mrkID/mrkAd(marka=yayınevi), YazarId/Yazar, frmID/FirmaAd(ana tedarikçi), KatAna/Kat1..5/Kategori2/Kategori3(metin hiyerarşi; Kategori3=urnKtgr2.ktgrAd ör 'Hazırlık Kitapları'), SatisFiyat(üst/liste fiyat birim), SonAlis(son alış maliyet birim, 0=güncellenmemiş), OzelWebFiyat, AlisKDVYuzde/SatisKDVYuzde, urnTip(0=normal), AnaTedarikciId. 24.06 kolon+tip teyit (eski kısa stub ile birleşti).", last_verified: "2026-08-18"}
  dbo.bakiyeVDGG_vw: {type: view, key: [cKod, borc, alacak, bakiye, GecenB, GelecekB], note: "Cari bazlı bakiye + vade yaşlandırma. cKod=frm.frmID. bakiye=net (alacak+borç-işaretli; borç negatif depolanır). GecenB=vadesi GEÇMİŞ tutar, GelecekB=YAKLAŞAN (henüz vadesi gelmemiş). Risk limiti = frm.frmBakiyeLimit (aşım = ABS(bakiye)>limit). Dashboard /cari-risk (B-124). ⚠ AĞIR ~8s (tüm car agg). frmKod prefix: 320=satıcı,120=alıcı,100/101/103/300=banka/çek,6xx/7xx=gider. Diğer: bakiye_vw/bakiyeGrup_vw, satOdeBakiyeVDGG_vw (satıcı), carOdemePlan_vw (ödeme planı), cek_vw (çek). 2026-06-25 canlı.", last_verified: "2026-08-18"}
  depo.stok_adres_palet_vw:
    type: view
    key: [adrsAlanTipID, adrsID, adrsAd, PaletID, stkID, Stok]
    grain: "adres (hücre) × palet × ürün — WMS HÜCRESEL stok"
    note: "**MERKEZ DEPO STOĞUNUN TEK DOĞRU KAYNAĞI** (kullanıcı direktifi 03.09.2026:
      'ERP merkez depo defteri senkron sorunu var, her zaman WMS stoklarına bakmalısın').
