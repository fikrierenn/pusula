  stokSonAltDepo_vw: {type: view, key: [ehstkID, ehMekan, ehAltDepo, stok], note: "ANLIK mağaza+depo stok (ehAltDepo=0 zorunlu). ⚠⚠ **MEKAN 12 (MERKEZ DEPO) GÜVENİLMEZ — K-37, ölçüm 2026-09-03**: view'ın mekan 12 değeri irsHrk defterini taşıyor; pozitifler 6.230.071, negatifler −4.242.441 (fiziksel olarak imkânsız), net 1.987.630. Resmî WMS snapshot 4.249.866 diyor. **Merkez depo stoğu artık `bkm.StokAyBakiyeMekanBazli` (Kaynak='WMS', son Dönem) üzerinden okunur** (dashboard OdakQueries/RefQueries.Envanter + scripts/export_odak_stok.py düzeltildi). KAPSAM FARKI: WMS rafta duran SATILABİLİR malı tutar; view ayrıca ambalaj/sarf da içerir ('Genel' kategorisi 18 çeşit / 2.161.171 adet = Geri Dönüşüm Kağıt 1.758.386 + poşetler ~370K) ve kitap tarafında defter kalıntısı taşır (Kitap çeşidi view 1.254 → WMS 127; Hazırlık 31 → 2). MAĞAZA mekanları (1/4477/4478) view'da DOĞRU (irsHrk ve WMS snapshot ile %0,3-4,8 içinde tutuyor). ehMekan POZİTİF stok: 1=FSM, 4477=Özlüce, 4478=İst.Yolu, 60398=Heykel. NEGATİF/transit-sanal (hariç tut): 4480 (-348K), 26142 (-2,16M), 4835 (0). Dashboard ürün drill stok dağılımı = mekan IN (1,4477,4478,12) — şube toplamı irsHrk ehAdetN toplamıyla BİREBİR (14.06: 102+144+613=859). Envanter/cari özet kaynağı."}
  # JOKER WMS toplama (bekleyen sipariş raflama)
  # ── FİZİKSEL SAYIM ALT SİSTEMİ (keşif 2026-09-11) ───────────────────────────────
  # ⚠ NEDEN ÖNEMLİ: kurallarımız "WMS ile defter çelişirse sayı ŞÜPHELİdir ve fiziksel
  # sayım yapılmadan karara dayanak alınmaz" diyordu (sql-server-conventions § WMS DE
  # MUTLAK DOĞRU DEĞİL) — ama o fiziksel sayımın NEREDE durduğu sema'da HİÇ YOKTU.
  # 36 obje var; aşağıdakiler CANLI olanlar (satır sayısı ölçüldü 2026-09-11).
  # ⚠ YAZMA: `bkm.Sayim*` ailesi app-owned'dır ama BU DEPO YAZMAZ — kullanıcı
  # 2026-09-11: "mağaza sayımlarını bizim yazdığımız yapı yönetiyor". Buradan SALT-OKUMA.
  sayim-yazma-yolu-SP-uzerinden:
    type: rule
    uses: [entities:bkm.SayimEmirBaslik, entities:bkm.SayimLog]
    note: >-
      SAYIM ALT SİSTEMİNE YAZMA YOLU SP'DİR, DOĞRUDAN TABLO DEĞİL.
      Kullanıcı 2026-09-11: "bkm şemasında mağaza sayım yapıları var, hem tablo hem
      SP'ler" · "mağaza sayımlarını bizim yazdığımız yapı yönetiyor".
      ⚠ BU DEPO İÇİN SONUÇ: sayım tarafı SALT-OKUMA. `erp-write-policy.md` izin listesinde
      bu tablolar YOK ve olmamalı — yazan taraf BKM'nin kendi uygulamasıdır, bu depo değil.
      Bir sayım kaydını "düzeltmek" gerekiyorsa yol SP çağrısıdır ve o da bu deponun işi değil.
    measurement: >-
      2026-09-11 — sys.objects taraması: 19 sayım prosedürü/fonksiyonu (bkm 14 · depo 3 ·
      dbo 2). HİÇBİRİ şifreli değil (`sys.sql_modules.definition` hepsinde okunur).
      En yeni değişenler: `bkm.ReyonSayimEmriOlustur` 2026-04-14 · `bkm.SayimIrsaliyeBaslikOlustur`
      2026-04-03 · `bkm.SayımEksiStokGetir` 2026-01-14 · `depo.emirIptaldenSayimEmri` 2026-01-20.
      JOB→SP eşleşmesi: `ReyonSayimiDuzenle` ve `WMS-GunlukSayimEmiri` canlı (2026-09-11
      başarılı); `Depo Iptal Emir Satırlarına Sayım oluştur` KAPALI ve hiç koşmamış
      (`sysjobservers.last_run_date = 0`) — arkasındaki SP `depo.emirIptaldenSayimEmri`.
    ayrinti:
      turkce_i_tuzagi: >-
        SP adında da Türkçe ı var: `bkm.SayımEksiStokGetir` (ASCII `SayimEksiStokGetir`
        DEĞİL). Tablo tarafındaki `depo.sayım`/`depo.sayımAyr` ile aynı tuzak; ASCII
        yazım Err 2812/208 verir. `depo.sayimAnlik` · `depo.sayimIslemeLogu` · `bkm.Sayim*`
        ise gerçekten ASCII — yani şemada İKİ yazım BİR ARADA, tahmin edilemez, `sys`ten okunur.
