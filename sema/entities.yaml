    grain: "personel (normalize; ham perbilgi üstüne temiz katman)"
    kadro_alani: "`Kadro` = istihdam tipi bayragi: KADRO(968) · SEZONLUK(288, 01.08.2023'ten beri) · STAJYER(2) · PART-TIME/PART TIME(1+1, ayni sey iki yazim) · KISMI(1) + 12 NULL/bos. **Sezon personeli analizi bu alanla yapilir**, giris-tarihi penceresiyle DEGIL (pencere kadrolu alimi da kapsar -> sessiz yanlis sonuc; kanit metrics.sezon_personel_kohort.AYRAC_KADRO_SEZONLUK). Kadro degisikligi TARIHLENMEZ -> sezonluk->kadro donusumu izlenemez. **KORUMA:** `degismezler.json` -> `kadro-etiket-kumesi-kapali` (yeni etiket cikarsa KIRMIZI; cikan etiket sessizce KADROLU sayilirdi) + `sezonluk-etiketi-duruyor` (etiket yeniden adlandirilirsa sezonluk sifira duser). last_verified 2026-09-03."
    engelli_ayraci: "ENGELLI personel ayraci = `dbo.perbilgi.Kanun = '14857'` (SGK APHB kanun turu 14857 = 4857/30 engelli istihdam tesviki); aylik teyit `dbo.puanbil.Kanunno='14857'` (Yil+Ayindex). ⚠ `perbilgi.Ozurlulukkodu` ('E'=13/'H'=57 kayit) BUGUN AKTIF kadroda HIC dolu DEGIL ve `Malulluk` tamamen 0 -> tek basina ayrac OLAMAZ, AMA 14857 ile BIRLIKTE bakilir: Ozurlulukkodu='E' + Kanun='00000' kombinasyonu = TESVIKSIZ ENGELLI calisan (2 tarihsel kayit: MERKEZ DEPO 12.02.2025-30.11.2025 · HEYKEL 21.10.2023-10.11.2024, ikisi de artik aktif degil). Yani 14857 tek basina ALT SINIR: tesvikten yararlanilmayan engelli yalniz Ozurlulukkodu'nda gorunur ve o alan da guncel doldurulmuyor -> engelli envanteri Zirve'den TAM cikarilamaz, IK teyidi sart. ⚠ ALT SINIR: bayrak tesvikten yararlanilan engelliyi gosterir; tesvik kullanilmayan engelli calisan gorunmez. ⚠ perbilgi YALNIZ BKM_GENEL firmasini tutar -> diger 2 firmadaki (BURSA_KULTUR_MERKEZI/ASIYE_BINGOLBALI) engelli bu yolla sayilmaz. Olcum 2026-09-02: aktif 4 kisi (puanbil Tem-2026: 5). ⚠ KVKK m.6 OZEL NITELIKLI (saglik verisi) -> yalniz toplulastirilmis sayi, isim/reyon kirilimi paylasilmaz. last_verified 2026-09-02."
    perbilgi_join: "vw_PersonelDepartman.Personelno ('179-BKM') ile perbilgi.Personelno (INT) DOGRUDAN JOIN EDILEMEZ (conversion error). Firma son-eki: BKM_GENEL='-BKM' · BURSA_KULTUR_MERKEZI='-BKMH' · ASIYE_BINGOLBALI='-ABG'. Dogru join (SQL2008, TRY_CONVERT YOK): `ON p.Personelno = CASE WHEN CHARINDEX('-',v.Personelno)>1 AND ISNUMERIC(LEFT(v.Personelno,CHARINDEX('-',v.Personelno)-1))=1 THEN CONVERT(int,LEFT(v.Personelno,CHARINDEX('-',v.Personelno)-1)) END` + `WHERE v.Personelno LIKE '%-BKM'` (firma daraltmasi ZORUNLU, yoksa numara cakismasi fan-out). ⚠⚠ SAYIM SORGUSUNDA JOIN DEGIL **EXISTS** KULLAN: firma daraltmasiyla bile ayni personelno'ya birden cok perbilgi satiri dusuyor -> LEFT JOIN kisiyi COGALTIR ve as-of sayim sessizce siser. OLCULEN VAKA (2026-09-02): Ozluce 31.08.2026 kadrolu JOIN'le 42, EXISTS'le 41 (dogru; teyit Kadro bazli sayim KADRO 41 + SEZONLUK 13 = 54 kisi) -> magaza toplami 150 yerine 149, sezon ici hareket -3 yerine -4. Engelli/ozel bayrak icin desen: `CASE WHEN EXISTS (SELECT 1 FROM dbo.perbilgi p WHERE p.Personelno = <parse> AND v.Personelno LIKE '%-BKM' AND (...)) THEN ...`. GROUP BY'a EXISTS KONULAMAZ (Err 144 'Cannot use an aggregate or a subquery in ... GROUP BY') -> grup ifadesi TURETILMIS TABLODA hesaplanir, dis sorgu alias'i gruplar. last_verified 2026-09-02."
    sube_firma_eslesmesi: "⚠ MAGAZALAR UC AYRI TUZEL KISILIK: FSM · IST. YOLU · OZLUCE = **BKM_GENEL** · HEYKEL = **BURSA_KULTUR_MERKEZI** (+1 kisi ABG) · SURA = **ASIYE_BINGOLBALI**. Sonuc: (a) DerinSIS POS satisi (irs eTip 100) YALNIZ BKM_GENEL uc magazasinda var (mekan 1/4477/4478) -> Heykel ve Sura icin is hacmi OLCULEMEZ, kisi-basi/verimlilik analizine giremezler; (b) `dbo.perbilgi` yalniz BKM_GENEL tuttugu icin Heykel/Sura personelinin cikis-tarihi/bordro kaydi bu DB'den TEYIT EDILEMEZ (firma-arasi Personelno CAKISIR: 87-ABG ararken perbilgi'de BASKA kisi olan 87 doner); (c) kadro raporlari vw_PersonelDepartman uzerinden UC FIRMAYI BIRLESTIREREK dogru toplami verir. Olcum 2026-08-31: FSM 45 · Ist.Yolu 61 · Ozluce 54 (BKM_GENEL) · Heykel 34+1 · Sura 16. last_verified 2026-09-02."
    sezonluk_alim_takibi: "Sezonluk alim performansi UC olcuyle okunur, tek basina 'kac kisi calisiyor' yaniltir: (1) NORM (yonetim parametresi, briefings/*/norm-kadro-*.json) · (2) ALINAN (Igt sayimi, kohort) · (3) AKTIF (as-of o gun calisan). Ornek 2026 sezonu: Heykel norm 20 · alinan 13 · aktif 31.08'de 9 -> asil sapma ALIM tarafinda (-7), ikincil ayrilma (3/13). Alim BASLAMA tarihi de ayirt edici: Heykel ilk alim 10.08 ve 14.08'e kadar yalniz 2 kisi (Ist.Yolu 15 · Ozluce 7 · FSM 6) -> sezonun ilk yarisi eksik kadroyla gecti. Ayrilma orani magazalar arasi cok farkli (Heykel 3/13 · Ozluce 4/20 · Ist.Yolu 0/25 · FSM 0/12). last_verified 2026-09-02."
    bolum_kirilimi: "Kadro artisinin NEREYE gittigi `Departman` (reyon) kirilimiyla okunur; kapsam `Lokasyon LIKE 'MA%'`. Bir kisi TEK bolumde sayilir -> bolum toplami kapsam sayimiyla mutabik olmali (mutabakat guard'i sart, tutmuyorsa kapsam/fan-out hatasi var). OLCUM 2026-09-02 (31.08 as-of, kadrolu 135->149 = +14): artis SATIS/ON SAF reyonlarinda (YARDIMCI KITAP +6 · KIRTASIYE +3 · KASA +2 · AKADEMI +2 · SURA +2 · KULTUR/OYUNCAK/ETKINLIK +1), COCUK -1; **MAGAZA (yonetim) +0 · MAL KABUL +0 · IDARI ISLER +0**; merkeze kayan back-office -3 (ON MUHASEBE/MUHASEBE/BILGI ISLEM birer). Kullanim: 'kadro sisti' itirazina 'yonetim buyumedi, raf onu buyudu' cevabi bu kirilimdan verilir. last_verified 2026-09-02."
    norm_karsiliksiz_satirlar: "Norm tablosunda yazılı olup 31.08.2026'da personeli olmayan iki satır ÖLÇÜLDÜ (2026-09-03) — ikisi de veri hatası DEĞİL, farklı sebepler: **(1) OYUN ALANI (norm Özlüce 1)** — departman Zirve'de VAR (önceki oturumda 'listede yok' sanıldı, YANLIŞTI): ÖZLÜCE, Kadro=KADRO, ünvan 'ÇOCUK GELİŞ. VE EĞİT. ELEMANI', giriş 13.11.2024 → çıkış 04.05.2025 (kod 03). Yani pozisyon Mayıs 2025'te boşaldı ve doldurulmadı → **GERÇEK AÇIK (1 kişi)**. **(2) MUHASEBE (norm Heykel 1)** — HEYKEL'de 1 kişi vardı, çıkış 26.10.2025, bugün aktif 0; ŞURA ÖN MUHASEBE 4 kişinin tamamı çıkmış (son 31.10.2025); GENEL YÖNETİM MUHASEBE 4 aktif. Yani muhasebe fonksiyonu **Ekim 2025'te mağaza/Şura'dan MERKEZE taşınmış** → Heykel normundaki 1 satır **BAYAT NORM**, açık kadro değil. Norm'dan düşülüp düşülmeyeceği yönetim kararı (norm bir İK/operasyon parametresi, Zirve'den sorgulanmaz). **KARAR (kullanıcı, 03.09.2026): norm OLDUĞU GİBİ KALIYOR** — 145/217/28 ve bölüm açığı 15 değişmedi. Bu bir sapma değil KARAR; sonraki oturum 'düzeltmeye' kalkmayacak."
    sezonluk_uzun_kidemli_kayit: "31.08.2026 aktif sezonluk 62 = 61 (2026 girişli) + **1 (ŞURA, giriş 21.08.2025, 375 gün)** (ölçüm 2026-09-03). **İK KONTROL ETTİ (kullanıcı, 03.09.2026): kişi FİİLEN ÇALIŞMAYA DEVAM EDİYOR** → veri hatası YOK, çıkış işlenmemesi değil. Sezonluk **62 DOĞRU** (61 bu yıl + 1 geçen yıl girişli, hâlâ çalışıyor); 5 mağaza toplamı 211 doğru. ⚠ Önceki iki oturumda bu kayıt 'çıkışı işlenmemiş, düzeltilince 62 → 61' diye yazılmıştı — ÖLÇÜM DEĞİL ÇIKARIMDI ve yanlıştı; uzun kıdem tek başına 'kayıt hatası' kanıtı değil. Deste dipnotu da buna göre düzeltildi."
    etkinlik_personeli: "ETKINLIK personeli = `Departman='ETKİNLİK'` (unvan 'ETKINLIK ORGANIZASYON SORUML.' / 'ETKINLIK TAKIM LIDERI'). KUCUK KADRO: 31.08 itibariyla magazalarda 2 kisi (2025: FSM+Ist.Yolu · 2026: Ozluce+Ist.Yolu), tamami Kadro='KADRO' (sezonluk DEGIL). Kardes departman `OKUL TEMSILCISI` (unvan 'OKUL TEMSILCISI ETK. TK. LDR.') 31.08'de aktif 0. Bordro-disi promotor/etkinlik destegi varsa Zirve'de IZ YOK. last_verified 2026-09-02."
    isten_cikis_kodu: "`IstenCikisKodu` (nvarchar, SIFIR DOLGULU: '03') = SGK işten çıkış kodu. **SÖZLÜK BULUNDU 2026-09-03: `DerinSISBkm.iky.ayrilma_neden`** (33 satır, kod+aciklama; eşleşme Zirve '03' → sözlük '3', yani sıfır dolgusu kaldırılır / CAST int). ⚠ Zirve'de açıklama tablosu GERÇEKTEN YOK — iki geçişli VERİ taramasıyla ölçüldü (tüm char kolonlar 20-400 uzunluk & 1-5.000 satırlı tablolar + nvarchar(max)/text kolonlar; 'Mevsim bitimi'/'istifa'/'Malulen' metni hiçbir tabloda geçmiyor). Açıklama Zirve ARAYÜZÜNDE tutuluyor. Kullanılan ama sözlükte OLMAYAN 3 kod: 45 (4 kişi) · 46 (1) · 48 (5) — SGK sonradan eklemiş, sözlük 36'ya kadar. **DIŞ KAYNAK (web, 2026-09-03 — ÖLÇÜM DEĞİL, iki bağımsız kaynakta örtüştü): 45-50 arası kodlar İş Kanunu m.25 (işçinin kusuru) kapsamındadır** — 45 = işverene/aileye/işçiye sataşma, alkol-uyuşturucu · 46 = güveni kötüye kullanma, hırsızlık, meslek sırrı · 47 = 7 günden fazla hapis cezası · 48 = izinsiz devamsızlık (üst üste 2 iş günü / ayda 3 gün). Bu kodlarda kıdem-ihbar-işsizlik ödeneği doğmaz. **Bizim veride 10 kişi bu kodlarla çıkmış (45→4, 46→1, 48→5) — yani 'istifa' değil DİSİPLİN gerekçesi**; devir/ayrılma yorumunda ayrı sayılmalı. Hukuki sonuç için İK + mevzuat teyidi şart (kaynaklar özel hukuk/muhasebe siteleri, SGK resmî yayını değil). **Dağılım (ayrılmış personel, tüm zaman):** 03 istifa 574 · 02 deneme-işçi 205 · 01 deneme-işveren 55 · 12 askerlik 26 · 04 işveren-fesih 20 · 13 evlenme 14 · 22 diğer 10. Arşiv: sorgular/2026-09-03-zirve-cikis-kodlari.sql"
    sezon_cikis_kodu_tuzagi: "⚠⚠ **SEZON SONU AYRILMALARI 'İSTİFA' OLARAK YAZILIYOR** (ölçüm 2026-09-03). Sözlükte `18 İşin sona ermesi` · `19 Mevsim bitimi` · `20 Kampanya bitimi` kodları VAR ama Zirve'de bu üçünün kullanımı **TÜM ZAMAN 0**; buna karşılık 212 sezonluk çıkış kaydı mevcut. 2025-2026 mağaza sezonluk çıkışları: 03 istifa 60 · 02 deneme-işçi feshi 26 · 01 deneme-işveren 4 · 05 belirli süreli bitim 1. SONUÇ: 'sezonluk personelin çoğu istifa etti' çıkarımı VERİDEN DOĞRULANAMAZ — kod seçimi süreç gereği böyle olabilir. Devir/istifa oranı bu not olmadan yorumlanmaz. **DIŞ KAYNAK (web 2026-09-03, ÖLÇÜM DEĞİL): kod 19 Mevsim bitimi = 'mevsim bitiminde çıkış verilir, takip eden mevsimde tekrar giriş yapılır' (iş akdi askıda); bu kodda da kıdem-ihbar-işsizlik ödeneği doğmaz. Personel bir sonraki sezon geri ALINMAYACAKSA kod 4 kullanılması gerektiği belirtiliyor (kod 4 işsizlik ödeneğine hak kazandıran kodlar arasında).** Yani mevcut pratik (03 istifa) ile 19 arasındaki fark ödenek açısından yok; asıl ayrım 'geri alınacak mı' (19) vs 'alınmayacak' (4) sorusunda. Mevzuat teyidi İK'da (TODO K-33)."
