ai_hints:   # sorgu üretirken her zaman geçerli
  - "yyyy-MM-dd tarih formatı HİÇBİR yerde kullanılmaz."
  - "Cross-db string join → COLLATE Turkish_CI_AS."
  - "Canlı sorguda WITH(NOLOCK) (özellikle irsHrk, depo.*)."
  - "MCP sql_query: CTE yok, top-level ORDER BY yok, multi-statement yok — tek SELECT yaz."
  - "urn.stkKod BARKOD DEĞİL — ürün eşleşmesi daima stkID üstünden."
  - "KOLON ADI BÜYÜK/KÜÇÜK HARF TUTARSIZ (canlı doğrulama 2026-08-18): irsHrk = `ehstkID` (küçük s) · fatAyr/irsAyr = `ehStkID` (büyük S) · bkm.StokAyBakiyeMekanBazli = `stkID` · bkm.UrunBilgi = `stkID`. SQL Server case-insensitive olduğu için çalışır, ama kopyala-yapıştır sorgu/kod okurken karıştırma; case-sensitive collation'a taşınırsa kırılır."
  - "'ODAK stok' / e-tic depo stoğu sorulunca → ent.odak_depo_Stok (stkID,StokMiktar). stokSonAltDepo_vw mekan-toplamıyla HESAPLAMA — mekan 26142/4480/4835 transit, dahil edersen sessiz over-count. Ürün master (marka/yazar/maliyet/fiyat/kategori) → bkm.UrunBilgi."

entities:
  # ERP çekirdek
  dbo.urn:
    type: table
    pk: stkID
    key: [stkKod, stkAd, urnMrkID, urnKtgr2ID, urnTip, fiyatS]
    note: "stkKod barkod DEĞİL → eşleme stkID üstünden"
    urnTip: "0=STOK ÜRÜNÜ (mal) · 1=gider/hizmet kalemi (muhasebe) · 2=FATURA HİZMET/GELİR + SABİT KIYMET kartı. **1 ve 2 aynı sınıf**: ikisi de stok taşımaz — `irsHrk`'de 0 hareket, `bkm.UrunBilgi` master'ında 0 kayıt, yalnız `fatAyr` fatura kaleminde var (ölçüm 2026-09-03: urnTip=1 → 97.165 kalem · urnTip=2 → 5.888). Bu yüzden stok/ölü stok/kategori raporlarında `WHERE urnTip=0` ZORUNLU ve dışlama KASITLI — sessiz veri kaybı yok. ⚠️ 2 değeri 2026-09-03'e kadar sema'da yoktu; ilk yazımda '**demirbaş/araç satışı**' diye etiketlendi, ÖLÇÜM bunu düzeltti: 52 kaydın 38'i `H-0xx` fatura kalemi (Ciro Prim Geliri · Kampanya Fiyat Farkı · Hizmet Bedeli · Fiyat Farkı · Hasar Tazmin · Tevkifatlı Satış · Kira Geliri · Dergi-Gazete İade · İMM Alış İade — hepsi KDV oranına göre varyantlı), 14'ü `252.10.xxx` gayrimenkul/arsa kartı (252=Binalar hesabı); araç satışı yalnız 2 kayıt (H-031, H-040). Tek örnekten türetilen etiket sınıfı yanlış tanımlar."
    urnTip_olculdu: "2026-09-03 → 0=868.094 · 1=252 · 2=52 (GROUP BY, canlı). urnTip 1+2 için irsHrk stok hareketi = 0, bkm.UrunBilgi kaydı = 0, fatAyr kalemi = 97.165 + 5.888. Arşiv: sorgular/2026-09-03-urntip-mal-olmayan-kalem.sql"
    fiyatS: "satış/liste fiyatı (KDV dahil). Sıfır-maliyetli imputation anchor: AVG(ORT_ALIS/fiyatS) kategori bazında → ürün maliyeti = fiyatS × oran. Filtre: fiyatS>0 AND ORT_ALIS<fiyatS."
    olu_stok_exclusions:
      stkID: [81809]
      note: "81809=İskonto ve Fiyat Farkı (Kırtasiye) — muhasebe kalemi yanlış kategoride, urnTip=0 olduğu için urnTip filtresi yakalamıyor"
      kategoriler_ek: ["Zkargo", "KARGO"]
      kategoriler_ek_note: "Zkargo=alış kargo giderleri; KARGO=gelir kalemleri (stkKod KARGO1/KARGO2, stkID 144860/144963)"
    last_verified: "2026-06-17"
  dbo.irsHrk:
    type: table
    pk: ehID
    grain: "birleşik hareket (ehID+ehstkID+ehTip)"
    note: "ciro/stok ana kaynağı"
    columns:
