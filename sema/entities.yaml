    alan_tipleri: "`depo.adresAlanTip` (kolonlar alanTipID/alanTipAd — `adrsAlanTip*` DEĞİL):
      0=RAF ALANI · 1=GİRİŞ ALANI · 2=ÇIKIŞ ALANI. Ölçüm 2026-09-03: RAF 3.799.795 (21.842 ürün) ·
      GİRİŞ 195.470 (4.633) · ÇIKIŞ 543.555 (12.082). Toplam ~4,54M."
    snapshot: "`bkm.StokAyBakiyeMekanBazli` (Kaynak='WMS', ehMekan=12) bu view'dan
      `adrsAlanTipID IN (0,1)` ile doldurulur → **ÇIKIŞ ALANI hariç** (sevke hazırlanmış mal).
