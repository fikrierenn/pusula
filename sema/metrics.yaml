# BKM Semantik Katman — METRİKLER / TÜRETİLMİŞ İŞ MANTIĞI
# İş kategorileri, formüller, hesap modelleri. Köprü+kod referanslı.
version: 1
updated: 2026-06-13

metrics:
  net_ciro:
    source: dbo.irsHrk
    grain: "ehTrhS (=irs.eTarihS) — stok/ciro daima bu tarih"
    formula: "SUM(CASE WHEN ehTip IN (1,4,100) THEN ehTutarN END) - SUM(CASE WHEN ehTip IN (3,5,101) THEN ehTutarN END)"
    filters: ["ehAltDepo=0", "WITH(NOLOCK)"]
    note: "ehTutarN KDV hariç, = ehTutar-ehIndirim. Tüm tutarlar KDV hariç."

  encore_ciro:
    source: EncoreMerkez.dbo.Sales
    filters: ["SalesProducts WHERE IsValid=1", "DocumentsTypeId IN (1,2,3,6,7,8)"]
    iade_sign: "CASE WHEN DocumentsTypeId=3 THEN -GrossTotal ELSE GrossTotal END"
    indirim: "DiscountTotalDirect (sadece bu; Campaign alt küme, toplama çift sayar)"
    linecount: "KULLANMA → CROSS APPLY COUNT(*) FROM SalesProducts WHERE SalesId=s.Id AND IsValid=1"
    compat110: "STRING_AGG/TRIM/IIF/TRY_CONVERT YOK"

  depo_hareket_kategori:    # 10.06 — merkez depo (mekan 12) hareket sınıflaması
    source: "depo.paletIcHrk p JOIN dbo.irs i ON i.eID=p.piIrsID"
    grain: "p.pikTarih, p.pGC (0=giriş 1=çıkış), i.eTip, i.eFirma"
    adet: "SUM(ABS(p.piAdet))"
    kategoriler:
      Mal Kabul:        {pGC: 0, eTip: 0, firma: "tedarikçi (≠56, ≠mağaza, ≠0)"}
      Heykel (Bursa Kültür alış): {pGC: 0, firma: 56, note: "BKM Bursa Kültür'den mal alıyor (giriş). Heykel'e SEVK merkez depodan değil — mağaza kaynaklı (SevkiyatHareketBaslik.HedefMekanId=60398)."}
      İade Kabul:       {pGC: 0, eTip: 9, firma: mağaza}
      GENEL Giriş:      {pGC: 0, eTip: 16, firma: 0, status: "teyit bekliyor (e-tic iade/merkez intake?)"}
      Mağaza Sevk:      {pGC: 1, eTip: 13, firma: mağaza}
      İade-GENEL Sevk:  {pGC: 1, eTip: [90, 99], firma: 0}
    deger_2026_ocamay: {Mal Kabul: 1923096, Heykel: 330663, İade Kabul: 61330, GENEL Giriş: 330593, Mağaza Sevk: 1412174, İade-GENEL Sevk: 136055}

  depo_isgucu:              # gerçek operatör verimi
    gorevler:
      Raflama:  {source: "depo.paletIcHrk pHrkTip=0 pGC=0", personel: "COUNT(DISTINCT pikKisi)", adet: "SUM(piAdet)"}
      Toplama:  {source: "depo.emirAyr emTamam=1", personel: "COUNT(DISTINCT emKisi)", adet: "SUM(emAdet)", note: "%99.97 emTip=2 picking"}
    kisi_basi: "adet / personel"
    toplama_verim_ocamay: {2024: "10p/1.02M=102.339", 2025: "9p/1.38M=152.816", 2026: "8p/2.82M=352.701 (+%245)"}
    uyari: "paletSevkLog.kKisi tek sistem-kullanıcısı (operatör DEĞİL → emirAyr.emKisi/paletIcHrk.pikKisi kullan)"
    rapor: scripts/depo_isgucu_raporu.py

  envanter_exclusions:      # stok/envanter raporlarında ZORUNLU dışlamalar
    sinav_okullari:
      filter: "urnKtgr2ID=19 HARİÇ"
      neden: "paket-koduyla-giriş / parça-koduyla-çıkış → İst.Yolu'nda sahte ÜstFiyat −190M, Ort.Maliyet +149M"
      evidence: "08.06"
    dergi:
      filter: "stok raporlarında (E1/E4-E8) Dergi HARİÇ — satış raporları (G4/A5/A6) etkilenmez"
      neden: "süreli yayın; devir 8,5x / stockout %23 = gürültü, stok takibi anlamsız"
      evidence: "08.06 — kullanıcı kararı"
    sahaf:
      filter: "stok/stockout raporlarında (E8) Sahaf HARİÇ — urn.stkAd NOT LIKE N'SHF-%'"
      neden: "ikinci el tekil kopya; satıldı=devamı yok, reorder edilemez → kalıcı stoksuz, stockout sinyalini şişirir (Dergi gibi)"
      evidence: "13.06 — kullanıcı kararı + drill-down: Kitap stockout ham %5,3 → sahaf-hariç %2,6. 644 stoksuzun 342'si (%53) sahaf (SHF-)."

  eticaret_net:             # haftalık brief + G7 net tanımı
    source: ODAKJOKER.JOKER.dbo.J_ORDERS
    formula: "SUM(CASE WHEN STATUS NOT IN (1001,1006,1007,3000,4000) THEN TOTALPRICE END)"
    grain: "ORDERDATE (ISO YYYYMMDD param!)"
    note: "TOTALPRICE kargo dahil brüt sipariş başlığı — POS net'iyle birebir kıyaslanamaz. Kanal=APPLICATION (çöp admin girişleri → Diğer)."
    rapor: "scripts/generate_brief.py SQL_ETICARET (v1.1.0)"

  cod_ekonomi:              # kapıda ödeme
    cod_filter: "PAYDEFREF=-3"
    service_fee: "SERVICEPRICE = pass-through (firmaya ödenir, kâr DEĞİL)"
    iade_maliyet: "2 × CARGOPRICE (gidiş+geri getirme), teslim edilmeyen sipariş → BKM yutar"
    iade_orani: "COD ~%9-10 (online ~%0.5) — COĞRAFYA kaynaklı (Doğu/GD %15-21, Batı %3-6), firma değil"
    voucher: "VOUCHERCODE dolu = hediye çeki → satır indirimi olarak yansır"
    rapor: scripts/kapida_odeme_analiz.py

  depo_stok_dagilim:        # WMS depo stok kovaları (12.06 — gerçek prod sorgu)
    source: "depo.paletUrnTnm + paletTnm + adres (palet→adres→tip), PIVOT adrsAlanTip × pUStkID"
    filter: "pUAdetN>0, adrsAlanTipID IN (0,1,5)"
    kovalar:
      Raf Stoğu:   {adrsAlanTipID: 0, note: "toplanabilir raf"}
      Mal Kabul:   {adrsAlanTipID: 1, note: "GR Giriş Rampası"}
      Joker Havuz: {adrsAlanTipID: 5, adrsAd: JokerHavuz}
      Transfer:    {adrsAlanTipID: 5, adrsAd: TRNS}
    rapor: "DEPO ÖZET DURUM.sql / BÜTÜNLEŞİK TOPLAMA DEPO DURUM.sql"

  wms_bekleyen_toplama:     # WMS raflanmamış sipariş ihtiyacı
    source: "J_DEPO_TOPLANACAK + J_ORDERS(WMSAKTARMA=1,STATUS=1000) + J_ORDER_DETAILS(STATUS IN 2000,2002,2003,2007) + J_DETAIL_BOXES(raflanmış)"
    formula: "ihtiyaç = SUM(QUANTITY sipariş) − ISNULL(SUM(raflanmış koli),0); depodan_toplanacak = ihtiyaç − JokerHavuz mevcut"
    note: "J_ORDER_DETAILS_COMP ile set/kompozit ürün açılır (COMPBARCODE/COMPITEMREF). DETAILS.STATUS=2003 (rafta) tarihi NULL'lanır."
    rapor: "BÜTÜNLEŞİK TOPLAMA DEPO DURUM.sql"

  cari_firma_stok_hareket:  # firma bazlı stok + 3 ay alış/satış (cari özet)
    source: "stokSonAltDepo_vw (depo+mağaza stok) + irsHrk (3 ay alış/satış pivot) + bakiye_vw"
    firma_filter: "urn.stkFirma=570 (BKM ana yayın firması — cari özette)"
    alis_ehtip: [0, 10, 2, 12]   # alış+yerel alım+alış iade+alış mağaza iade
    satis_ehtip: [1, 3, 4, 5]    # satış+satış iade+mağaza satış+mağaza satış iade
    pivot: "Depo/Mağaza × Alış/Satış × 3 ay (01=son 30g, 02=30-60g, 03=60-90g)"
    note: "stkFirma=570 BKM kendi yayınları. Bakiye bakiye_vw.cKod=frmID (×-1)."
    rapor: "CARİ ÖZET DURUM.sql"

  upt_sepet_adedi:          # UPT = unit per transaction (sepet derinliği) — 12.06 doğrulandı
    formula: "SUM(SalesProducts.Amount) / COUNT(DISTINCT Sales.Id)"
    source: "EncoreMerkez.SalesProducts.Amount (decimal 18,3 = SATILAN MİKTAR/adet) · IsValid=1 · BarcodeNo<>'1001'"
    filter: "Sales.DocumentsTypeId IN (1,2,6,7,8) (iade hariç), tek mağaza mekanID"
    dogrulama: "FSM 2026-06-11: 3754 adet / 936 fiş = 4.01 UPT (makul)"
    note: "Amount = miktar kolonu (kesirli olabilir). TotalPrice ≠ adet. UPT 3al2öde etkisini gösterir; ATV (₺/fiş) ile birlikte sepet analizi. Dashboard /magaza/{id} KPI bandında."
    rapor: "dashboard MagazaQueries.GetDetayAsync · gm-rapor G1"

  kampanya_indirim_orani:   # 12.06 — kampanya yükü / efektif indirim
    formula: "indirim_orani = SUM(-spc.TotalDiscount) / (SUM(sp.TotalPrice) + SUM(-spc.TotalDiscount))"
    aciklama: "Brüt = kampanyalı kalemlerin net satışı (TotalPrice indirimli) + indirim. Oran = indirim/brüt."
    kopru: "bridges.yaml encore_kampanya_kalem (spc.SalesId+ProductSequence=sp.Sequence)"
    dogrulama: "FSM 01-12 Haz: 3AL2ÖDE %25,7 · SABİT FİYAT %40 · YÜZDESEL %41,5 · genel TOPLAM %31,3 (brüt 3,52M / indirim 1,10M / 6.050 fiş)"
    note: "3al2öde teorik %33 ama karışık fiyatta en ucuz bedava → ~%25-26 efektif. Dashboard /magaza/{id} kampanya panelinde."
    kritik: "İKİ ZORUNLU FİLTRE (13.06 fiş-detay kontrolünde bulundu): (1) spc indirimi MUTLAKA SalesProducts IsValid=1 köprüsüyle al — IsValid=0 iptal kalemler indirimi şişirir, DiscountTotal'dan fazla çıkar, 'Diğer indirim' negatife düşer. (2) Sales.DocumentsTypeId IN (1,2,6,7,8) — iade (3) belgesi indirim sign'ı ters, dahil edilirse Diğer şişer. Belge listesinde Diğer = DiscountTotal − 3al2öde; iade+IsValid filtresi şart."
    rapor: "MagazaQueries.GetDetayAsync kampSql/kampFisSql · scripts/build_3al2ode_belge_excel.py · gm-rapor M2"

  stockout_sku:             # 13.06 — SKU-bazlı stockout SİNYAL KALİTESİ (MIMBAL pilot bulgusu)
    source: "irsHrk per-SKU bakiye≤0 / son 30g satışı olan (E8), kategori bazlı"
    formula: "100.0 * COUNT(bakiye≤0) / COUNT(satılan çeşit)"
    caveat: "HAM çeşit-sayısı stockout, reorder edilemeyen kalem barındıran kategorilerde YANILTICI — oranı şişirir, sahte ACT üretir. Önce drill-down, sonra ACT."
    artefakt_kaynaklari:
      sahaf: "SHF-% tekil kopya → kalıcı stoksuz. envanter_exclusions.sahaf ile çıkar."
      spot_mal: "dönen barkod (kulaklık/fan/aksesuar): eski stkID bakiye=0 ama fiziksel stok YENİ barkodda. Kanıt 13.06: 'kulaklık/fan' 499 çeşitten 214'ü stokta (5.795 ad); 'stoksuz' 2 çeşit ölü barkod. Elektronik %8,8 = artefakt."
      uzun_kuyruk: "ayda 1-2 satan tekil baskı/plak → doğal stockout, reorder sinyali değil."
    gercek_sinyal: "yeni-ürün (NOT LIKE 'SHF-%') + talep≥3 + bakiye≤0 = reorder edilebilir kayıp. Kitap 13.06: 644 ham stoksuz → 8 gerçek reorder kuyruğu."
    oneri: "kategori stockout'unu adet-ağırlıklı veya 'talep≥3 yeni-ürün' alt-kümesiyle ölç; ham çeşit-sayısını tek başına ACT eşiği yapma."
    evidence: "13.06 — MIMBAL pilot Sinyal Kalite Dönemi gün-1 (Elektronik ACT geri çekildi + Kitap drill-down)"
    rapor: "gm-rapor E8 + MIMBAL docs/pilot/examples/2026-06-13-attention-list.md"

  il_teslimat_perf:         # 13.06 — B-41 il bazlı kargo teslimat hızı
    source: "J_ORDERS o JOIN J_ORDER_DELIVERY_ADDRESS mus ON mus.LOGICALREF=o.DELIVERYREF"
    formula: "cikis_gun=AVG(DATEDIFF(HOUR,ORDERDATE,SENDDATE)/24) · teslim_gun=AVG(DATEDIFF(HOUR,SENDDATE,CARGODELIVERYDATE)/24)"
    filter: "SENDDATE dönemi, CARGODELIVERYDATE NOT NULL, STATUS=1005, DCITY NOT NULL. GROUP BY DCITY."
    bulgu: "ÇIKIŞ il-bağımsız sabit (~4,1g MTD Haz) = DEPO kargoya-verme darboğazı (kontrol edilebilir, SLA riski). TESLİM il-bağımlı (İstanbul 1,4g · Doğu 2,7-2,8g) = kargo firma+mesafe. İki sorun AYRI: çıkış=operasyon, teslim=lojistik."
    rapor: "dashboard EticQueries.GetIlTeslimatAsync · KARGO İL TESLİMAT PERFORMANSLARI.sql"
