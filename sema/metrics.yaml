  hediye_ceki:                # 2026-08-25 — cek nominalinden indirim talebi (karlilik/tavan). v2: kanal + fat5 duzeltmesi
    nitelik: "Cek SATISI hasilat DEGIL AVANS — KDV=0. Kar cekin HARCANDIGI anda dogar; nominalden verilen indirim dogrudan o kardan duser. Urun tanimi: `urnKtgr2.ktgrAd = N'Hediye Çeki'` (kupur-SKU 50/100/200/500/750/1000 + acik-tutarli stkID 551353, fiyatS=0 = fatura kanalinin ana kalemi)."
    KANAL_KURALI: "⚠ CEK SATISI POS'TAN OLCULMEZ — uc kanal var ve POS AZINLIK. Tek dogru kaynak `dbo.irsHrk` (ehTip bazli): `1` Satis(fatura, ~%55) · `100` POS Satis (~%35) · `4` Magaza Satis (~%10); iade `3`/`5`/`101` dusulur. POS-only olcum hacmi ~3 KAT EKSIK gosterir ve sahte 'yukumluluk acigi' uretir (v1 hatasi). Kanal disi: `88` Diger Giris = cek BASIMI/stok girisi (satis DEGIL) · `89`+`98` = imha/merkeze iade/kisiye hediye (bedelsiz)."
    fatura_kanali_indirim: "Fatura kanalinda indirim ZATEN uygulaniyor: `fatAyr.ehIndirim` / `ehTutar` (eTip=1). Ortalama %4,99 ama KURALSIZ — ayni pencerede %0, %4,15, %5 ve %15 birlikte. ⚠ MUSTERI GRUP KONSOLIDASYONU SART: INALLAR OTOMOTIV(24922) + INALLAR SIGORTA(56291) + GONYE OTOMOTIV(56292) AYNI GRUP (kullanici teyidi + ucu de Ovaakca Cesmebasi/Istanbul Cad.) -> konsolide 480.000 TL/%15 = EN BUYUK alici (%26 brut payi) ve indirim butcesinin %78,4'u orada. Konsolide edilmezse uc orta-olcekli musteri gibi gorunur ve 'indirim-hacim ters iliskili' YANLIS yorumu cikar. En buyuk ikinci/ucuncu alici (250.000 / 227.550 TL) %0 oduyor -> asil bulgu KADEME YOKLUGU. Grup-ici taraflar (Bursa Kultur Merkezi) AYRI KOVA."
    grup_haritasi_yok: "⚠ `frm.frmBagID` ve `frmGrup1..5` musteri kayitlarinda HEPSINDE 0 — ERP'de grup alani VAR ama beslenmiyor. Sonuc: her kademe/konsantrasyon analizi ELLE konsolidasyona bagli; ayni grup uc ayri kademeden indirim alabilir. Grup kaniti = ORTAK ADRES + kullanici teyidi. ⚠ VN ONEKI GRUP KANITI DEGIL (CETIN ELEKTRIK 2450383237 / CETIN PROJE 2450012214 ayni onek, farkli adres -> teyit bekliyor). Satinalma tarafindaki grup-ici tedarikci listesi deseninin musteri karsiligi."
    kullanim_olcumu: "Cek tahsilati = `SalesPayments.PaymentTypesId = 11` + `IsChangeAmount = 0`. Kod/bayrak `Info` JSON'unda (GiftCardCode / IsGiftCard / IsRefundVoucher); compat 110 -> JSON_VALUE YOK, LIKE/CHARINDEX + bos-kod guard."
    GERI_DONUSUM_AYRIMI: "⚠ Geri donusum cekleri kasada IADE SEBEBI olarak isler, hediye ceki DEGIL. Kimlik: `RefundReasons.Id=12 'Geri Dönüşüm'` (Type=0 iade sebebi) + urun `stkID 583160 'Geri Dönüşüm Kağıt Madde Alımı'` (KatAna 'Tanımsız'/Kategori3 'Genel', kg bazli). Karsiligindaki cek `PaymentTypesId=10` (IADE CEKI) olarak verilir — hediye ceki (tip 11) tahsilatinda HIC gorunmez (tip 11 %100 IsGiftCard, 0 IsRefundVoucher). AYIKLAMA IKI KOSULLU: `sp.RefundReasonId <> 12 AND p.Code <> '583160'` — SKU 416 satirda yanlis sebep koduyla (4/5/1/2) ve 12 satirda DocType=1 ile de gecmis, tek kosul yetmez. Hediye-cekli sepette geri donusum SIFIR (iki yontemle kanitlandi) -> HC marj/kaldirac etkilenmez; kirlenen yalniz KONTROL GRUBU (indirim orani %18,83 -> %18,74). Tip 10'u tip 11 ile toplamak analizi ~6 kat sisirir."
    kaldirac: "KALDIRAC = sepet(odenen) / cekle-odenen, fis bazli (`DocumentsTypeId=1`). ⚠ CEK BUYUDUKCE COKER: <=100 TL 10,66x · 251-500 1,94x · 501-1000 1,47x · 1001-2500 1,22x · 2500+ 1,14x (ort 1,54x). Karar sonucu: indirim isteyen toplu alici, kaldiracin EN AZ oldugu dilim -> indirim neredeyse tamamen marjdan cikar. ORTALAMA kaldiracla tavan hesaplamak YANLIS (dilim bazli hesapla)."
    indirim_istismari_yok: "Cekli sepette urun indirim orani NORMALDEN DUSUK (%18,08 vs %18,83, DocType 1/3); sepet 2,05x buyuk. 'Cekli musteri ustune indirim de aliyor' hipotezi veriyle curutuldu."
    BAREM_KARLILIK: "⚠ KARARIN MERKEZI TABLO — cek dilimi x ortalama sepet x GERCEK mix marji (2026-08-25, 12 ay). Barem | fis | ort cek | ort sepet | kaldirac | marj | kar/fis | kar/1TL-cek | kitap payi: <=100 |275|61|655|10,66x|%28,2|176|2,858|%22,9 · 101-250 |465|186|737|3,96x|%28,8|200|1,076|%25,4 · 251-500 |788|448|870|1,94x|%29,4|237|0,529|%32,0 · 501-1000 |786|907|1.329|1,47x|%31,1|379|0,418|%27,0 · 1001-2500 |382|1.815|2.221|1,22x|%35,6|714|0,393|%15,8 · 2500+ |159|3.813|4.344|1,14x|%37,4|1.463|0,384|%9,2. **KALDIRAC DUSERKEN MARJ YUKSELIYOR** — cunku kitap payi %23'ten %9'a iner (buyuk cek KIRTASIYE/OYUNCAK aliyor). Kar/fis buyuk cekte EN YUKSEK (1.463 vs 176 TL)."
    indirim_tavani_yontemi: "Kirilma (brut kar=0) = kar/1TL-cek orani = kaldirac x net-oran(0,917) x marj. GERCEK mix ile: 2500+ %38,4 · 1001-2500 %39,3 · 501-1000 %41,8 · 251-500 %52,9. ⚠ ESKI TEZ CURUTULDU: 'buyuk cekin tamami kitaba gider -> kirilma %15,2' varsayimi barem verisiyle YANLIS cikti (2500+ dilimde kitap payi %9,2). Davranissal gerekce: kurumsal alici ceki dagitiyor, alan kisi ne alacagini cek indiriminden BAGIMSIZ seciyor -> indirim mixi kitaba kaydirmaz. Tavan %15 (kademeli %8/%12/%15); %15'te en zayif baremde 0,234 TL/TL kalir (marjin %61'i). IZLEME: barem-6 kitap payi %9,2 -> %25 olursa kirilma ~%25'e iner, tavan daralir."
    BONUS_vs_INDIRIM: "⚠ ENSTRUMAN SECIMI (2026-08-25). Musteri esdegerligi: bonus b = x/(1-x) (ornek %15 indirim = %17,65 bonus; tersi x = b/(1+b) -> %15 bonus = %13,04 indirim). 1 TL NAKIT basina brut kar: indirim = (r-x)/(1-x) · bonus = r_ana + b*(r_bonus - 1). AYNI KUPURDE BONUS = INDIRIM, BIREBIR (0,283 vs 0,283 @ %15) — 'bonus verelim' tek basina kazanc DEGIL. Avantaj UC yerden gelir: (1) KUPUR KUCULTME — bonus 50/100 TL kupurde verilirse r_bonus=1,228>1 -> bonus arttikca kar ARTAR, KIRILMA YOK; %15'te 0,431 vs 0,283 = +%52 (480K olceginde 204.106 vs 115.667 TL). (2) FRAMING — ayni %15 basligi %13,04 indirim maliyetine gelir. (3) KOSULLU MALIYET — kullanilmayan bonus yuzu bedava (mevcut kullanilmamis bakiye satisin ~%15'i), indirim nakdi KESIN; ayrica nakit tam tahsil edilir. ⚠ ARBITRAJ TASARIMI BOZAR: 10 adet 100 TL cek tek fiste harcanirsa sepet 2500+ barem'e doner, r 1,228->0,391 coker, avantaj sifirlanir -> ZORUNLU KURAL 'tek fiste en fazla 1 bonus cek' (POS'ta zorlanmali) + 12 ay sure."
    BONUS_KANIT_ZAYIFLIGI: "⚠ Bonus tasariminda BAREM-1'in 10,66x kaldiraci KULLANILAMAZ — o 247 fislik KISMI BAKIYE artigi davranisi (musteri zaten alisveristeydi, cek artigini kullandi); tasarimla uretilemez. Basili kupur (Amount %% 50 = 0) gercegi: 50/100 TL 4,75x · 200 TL 3,30x · 500 TL 1,86x · 1.000 TL 1,45x · 2.500+ 1,14x. 50/100 TL orani YALNIZ 28 fis / 2.500 TL'ye dayanir -> mertebe gostergesi, karar kaniti DEGIL. Populasyon da farkli (bugun kucuk cek kullanan perakende musteri; bonus alan kurumsal hediye alicisi). PILOT SART: tek grup 3 ay, olcum = bonus cek gercek kaldiraci + tek-fis kuralinin tutmasi + kullanilmama orani."
    barem_perf: "Dilim x stkID uzerinde fat5 OUTER APPLY MCP'de 30s ASAR (~9K stkID x 6 dilim = 54K APPLY). Cozum: dilim x KATEGORI net cek, kategori fat5 marjini disarida uygula (kategori-ici mix farki ihmal). Tam surum sqlcli/SSMS."
