    service_fee: "SERVICEPRICE = pass-through (firmaya ödenir, kâr DEĞİL)"
    iade_maliyet: "2 × CARGOPRICE (gidiş+geri getirme), teslim edilmeyen sipariş → BKM yutar"
    iade_orani: "COD ~%9-10 (online ~%0.5) — COĞRAFYA kaynaklı (Doğu/GD %15-21, Batı %3-6), firma değil"
    voucher: "VOUCHERCODE dolu = hediye çeki → satır indirimi olarak yansır"
    rapor: scripts/kapida_odeme_analiz.py

  etic_iptal_iade:          # e-ticaret iptal/iade analizi (2026-07-30 keşif)
    grain: "SATIR (J_ORDER_DETAILS.STATUS) — header J_ORDERS.STATUS kısmi iptali kaçırır"
    kategoriler: "İptal=2005 · İade=2010 · Baskısı-yok/fiili-iptal=2004 · Normal=diğer (2009 kargoya verildi)"
    turemis_filtre: "AND NOT EXISTS(SELECT 1 FROM J_ORDERS b WHERE b.BASEORDERID=o.ORDERID) — superseded asılı çıkar (çift-sayım)"
    vade_kargo_dagitim: "SERVICEPRICE(vade farkı, -13) + CARGOPRICE(kargo) sipariş-bazlı → satıra ürün-tutarı oranında prorate: pay = tutar × SatirTutar/SUM(SatirTutar) OVER(PARTITION BY ORDERID)"
    iade_mantigi: "iptal/iade kaleminde: ürün bedeli + vade farkı payı HER ZAMAN iade; kargo payı SADECE sipariş komple iptalse (hiç sevk yok: MAX(STATUS NOT IN(2004,2005))=0) iade"
    komple_vs_kismi: "sevkVar=MAX(STATUS NOT IN(2004,2005)) OVER(ORDERID). Komple İptal=sevkVar 0 (tüm satır iptal, kargo dahil tümü geri) · Kısmi=sevkVar 1 + ≥1 problemli satır (sevk oldu, kargo tutulur). Kalem-bazlı rapor bunu gizler → sipariş-grain ayrımı şart. Tem-2026 kart: 1.615 komple (1,74M ₺ tam kayıp) + 2.552 kısmi (4,38M karışık) + 89.236 temiz"
    odeme_ayrimi: "grup PAYDEFREF bazlı (SERVICEPRICE bazlı DEĞİL — COD'yi taksitliye karıştırır): -13+SP>0=Kart-Taksitli · -13=Kart-Tek Çekim · -3=Kapıda · -1=Havale"
    taksitli_kesin: "FAİZSİZ TAKSİT YOK (kullanıcı teyit 2026-07-30) → kart(-13) siparişinde SERVICEPRICE>0 = KESİN taksitli, =0 = KESİN peşin. Proxy DEĞİL tam ayrım; faizsiz-taksit peşine sızma kısıtı GEÇERSİZ."
    parasal_taban: "İKİ taban (sql-denetci #1): BRÜT/Tahsilat=SELLINGPRICE+kargo+VF (KDV+hepsi dahil, müşteri nakit/iade) · NET CİRO=SELLINGPRICEWITHOUTVAT (KDV-hariç, kargo/VF hariç, plan-16 CFO-kıyas). Kitap %0 KDV→brüt≈net; fark kırtasiye/oyuncak %20. 'Ciro'=net, müşteri-nakit='Tahsilat'. 0-sepet(hediye çeki) prorate sızıntısı → SifirSepetSiparis kolonuyla görünür (bulgu #2)."
    calistir: "sqlcli query/script (CTE destekli, .env conn) — MCP auto-TOP CTE'yi kıramaz; heavy sorguda tek-sipariş filtrele (linked-server timeout)"
    tem2026_kart: "ciro 100,80M · problemli %2,45 · iade 2,87M (%2,84). Kapıda %9,71 problemli (kartın ~4x)"
    sql: sorgular/2026-07-30-etic-kart-iptal-detay.sql
    last_verified: 2026-07-30

  depo_stok_dagilim:        # WMS depo stok kovaları (12.06 — gerçek prod sorgu)
    source: "depo.paletUrnTnm + paletTnm + adres (palet→adres→tip), PIVOT adrsAlanTip × pUStkID"
    filter: "pUAdetN>0, adrsAlanTipID IN (0,1,5)"
    kovalar:
      Raf Stoğu:   {adrsAlanTipID: 0, note: "toplanabilir raf"}
      Mal Kabul:   {adrsAlanTipID: 1, note: "GR Giriş Rampası"}
      Joker Havuz: {adrsAlanTipID: 5, adrsAd: JokerHavuz}
      Transfer:    {adrsAlanTipID: 5, adrsAd: TRNS}
    rapor: "DEPO ÖZET DURUM.sql / BÜTÜNLEŞİK TOPLAMA DEPO DURUM.sql"

  wms_bekleyen_toplama:     # WMS raflanmamış sipariş ihtiyacı
    source: "J_DEPO_TOPLANACAK + J_ORDERS(WMSAKTARMA=1,STATUS=1000) + J_ORDER_DETAILS(STATUS IN 2000,2002,2003,2007) + J_DETAIL_BOXES(raflanmış)"
    formula: "ihtiyaç = SUM(QUANTITY sipariş) − ISNULL(SUM(raflanmış koli),0); depodan_toplanacak = ihtiyaç − JokerHavuz mevcut"
    note: "J_ORDER_DETAILS_COMP ile set/kompozit ürün açılır (COMPBARCODE/COMPITEMREF). DETAILS.STATUS=2003 (rafta) tarihi NULL'lanır."
    rapor: "BÜTÜNLEŞİK TOPLAMA DEPO DURUM.sql"
    UYARI_emirAyr: "B-111 keşfi (18.06): bu metrik J_ORDERS (e-tic) tarafı. DerinSIS depo.emirAyr.emTamam=0 ALTERNATİF DEĞİL — KİRLİ: 2.422 emir/~2M satır/4,3M kalan adet, header kTarih 2021'e kadar. depo.emir.emDurum=1 hem zombi hem taze kapsar → temiz açık/kapalı bayrağı YOK. emirAyr-tabanlı bekleyen kart için recency-filtre (son ~7g) ZORUNLU + zombi-uyarısı ayrı. Kanıt: sorgular/2026-06-18-wms-bekleyen-kesif.sql"
    last_verified: 2026-06-18

  cari_firma_stok_hareket:  # firma bazlı stok + 3 ay alış/satış (cari özet)
    source: "stokSonAltDepo_vw (depo+mağaza stok) + irsHrk (3 ay alış/satış pivot) + bakiye_vw"
    firma_filter: "urn.stkFirma=570 (BKM ana yayın firması — cari özette)"
    alis_ehtip: [0, 10, 2, 12]   # alış+yerel alım+alış iade+alış mağaza iade
    satis_ehtip: [1, 3, 4, 5]    # satış+satış iade+mağaza satış+mağaza satış iade
    pivot: "Depo/Mağaza × Alış/Satış × 3 ay (01=son 30g, 02=30-60g, 03=60-90g)"
    note: "stkFirma=570 BKM kendi yayınları. Bakiye bakiye_vw.cKod=frmID (×-1)."
    rapor: "CARİ ÖZET DURUM.sql"

  upt_sepet_adedi:          # UPT = unit per transaction (sepet derinliği) — 12.06 doğrulandı
    formula: "SUM(SalesProducts.Amount) / COUNT(DISTINCT Sales.Id)"
    source: "EncoreMerkez.SalesProducts.Amount (decimal 18,3 = SATILAN MİKTAR/adet) · IsValid=1 · BarcodeNo<>'1001'"
    filter: "Sales.DocumentsTypeId IN (1,2,6,7,8) (iade hariç), tek mağaza mekanID"
    dogrulama: "FSM 2026-06-11: 3754 adet / 936 fiş = 4.01 UPT (makul)"
    note: "Amount = miktar kolonu (kesirli olabilir). TotalPrice ≠ adet. UPT 3al2öde etkisini gösterir; ATV (₺/fiş) ile birlikte sepet analizi. Dashboard /magaza/{id} KPI bandında."
    rapor: "dashboard MagazaQueries.GetDetayAsync · gm-rapor G1"

  kampanya_indirim_orani:   # 12.06 — kampanya yükü / efektif indirim
    formula: "indirim_orani = SUM(-spc.TotalDiscount) / (SUM(sp.TotalPrice) + SUM(-spc.TotalDiscount))"
    aciklama: "Brüt = kampanyalı kalemlerin net satışı (TotalPrice indirimli) + indirim. Oran = indirim/brüt."
    kopru: "bridges.yaml encore_kampanya_kalem (spc.SalesId+ProductSequence=sp.Sequence)"
    dogrulama: "FSM 01-12 Haz: 3AL2ÖDE %25,7 · SABİT FİYAT %40 · YÜZDESEL %41,5 · genel TOPLAM %31,3 (brüt 3,52M / indirim 1,10M / 6.050 fiş)"
    note: "3al2öde teorik %33 ama karışık fiyatta en ucuz bedava → ~%25-26 efektif. Dashboard /magaza/{id} kampanya panelinde."
    kritik: "İKİ ZORUNLU FİLTRE (13.06 fiş-detay kontrolünde bulundu): (1) spc indirimi MUTLAKA SalesProducts IsValid=1 köprüsüyle al — IsValid=0 iptal kalemler indirimi şişirir, DiscountTotal'dan fazla çıkar, 'Diğer indirim' negatife düşer. (2) Sales.DocumentsTypeId IN (1,2,6,7,8) — iade (3) belgesi indirim sign'ı ters, dahil edilirse Diğer şişer. Belge listesinde Diğer = DiscountTotal − 3al2öde; iade+IsValid filtresi şart."
    rapor: "MagazaQueries.GetDetayAsync kampSql/kampFisSql · scripts/build_3al2ode_belge_excel.py · gm-rapor M2"

  stockout_sku:             # 13.06 — SKU-bazlı stockout SİNYAL KALİTESİ (MIMBAL pilot bulgusu)
    source: "irsHrk per-SKU bakiye≤0 / son 30g satışı olan (E8), kategori bazlı"
    formula: "100.0 * COUNT(bakiye≤0) / COUNT(satılan çeşit)"
    caveat: "HAM çeşit-sayısı stockout, reorder edilemeyen kalem barındıran kategorilerde YANILTICI — oranı şişirir, sahte ACT üretir. Önce drill-down, sonra ACT."
    artefakt_kaynaklari:
      sahaf: "SHF-% tekil kopya → kalıcı stoksuz. envanter_exclusions.sahaf ile çıkar."
      spot_mal: "dönen barkod (kulaklık/fan/aksesuar): eski stkID bakiye=0 ama fiziksel stok YENİ barkodda. Kanıt 13.06: 'kulaklık/fan' 499 çeşitten 214'ü stokta (5.795 ad); 'stoksuz' 2 çeşit ölü barkod. Elektronik %8,8 = artefakt."
      uzun_kuyruk: "ayda 1-2 satan tekil baskı/plak → doğal stockout, reorder sinyali değil."
    gercek_sinyal: "yeni-ürün (NOT LIKE 'SHF-%') + talep≥3 + bakiye≤0 = reorder edilebilir kayıp. Kitap 13.06: 644 ham stoksuz → 8 gerçek reorder kuyruğu."
    oneri: "kategori stockout'unu adet-ağırlıklı veya 'talep≥3 yeni-ürün' alt-kümesiyle ölç; ham çeşit-sayısını tek başına ACT eşiği yapma."
    evidence: "13.06 — MIMBAL pilot Sinyal Kalite Dönemi gün-1 (Elektronik ACT geri çekildi + Kitap drill-down)"
    rapor: "gm-rapor E8 + MIMBAL docs/pilot/examples/2026-06-13-attention-list.md"

  il_teslimat_perf:         # 13.06 — B-41 il bazlı kargo teslimat hızı
    source: "J_ORDERS o JOIN J_ORDER_DELIVERY_ADDRESS mus ON mus.LOGICALREF=o.DELIVERYREF"
    formula: "cikis_isgunu = takvim − hafta_sonu(DATEDIFF WEEK*2 + Pazar-baş/Cmt-bitiş edge) − araya giren hafta-içi resmi tatil (CROSS APPLY VALUES tatil tablosu) · teslim_gun=AVG(DATEDIFF(HOUR,SENDDATE,CARGODELIVERYDATE)/24) takvim"
    filter: "SENDDATE dönemi, CARGODELIVERYDATE NOT NULL, STATUS=1005, DCITY NOT NULL. GROUP BY DCITY."
    kritik: "ÇIKIŞ süresi İŞ GÜNÜ olmalı (takvim DEĞİL). Depo Pzt-Cuma çalışıyor (13.06: Cmt 5/Paz 0 kargo, veriden kesin). Takvim çıkış İstanbul 4,1g → iş günü 1,8g (2x abartı!). TESLİM takvim kalır (kargo firma hafta sonu dağıtır)."
    tatil_kaynak: "VERİDEN OTOMATİK (13.06 — hardcode/API yerine). Tatil = depo'nun çalışmadığı hafta-içi günler: çalışılan gün=SENDDATE kargo≥100, hafta-içi olup çalışılmayan=tatil. RESMİ+DİNİ+idari/grev hepsi otomatik (Kurban 25-30 May 0-kargo boşluk, 19 May 3-kargo resmi tatil — veride kesin). holidays.rest ücretli; Nager.Date dini bayram vermiyor → veriden en doğru, sıfır bakım. dashboard TatilValuesAsync (statik cache 6h)."
    bulgu: "ÇIKIŞ il-bağımsız sabit (iş günü ~1,8g, takvim ~4,1g) = DEPO darboğazı (operasyon, kontrol edilebilir). TESLİM il-bağımlı (İstanbul 1,4g · Doğu 2,7-2,8g) = kargo firma+mesafe (lojistik). Aylık çıkış trendi yoğunlukla korele (Aralık yılbaşı iş günü 3,1g zirve) = kapasite."
    rapor: "dashboard EticQueries.GetIlTeslimatAsync/GetAyKargoAsync/GetKargoPerfAsync (CikisIsGunu+TatilApply) · KARGO İL TESLİMAT PERFORMANSLARI.sql"

  encore_irshrk_mutabakat:   # 14.06 — EncoreMerkez ↔ irsHrk ciro mutabakatı (FSM 13.06 işlem-seviye KESİN)
    soru: "Dashboard kategori ciro (EncoreMerkez) drill (irsHrk) ile neden ~%14 (Oyuncak) farklı?"
    kdv_bazi: "EncoreMerkez SalesProducts.TotalPrice + Sales.GrossTotal = KDV DAHİL. SalesProducts.VatTotal = KDV. KDV hariç = TotalPrice−VatTotal. irsHrk ehTutarN = KDV HARİÇ. Kitap %0, oyuncak/kırtasiye %20 → kategori bazında fark; blended mağaza ~%5-6."
    iki_sebep: "(1) KDV (EncoreMerkez dahil, irsHrk hariç) — ~%5. (2) İADE: EncoreMerkez katSql iade edilen kalemi (SalesProducts.ReturnAmount>0) SATIŞ sayıyor; irsHrk ehTip 100/101 ile netliyor — ~%0,9."
    kanit: "14.06 FSM 13.06: per-ürün EncoreMerkez KDV-hariç(TP−VatTotal) = irsHrk net, ADET EŞİTSE kuruşu kuruşuna (52529:107,5=107,5 · 3570:433,62=433,62). Residual = SADECE adet farkı (iade). Fiyat/eksik-ürün farkı YOK. Mağaza-gün: EncoreMerkez KDV-dahil 559.012 − KDV 38.155 = KDV-hariç 520.857 ≈ irsHrk 516.302 (%0,87 kalan = iade ehTip 101 ~4.893)."
    karar: "⚠️ SÜPERSEDED 16.06 → bkz. tum_ciro_kdv_kargo_haric. ESKİ KARAR (14.06): Dashboard ciro KDV DAHİL (kasanın aldığı), DOKUNMA. Kullanıcı 16.06 bu kararı iptal etti: HER ŞEY KDV-HARİÇ + KARGO-HARİÇ olacak."
    evidence: "14.06 — FULL OUTER JOIN stkID, EncoreMerkez SalesProducts(IsValid=1) vs irsHrk(ehTip 4/100), KDV-hariç + adet kıyas; ehTutarN×1,20=TP doğrulandı"
    rapor: "Queries.cs katSql/skatSql · MagazaQueries.cs · RefQueries.GetUrunlerAsync"

  tum_ciro_kdv_kargo_haric:   # 16.06 — KULLANICI DİREKTİFİ: tüm dashboard/rapor ciro KDV-hariç + kargo-hariç (plan-16)
    karar: "TÜM ciro/tutar KDV-HARİÇ + KARGO-HARİÇ. 14.06 'ana ciro KDV-dahil DOKUNMA' kararı İPTAL. CFO net ciro istiyor (kasanın aldığı perakende-brüt değil)."
    encore_haric: "EncoreMerkez KDV-hariç = SalesProducts.TotalPrice − SalesProducts.VatTotal (per-satır, IsValid=1). Sales.GrossTotal−DiscountTotal (başlık, KDV-dahil) KULLANMA → SalesProducts grubuna geç."
    etic_haric: "E-ticaret KDV+kargo-hariç = SUM(J_ORDER_DETAILS.QUANTITY × SELLINGPRICEWITHOUTVAT). 16.06 KESİN: J_ORDER_DETAILS'te temiz KDV alanları var — VAT(oran), VATPRICE(KDV tutarı), SELLINGPRICEWITHOUTVAT(KDV-hariç birim), SELLINGPRICE(KDV-dahil birim). J_ORDERS.TOTALPRICE = SUM(QTY×SELLINGPRICE) + CARGOPRICE + SERVICEPRICE (birebir doğrulandı). TOTALPRICE/SELLINGPRICE KULLANMA (KDV+kargo dahil) → SELLINGPRICEWITHOUTVAT."
    kanit: "16.06 canlı: ORDERID 110015826 TOTALPRICE 2086,9 = satir_net 1997 + CARGOPRICE 89,9. J_ORDER_DETAILS örnek: VAT=0 kitap, SELLINGPRICEWITHOUTVAT=247=SELLINGPRICE (kitap %0)."
    irshrk_zaten: "irsHrk.ehTutarN zaten KDV-hariç (= ehTutar−ehindirim) → irsHrk tabanlı sorgular (tahmin motoru, envanter, devir, marka/kategori-stkID) DEĞİŞMEZ."
    kapsam: "28 sorgu değişti (Explore envanteri 16.06): EncoreMerkez header → GrossTotal-DiscountTotal-VatTotal (header VatTotal = satır TP-VatTotal toplamı, kuruşu kuruşuna). E-ticaret → direkt JOKER SELLINGPRICEWITHOUTVAT (KDV+kargo-hariç; TOTALPRICE=satır+CARGOPRICE+SERVICEPRICE). irsHrk DOKUNULMADI."
    durum: "✅ TAMAMLANDI 16.06 (plan-16 arşiv). Doğrulama: Genel Bakış mağaza -%7,1/online -%9,2, /toplam kategori (Kitap %0 değişmedi, %20'liler -%16), e-ticaret/müşteri/RFM 4 sayfa smoke OK, fiş sayısı korundu."
    istisna: "KDV-DAHİL kalanlar (bilinçli): (1) MagazaQueries kampSql kampanya indirim oranı paneli — oran=indirim/brüt KDV'den bağımsız, yarı-çevirmek oranı bozar. (2) MagazaQueries Iade/IadeOran gross-ratio. (3) MagazaQueries odemeSql SalesPayments.Amount = gerçek tahsilat (kasanın aldığı, KDV-dahil DOĞRU — ciro değil). (4) COD kargo maliyeti RefQueries (CARGOPRICE×2 = maliyet, ciro değil)."
    rapor: "plan-16 (arşiv). Queries.cs/MagazaQueries.cs/RefQueries.cs/EticQueries.cs/SadakatQueries.cs — hepsi KDV+kargo-hariç (istisnalar hariç)."

  # ── BKMMaliyet — FIFO maliyet/marj metrikleri (asıl proje D:\Dev\fifo; pusula=sema). 2026-06-19 ──
  fifo_karlilik:
    kaynak: "BKMMaliyet.dbo.FifoCikisDetay (HareketTipi='SATIS')"
    gelir: "SUM(SatisTutar)  — satış geliri (irsHrk ehTutarN, KDV-hariç, miktar-oranlı çıkış segmentine dağıtılmış)"
    smm: "SUM(CikisTutar)  — satılan malın maliyeti (CikisTutar COMPUTED = Miktar × BirimMaliyet)"
    brut_kar: "gelir − smm"
    marj_yuzde: "brut_kar / gelir × 100"
    kategori: "bkm.UrunBilgi.Kategori3 (urnKtgr2; LEFT JOIN ub.stkID=c.StkId). dbo.Kat3 KULLANMA (seyrek)."
    ay_filtre: "HareketTarihi >= ay-başı AND < ay-sonu+1"
    ocak_2026: "Gelir 72.35M · SMM 46.71M · Brüt 25.64M · Marj %35.4 (yeni master, rev2 ile birebir). Top: Kırtasiye %43, Oyuncak %38, Akademi %38, Kitap %33, Çocuk %32, Hazırlık %29."
    last_verified: 2026-06-19
  fifo_birim_maliyet: "eldeki stok = SUM(KalanMiktar×BirimMaliyet)/SUM(KalanMiktar) FROM FifoKatman WHERE StkId=@x AND KalanMiktar>0"
  fifo_acilis_stok: "GEÇMİŞ-doğru: irsHrk KÜMÜLATİF SUM(ehAdetN) WHERE ehTrhS<=@devir AND ehAltDepo=0 AND ehMekan IN(1,12,4477,4478) HAVING>0. ANLIK stok view (stokSonAltDepo_vw) KULLANMA — devir-tarihi stoğunu bugünkü stokla bozar (19.06 bug)."
  fifo_garanti_tier:
    aciklama: "Açılış SP (sp_Fifo_AcilisCalistir_V2 ADIM 5.5) — tüm tier sonrası maliyetsiz/katmansız stok için FİYAT 0 OLAMAZ garantisi."
    oncelik: "1) UrunBilgi.SonAlis>0 (gerçek son-alış = gerçek-ürün ayracı) → 2) SatisFiyat × kategori-marj oranı (AVG cost/satış per KatAna, ≥20 ürün) → 3) kategori ortalama mutlak maliyet → 4) impute-EDİLEMEZ → DEVRE DIŞI (non-inventory)"
    sabit_kaldirildi: "1-TL @GarantiSabitFiyat KALDIRILDI (19.06): non-inventory'yi (sınav süreli yayın/hediye çeki/kafe) %100 marj sayıp Ocak'ı +1.37M şişiriyordu (272 kalem). Artık impute-edilemez=devre-dışı."
    sonalis_dersi: "Salt kategori-imput gerçek ürünleri (SonAlis>0 ama kategori-dışı) yanlış devre-dışı yapıyordu → SonAlis tier eklendi → yanlış-dışlama=0. SonAlis=0 = non-inventory ayracı."
    last_verified: 2026-06-19
  fifo_fiyat_0_olamaz: "FifoKatman.BirimMaliyet<=0 KESİNLİKLE yasak (fifo-domain §6). 0 = sessiz %100-marj. GATE: SELECT COUNT(*) FROM FifoKatman WHERE BirimMaliyet<=0 → 0 dönmeli. + katmansız açılış stok (devre-dışı hariç) = 0."
  fifo_non_inventory: "Devre-dışı = stkID-CURATED (isim-pattern DEĞİL — fifo-domain §3): 'Geri Dönüşüm' çocuk kitabı, 'Poşet Dosya' kırtasiye, 'Big Babol Poşet' sakız GERÇEK ürün. Gerçek non-inventory: BKM bagging-poşet, kargo gideri (Zkargo), hediye çeki, iskonto/fiyat-farkı, demirbaş, yemek-ilk-madde, isimsiz-obsolete."
  marka_devir:   # 22.06 — B-110 tedarikçi/yayınevi performans scorecard
    aciklama: "Marka/yayınevi (urn.urnMrkID → urnMrk.mrkID) bazında sermaye verimliliği = stok devir hızı + iade oranı."
    devir: "son 12 ay satış adet / anlık stok adet. Satış adet = -SUM(ehAdetN) ehTip IN(4,100). Stok = SUM(stokSonAltDepo_vw.stok) ehAltDepo=0, mekan 1/4477/4478/12. <1,5× = sermaye tuzağı (sipariş-kes sinyali), 1,5–3× izle, >3× sağlıklı. stok=0 → null (tükenmiş)."
    iade_orani: "iade tutar / brüt satış tutar. iade = ehTip IN(3,5,101) ehTutarN; brüt = ehTip IN(4,100). >%10 kırmızı bayrak."
