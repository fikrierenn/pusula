    car_gl_zinciri: "car_ekle (giriş + cKodKarsi ata) → mhs.mhsEntKontrolCar (uygun cBA=0 seç, iki taraf mhsEntFrm-tanımlı) → mhs.mhsEnt_car (yevmiye mhsFis borç/alacak) → mhs.cariIsle_oto (günlük zamanlayıcı, cCrmID>0)."
    trigger: "car/carAyr/carNot/carSatOde/carCek üzerinde TRIGGER YOK → yazma footprint'i car_ekle'nin açık yazdığı kadar."
    sifreleme: "dbo.car_isle/car_ekle, mhs.mhsEnt_car/mhsEnt_carFis/mhsEntKontrolCar = WITH ENCRYPTION (EXEC edilebilir, okunamaz). mhs.cariIsle_oto, ent.AnaCariBul okunur (ent.AnaCariBul = ürün→ana tedarikçi, banka-cari ile ALAKASIZ). Şifreli SP mantığı gerekince Fikri decrypted kaynak verir."
    confidence: 1.0
    evidence: "2026-07-04 — car_isle/car_ekle/mhsEnt_car/mhsEntKontrolCar decrypted kaynak (Fikri); trigger sorgusu 0 satır."
    last_verified: "2026-07-04"
  olu_stok_maliyet_zinciri:
    source: "dashboard/Data/RefQueries.Envanter.cs OluStokSql"
    chain: "COALESCE(fat5.Maliyet, ml.ORT_ALIS, CASE WHEN fiyatS>0 THEN fiyatS * avgml.AvgCostOran END)"
    step1:
      kaynak: "DerinSISBkm.dbo.fatAyr JOIN fat ON f.eTip=0 AND f.eDurum<>2"
      yontem: "TOP 5 ORDER BY f.eTarih DESC → SUM(ehTutarN)/SUM(ehAdetN)"
      filtre: "ehAdetN<>0, HAVING SUM(ehAdetN)<>0"
      not: "Satış tarihi anchor yok (ölü stok) → GETDATE() örtük üst sınır"
    step2:
      kaynak: "Aktarim.dbo.BKM_STOKLAR_MALIYETLI.ORT_ALIS"
      not: "Gece job ile güncellenir; anlık sorguda 0 gelebilir (job henüz çalışmamış)"
    step3:
      kaynak: "urn.fiyatS × AVG(ORT_ALIS/fiyatS) kategori bazında"
      imputation_query: "AVG(CASE WHEN fiyatS>0 THEN ml.ORT_ALIS/fiyatS END) GROUP BY urnKtgr2ID"
      filtre: "ORT_ALIS>0 AND fiyatS>0 AND ORT_ALIS<fiyatS"
      not: "Tersine kayıtlar (maliyet>fiyat) kirli veri — filtreden çıkar"
    confidence: 1.0
    evidence: "2026-06-17 — dashboard build yeşil, OluStokSql OUTER APPLY fat5 eklendi"

