    kohort_tanimi: "Sezon kohortu = `Kadro='SEZONLUK'` **VE** `Igt` (giriş) 1 Tem – 2 Eyl arası. Pencere hâlâ gerekli (bayrak yıl ayırmaz) ama yalnız bayrakla birlikte. Sezonluk alımın tamamı Tem-Ağu-Eyl'e düşer (2026: 4+73+9); zirve Ağustos. Anchor günü = analiz gününün ay/günü, her yıla aynı takvim günü uygulanır."
    KIYAS_TUZAGI_CENSORING: "⚠⚠ 'Bugün kaç kişi aktif' YILLAR ARASI KIYASLANAMAZ — cari yıl kohortu henüz Eylül tahliye dalgasını görmemiştir (2026-09-02'de 2026 kohortu %80 aktif, 2025 %11, 2024 %5; bu seyir farkı DEĞİL, maruz-kalma farkı). Doğru ölçüt İKİ TANE: (a) **eşit-kıdem survival** — h gün için risk kümesi `Igt <= anchor − h` (yani o yılın aynı takvim penceresinde girenler), tutunan `Ict IS NULL OR DATEDIFF(DAY,Igt,Ict) >= h`; (b) **Eylül-öncesi kayıp** = `Ict < 1 Eylül` / kohort (Tem-Ağu penceresi her yıl tam kapanmış, birebir kıyaslanır). h=14 ve h=30 anlamlı; h≥60 risk kümesi <10'a düşer → şube bazında raporlanmaz."
    surec_deseni: "Sezon çözülmesi: ayrılışların ~%55-60'ı **Eylül** ayında (Ağustos'a göre ay ofseti 1) — sezon sonu planlı tahliye. Ağustos-içi ayrılış planlı değil, KAÇIŞ sinyali (yerine peak'te alım yapmak zorunda kalınır)."
    cikis_kodu: "`vw_PersonelDepartman.IstenCikisKodu` = SGK işten çıkış kodu (nvarchar, '01'..'05' + seyrek yüksek kodlar). ⚠ Zirve'de kod→açıklama LOOKUP TABLOSU YOK (aranıp bulunamadı) → kod anlamı İK teyidi olmadan rapora yazılmaz. Gözlem: sezon kohortlarında baskın iki kod var ve dağılım kıdemle değişir (erken ayrılışta bir kod, sezon-sonu tahliyede diğeri) — bu yüzden kod dağılımını kıdem bucket'ından BAĞIMSIZ kıyaslamak yanıltır."
    ucret_uyarisi: "Kohort maliyeti hesaplanacaksa `entities.vw_PersonelDepartman.ucret_kurali` ZORUNLU okunur (GÜNLÜK vs AYLIK birim, 30× sessiz hata riski; `dbo.puanbil.Ucretsekli` ayracı)."
    kvkk: "Kohort raporu **toplulaştırılmış** verilir (şube × departman sayıları); ad-soyad / personel no / ücret satırı rapora girmez. Tek kişilik hücreler ünvanla birleşince tekilleştirir → şube×departman kırılımında n=1-2 hücreler yorumlanır ama kişi nitelikleri eklenmez. Kaynak kural: `.claude/skills/ik-danisman/SKILL.md` §2, TODO B-161."
    confidence: 0.9
    last_verified: "2026-09-02"
    ttl_days: 365
    evidence: "2026-09-02 canlı MCP zirve — sorgular/2026-09-02-sezon-personel-kohort-magaza.sql (9 blok: Kadro dağılımı, aylık profil, SEGMENT kıyası, kohort survival, şube×kohort sezonluk + kadrolu, şube×reyon, çözülme ofseti, çıkış kodu, kadro bileşimi). SEZONLUK ölçümü: 3 kohort (2024:73 / 2025:83 / 2026:86 kişi), 14-gün tutunma %92,7/%93,3/%91,8, Eylül-öncesi kayıp 7/9/10. Aynı pencerede KADROLU: 54/48/61 kişi, %90,7/%92,1/%75,5, kayıp 9/6/18. Rapor: briefings/sezon-kadro-20260902/ (xlsx + veri.json)."

