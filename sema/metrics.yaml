  gelir_tablosu_pl:
    kaynak: "mhs.mhsFis signed fisTutar (gelir BA=0→+, gider BA=1→−). Dashboard /gelir-tablosu (GelirTabloQueries). Merkez: fisGdrMerkez (köprü mhsfis-gdrmerkez)."
    yapi: "Net Satış(60−61) → Faaliyet Gideri(740/760/770, kategori .YY: 10 işçi ücret·20 yönetim·30 dışarıdan fayda·40 çeşitli·50 vergi-harç·60 amortisman) → FAALİYET KÂRI = NetSatış−gider → +Finansman(780/66/653)+Diğer(64/65/67)+KKEG(689/68) → NET KÂR = tüm 6xx+7xx signed toplam."
    kritik_cogs: "⚠️ SMM (satılan malın maliyeti/kitap alış) YOK — BKM COGS'u stok hareketiyle tutar, GL 62 hesabına YAZMAZ (62 aktivitesi 0). Net Kâr = SMM-ÖNCESİ katkı, gerçek dip-kâr DEĞİL. Kullanıcı şablonu da COGS'suz."
    erp_karsilastirma: "Resmi mhs.mhsGelirTabloGiderMerkeziDetayli SP'si 6xx-ONLY (aHspID LIKE '6%') → 740/760/770 opex + 780 finansmanı GÖSTERMEZ → 'dönem kârı' opex-siz şişkin (Haziran: SP 80,9M vs bu rapor Net Kâr 2,04M). Bu rapor 7xx dahil tam P&L."
    dogrulama: "2026-08-06 Haziran toplam: Net Satış 75,74M (ERP SP 61x ile birebir), Faaliyet Kârı 35,39M (%46,7), Net Kâr 2,04M. Kapanış-hariç, yıl=sirketID+2020."
    last_verified: "2026-08-06"

  gider_mizan_dagitim:
    kaynak: "mhs.mhsFis (GL satır) + mhsHsp; köprü mhsfis-gdrmerkez → frm (gider merkezi). MizanQueries ile aynı çekirdek."
    gider_tanimi: "hspKod '7%' TÜMÜ (740 hizmet/kafe · 760 pazarlama · 770 genel yönetim · 780 finansman) + gider-6xx (LEFT(hspKod,2) IN 62,63,65,66,68 → 653 komisyon · 689 ÖİV/olağandışı). Gelir 6xx (600 satış/602 kira geliri/642 mevduat/679 teşvik) HARİÇ. BKM 7/A yöntemi → yansıtma (7x1) aktif değil, 6xx+7xx çift-sayım YOK."
    tutar: "Bakiye = Borç−Alacak = SUM(fisBA=1→-fisTutar) − SUM(fisBA=0→fisTutar). Gider debit → pozitif. Kapanış fişi HARİÇ (mhsFisBaslik.fisAd<>'Kapanış'). Yıl = fisSirketID+2020 (2026→sirket 6). Kümüle MONTH≤ay / tek ay MONTH=ay."
    dagitim: "gider merkezi = fisGdrMerkez→frm (ad temizliği 'G - …Gider Merkezi' strip). 0 = GENEL (dağıtılmamış) — giderin ~%69'u burada, özellikle 780 finansman + personel ücreti (x.10.001) hiçbir merkeze atanmamış."
    dogrulama: "2026-08-06 DerinSIS resmi 'Gider Merkezi Dağılımlı Mizan' (Haziran.26) ile birebir (740=5,27M·760=14,08M·770=21,01M·780=38,49M kuruşuna). Uygulama: dashboard /gider-mizan (GiderMizanQueries) + sorgular/2026-08-06-gider-merkezi-mizan-matris.sql."
    last_verified: "2026-08-06"

  satinalma_birim_maliyet:
    kaynak: "dbo.fatAyr + dbo.fat (eTip=0 alış faturası, eDurum<>2). Yoksa 2021-05-31 devir (irsHrk ehTip=99). Yoksa bu-ay alış birimi (alis_tutar/alis_adet)."
    formul: "Birim maliyet = EN SON alış faturasında (eID) SUM(fa.ehTutarN)/SUM(fa.ehAdetN) — FATURA-BAZINDA topla-böl, satır-bazında DEĞİL. Sıra: en son fatura (ORDER BY MAX(f.eTarih) DESC, f.eID DESC), GROUP BY ehstkID, eID."
    kritik_grain: "⚠️ Aynı faturada (aynı eID+eTarih) bir ürünün BİRDEN ÇOK fatAyr satırı olabilir — biri gerçek fiyatlı, biri ehTutarN=0 (bedava/promo/bonus adet). ROW_NUMBER(...ORDER BY eTarih,eID) tek satır seçmek TIE (non-deterministik: pymssql vs SSMS farklı satır → farklı birim). DOĞRU: faturayı topla (SUM/SUM) → bedava adetler ortalamaya girer, gerçek landed-cost. 0-birim satırı ELEME (57 verir, şişik); TOPLA (52.25 verir, doğru)."
    stoklu_ay_carry: "'Yılda kaç ay stoklu' = bkm.StokAyBakiyeMekanBazli (Kaynak='irsHrk', şube mekan 1/4477/4478) SON12 ayda bakiye>0 VEYA o ay satış>0. Donem ALT-SINIRI YOK: 2021-05-31 devir bakiyesi ileri taşınır → 5 yıl hareketsiz duran 1-adet stok stoklu-ay=12 → ÖLÜ-ALIM (satma fırsatı vardı). Floor (Donem>=2024) koyarsan duran ölü-stok YENİDEN-STOK'a kaçar (yanlış: üstüne alım teşviki)."
    aysonu_stok: "Ay-sonu = ŞUBE canlı stokSon_vw (mekan 1/4477/4478) + DEPO canlı stok_adres_palet_vw (adrsAlanTipID IN 0,1). İkisi de CANLI/anlık — geçmiş-ay tarihçesi yok (WMS ay-sonu snapshot tutmaz). Yeni-biten-ay raporu için doğru (canlı≈ay-sonu); geriye-dönük eski-ay için ay-sonu kayar. Ay-başı = ay-sonu − ledger ay-net (irsHrk delta, tüm ehTip)."
    uygulama: "scripts/satinalma_hesap_sorma.py (Excel emitter) + sorgular/2026-08-12-satinalma-hesap-DINAMIK.sql (tam-SQL emitter). İkisi 2446/2446 üründe birebir (2026-08-13 doğrulandı). Kategori: bkm.UrunBilgi.Kat3ID IN 10/12/16."
    retail_momentum_floor: "beklenen = MAX(sezonluk-taban gy_sezon×max(1,g), floor). floor = (retail_son3/3)×sezon_ay. retail_son3 = son 3 ayın (a) her hareketi @RETAILCAP(50)'e kırpılmış (bulk/toptan düşer) + (b) SADECE çok-fişli aylardan (fiş≥3, tek-bulk ayı hariç). Neden: sezonluk-taban anomalik düşük olabilir (Okul'25=17) VEYA son-ay momentumunu kaçırır → yanlış FAZLA (matara: Tem'26 406 ama = tek bulk 405 → floor 0 → doğru FAZLA; Panini WC2026: sürekli retail → floor 2899 → eksik-stok, doğru). ACCOUNTABILITY-SAFE: gerçek over-buy'ın retail-momentum'u DÜŞÜK (o yüzden fazla) → floor şişirmez, over-buy'ı gizlemez. CAP kalibrasyon: Kat3 hareketlerinin %99,5'i ≤50, bulk >100 (%0,19 hareket = hacmin %24'ü). e-tic = retail (fis=999 hep sayılır). Parametrik SatinRetailCap. 3-emitter birebir."
    confidence: 0.95
    evidence: "2026-08-13 MCP: 200491 son fatura eID 7056126 = 44@2508 + 4@0 = 48 adet/2508 ₺ → 52.25 (satır-rn=1 tie 57 verir). Python≡DINAMIK birebir (openpyxl hücre-hücre, gerçek fark 0)."
    last_verified: "2026-08-13"

  bulunurluk_osa:
    tanim: "Şube-bazlı raf bulunurluğu (On-Shelf Availability). Bir SKU bir şubede M ayında 'bulunur' = GİRİŞ-bakiyesi (M-1 ay-sonu) ≥ min-stok(3). Kaynak: bkm.StokAyBakiyeMekanBazli (ay-sonu bakiye, carry-forward — bkz entities). Amaç: kuru-raf = kayıp satış görünür kıl + satınalma forecast tabanını düzelt (plan-33)."
    availability_gate: "GİRİŞ-bakiyesi kullan (M-1 ay-sonu), same-month-end DEĞİL — son-gün-gelen stok o ay satılamaz, ay-sonu 'stoklu' der (şişme). Satır sadece hareketli aya yazılır → carry-forward (Donem<=@ay ORDER BY Donem DESC) ŞART."
    oos_orani: "Şube×kategori OOS = (kuru-SKU / o şubede-taşınan-aktif-SKU). Aktif = son12 satan. Taşınan = geçmişte o şubede raf açılmış (kasıtlı-assortment ele — hiç taşınmayan SKU 'gap' değil)."
    kayip_satis: "Kuru şube + başka şubede kanıtlı-talep → kaçan adet. Şube-payı ROTASYON yüzünden güvenilmez (591060: FSM 0→0→71, Özlüce 65→270→0) → çapraz-şube oranı KULLANMA; her şube KENDİ stoklu-sezon medyanı (stok-gate: o sezon o şubede raf ≥3 olan sezonlar). Kaba üst-sınır: kismi_satis × (3−stoklu_sube)/stoklu_sube."
    uc_filtre: "Gerçek-gap ≠ ham kısmi-dağıtım: (1) geçmişte-taşımış (assortment ele), (2) mağaza-boyut normalizasyon (eksik-şube kendi ölçeğinde), (3) online-kanal (mekan 12) ayrı (raf-stoğu tutmaz, kuru sayma)."
    sizing: "2026-08-14 Faz0 (Kat3 10/12/16, son12): 42.744 aktif · kısmi(1-2 şube) 15.802 (%37, carry-in düzeltilmiş) · kaba kayıp ~263K adet. Ham (carry-in'siz) 16.238/%38/~377K — hareketsiz-stok şişirmesi."
    accountability: "Bulunurluk-düzeltilmiş taban satınalmada AYRI gösterilir; FAZLA kararını OTOMATİK değiştirmez (taban şişirme overbuy gizler — hesap-sorma aracının kırmızı çizgisi)."
    uygulama: "plan-33 (B-133 sema / B-134 BulunurlukQueries / B-135 sayfa / B-136 satınalma entegrasyon). Keşif: sorgular/2026-08-14-bulunurluk-sizing.sql."
    confidence: 0.9
    evidence: "2026-08-14 — sizing 3 varyant çalıştırıldı (ham/carry-in); tablo semantiği kod+veri doğrulandı (591060 birebir); 591060 vaka elle izlendi (şube×sezon stok+satış)."
    last_verified: "2026-08-14"

  banka_ekstresi_siniflandirma:
    kaynak: "dbo.car cTip=122 (Banka Ekstresi); köprü car-karsi-frm; kod car.cFatTip=122"
    problem: "Banka ekstresi satır açıklamasından (cNot) doğru cari (cKodKarsi) atama. Şule (insID 1897) elle yapıyor; oto-import/SP YOK. Pilot: muhasebe app (plan-27)."
    perspektif: "Çiftin BANKA-OLMAYAN tarafı = gerçek cari — cKod ∈ banka hesabı (frmTip=5) olan satırın cKodKarsi'si. cBA TEK BAŞINA ayraç DEĞİL (aynı işlemde bir satır cBA=0 gerçek tarafken diğeri cBA=1). mhs.mhsEntKontrolCar postalama için cBA=0 tarafını seçer (kanonik, çift-post engeli)."
    motor: "Lexical — normalize(cNot, tr-TR upper) + yön-anahtarlı çoğunluk. PERSPEKTİF KİLİDİ: index yalnız cKod frmTip=5 (banka) satırlardan (582K/807K), ayna/virman gürültüsü kalkar. Operasyon noktası: agree≥%97 & n≥5 → AUTO %99,62 doğru @ %69,7 kapsam (kilitsiz %98,8@%61 idi). Embedding v1'de gereksiz."
    gl_hesap: "cKodKarsi bilinince GL hesabı deterministik → köprü frm-mhsent-glhesap."
    confidence: 0.9
    evidence: "2026-07-04 — 807.600 satır zaman-bazlı holdout (son 30g) + canlı browser test (perspektif doğrulandı)."
    last_verified: "2026-07-04"
