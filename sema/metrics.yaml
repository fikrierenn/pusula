  wms_bekleyen_toplama:     # WMS raflanmamış sipariş ihtiyacı
    source: "J_DEPO_TOPLANACAK + J_ORDERS(WMSAKTARMA=1,STATUS=1000) + J_ORDER_DETAILS(STATUS IN 2000,2002,2003,2007) + J_DETAIL_BOXES(raflanmış)"
    formula: "ihtiyaç = SUM(QUANTITY sipariş) − ISNULL(SUM(raflanmış koli),0); depodan_toplanacak = ihtiyaç − JokerHavuz mevcut"
    note: "J_ORDER_DETAILS_COMP ile set/kompozit ürün açılır (COMPBARCODE/COMPITEMREF). DETAILS.STATUS=2003 (rafta) tarihi NULL'lanır."
    rapor: "BÜTÜNLEŞİK TOPLAMA DEPO DURUM.sql"
    UYARI_emirAyr: "B-111 keşfi (18.06): bu metrik J_ORDERS (e-tic) tarafı. DerinSIS depo.emirAyr.emTamam=0 ALTERNATİF DEĞİL — KİRLİ: 2.422 emir/~2M satır/4,3M kalan adet, header kTarih 2021'e kadar. depo.emir.emDurum=1 hem zombi hem taze kapsar → temiz açık/kapalı bayrağı YOK. emirAyr-tabanlı bekleyen kart için recency-filtre (son ~7g) ZORUNLU + zombi-uyarısı ayrı. Kanıt: sorgular/2026-06-18-wms-bekleyen-kesif.sql"
    last_verified: 2026-06-18

  cari_firma_stok_hareket:  # firma bazlı stok + 3 ay alış/satış (cari özet)
