  asiri_stok_esigi_turetildi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    kullanir: [metrics:asiri_stok_esigi_kategori_bazli]
    ad: "AŞIRI STOK EŞİĞİ — 5× seçilmişti, 3× ölçüldü"
    kural: >-
      Aşırı stok ölçütü: `SezonToplam > 0 AND ToplamStok > 3 * SezonToplam`. Eşik **3×**
      (eski 5× SEÇİLMİŞTİ, gevşek çıktı). Kodda tek sabitte —
      `SatisAnaliziQueries.AsiriStokSart` (KPI, kategori kırılımı, ODAK temin tablosu ve
      liste filtresi aynı sabitten okur; önce altı yerde ayrı `5 *` yazılıydı).
    nasil_turetildi: >-
      Sonuç değişkeni **yıllık devir** = 01.08.2025 başlangıç stoğunun SONRAKİ 12 AYDA
      satılan oranı; kapsama katına (stok ÷ 2024 sezon satışı) göre bantlandı:
      <2× → 6,36 (~2 ay stok) · 2-3× → 1,04 (~12 ay) · 3-5× → 0,71 (~17 ay) ·
      5-8× → 0,51 (~24 ay) · 8-15× → 0,40 (~30 ay) · 15×+ → 0,23 (~4,3 yıl).
      Hiç satmayan payı aynı yönde: <2× %16,2 → 15×+ %2,7.
      Devir 1,0'ın ALTINA **3×'te** düşüyor ⇒ 3× = "bir yıldan fazla stok". 5× ≈ 24 ay:
      aşırılığı ancak iki yılı geçince yakalıyordu.
    etki: >-
      Kesim 09.09.2026 (ölçüldü): 5× → 16.697 çeşit / 238,0M ₺ ·
      3× → **29.647 çeşit / 309,9M ₺** etiket; maliyetle **107,3M ₺** bağlı sermaye.
    confound: >-
      GİDERİLMEDİ, beyan edildi. (a) "Yıllık devir" hem stok düzeyini hem talep değişimini
      taşır — <2× bandının 6,36'sı sürekli takviye edilen hızlı ürünlerdir; ölçüt aşırılığı
      değil DEVRİ ölçüyor (ama karar değişkeni de devir). (b) TERS NEDENSELLİK: alıcı çok
      satmasını beklediğine çok stok koyar. (c) 15×+ bandı adet kütlesinin çoğunu taşıyor ve
      onu 5× de yakalıyordu; 5×→3× değişimi ~12.950 çeşit / ~72M ₺ etiket EKLİYOR.
    politika_borcu_KAPANDI: >-
      SÜPERSEDED 10.09.2026 — `bkm.OneriSiparisKtg3Ondeger` politika tablosu kullanıcı
      kararıyla İPTAL edildi ve eşik ÖLÇÜMLE kategori bazına çıkarıldı:
      panel geneli 3× · Kırtasiye 2× · Hazırlık Kitapları 8×.
      Ayrıntı: `asiri_stok_esigi_kategori_bazli`.
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-turetme-asiri-stok-ve-sezon.sql blok 2 + 3"
    last_verified: "2026-09-10"

  sezon_hazirlik_esigi_turetildi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "SEZON STOK AÇIĞI EŞİĞİ — 0,50 ölçümle doğrulandı"
    kural: >-
      Sezon açığı ölçütü: `SezonToplam > 0 AND ToplamStok > 0 AND ToplamStok < 0.50 * SezonToplam`
      (`SatisAnaliziQueries.SezonHazirlikSart`). "Stokta yokluk" kartından FARKLI: orada stok
      SIFIR, burada VAR ama yetmez. 0,50 artık SEÇİM değil ÖLÇÜM.
    nasil_turetildi: >-
      Sonuç değişkeni **gerçekleşme oranı** = 2025 sezon satışı ÷ 2024 sezon satışı, AYNI
      TALEP BANDI içinde (2024 Ağu–Eki satışı 10-200 adet; talep vekili önceki yıl).
      Kapsama = 01.08.2025 mağaza rafı ÷ 2024 sezon satışı:
      <0,25 → 0,34 · 0,25-0,50 → 0,61 · 0,50-0,75 → 0,75 · 0,75-1,00 → 0,84 ·
      1,00-1,50 → 0,93 · 1,50-3,00 → 1,24 · 3,00+ → 2,22.
      Tek yönlü, alt uçta dik, 1,00 kapsamada doyuyor (0,93). **0,50** = gerçekleşmenin
      çöktüğü çizgi (altında önceki yıl talebinin en az %39'u gerçekleşmiyor).
      "Yeterli" çizgisi 1,00; panel eşiği kritik çizgide tutuldu (kayıp listesi şişmesin).
    elenen_olcut: >-
      "Sezon sonunda stok ≤ 0" tükenme vekili olarak DENENDİ, ELENDİ: bantlara göre %0,4-6,6
      ve TEK YÖNLÜ DEĞİL — depo sezon içinde takviye ediyor, sezon-sonu stoğu tükenmeyi
      göstermiyor. Karşılanmamış talep GÖZLENEMEZ (satmadığının kaydı yok).
    confound: >-
      GİDERİLMEDİ. TERS NEDENSELLİK: yüksek kapsama zaten yüksek beklenti taşıyor (3,00+
      bandı 2,22). ORTALAMAYA DÖNÜŞ: <0,25 bandı en yüksek 2024 talebine sahip (54 adet) —
      o ürünler zaten aşağı çekilecekti. Tablo saf "bulunurluk etkisi" DEĞİL; ama alt uçtaki
      0,34 yalnız ortalamaya dönüşle açıklanamayacak kadar dik.
    etki: "Kesim 09.09.2026: 0,50 → 7.491 çeşit / 152,5M ₺ · 1,00 → 15.402 çeşit / 171,3M ₺"
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-turetme-asiri-stok-ve-sezon.sql blok 1 + 3"
    last_verified: "2026-09-10"

  acik_siparis_etip_suzgeci:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "AÇIK SİPARİŞ — dbo.sip satın alma tablosu DEĞİL, eTip süzgeci ZORUNLU"
    kural: >-
      "Yolda mal" / açık sipariş ölçümü `dbo.sip` + `dbo.sipAyr` üzerinden yapılırken
      **`s.eTip IN (0, 3)`** (Alış + Yerel Alım) süzgeci ZORUNLUDUR. Süzgeç olmadan tablo
      satın almayla ilgisi olmayan belgeleri döner — hem de bir kısmı TERS YÖNLÜ.
    kod_kumesi: >-
      `dbo.sipTip_vw` 14 kod (sqlcli lookup --count-from ile okundu, elle yazılmadı):
      0 Alış 41.743 · 1 Satış 6.997.606 · 2 Mağaza Depo 950 · 3 Yerel Alım 3.495 ·
      4 Depo Depo 931 · 8 Mağaza Mağaza 64 · 9 Alış İade Emri 27.614 ·
      10 Satış İade Emri 1 · 13 Depo Mağaza 22.100 · (5,6,7,11,12 canlıda yok).
      Alış tüm kayıtların yalnız %0,6'sı.
    neden_ters_yonlu: >-
      eTip 9 Alış İade Emri = tedarikçiye GERİ GÖNDERME (stok AZALTICI) · eTip 1 Satış =
      müşteri siparişi (stok AZALTICI) · eTip 2/4/8/13 = iç transfer (şirket stoğunu
      DEĞİŞTİRMEZ). Süzgeçsiz kart "yolda mal geliyor, üstüne alım yapma" derken mal
      aslında gidiyordu.
    olcum: >-
      2026-09-10, kesim 09.09.2026, 120 gün, panel geneli: uyarı alan 37.168 ürün ·
      17.139'unda (%46,1) gerçek alış siparişi SIFIR. Adet: filtresiz 4.543.969 ·
      GERÇEK ALIŞ 630.682 (%13,9) · alış iade emri 683.186 · müşteri siparişi 1.570.466 ·
      iç transfer 1.659.635 ⇒ gösterilen adedin %86'sı satın alma DEĞİLDİ.
      Örnek stkID 1672852: "33.262 adet" → gerçekte 0 alış (%68 iade emri, %25 iç transfer,
      %7 müşteri siparişi).
    iki_sinir: >-
      (a) `sipAyr.ehSevkAdet` alış satırlarının %100'ünde NULL (37.537/37.537) → karşılanma
      oranı ÖLÇÜLEMEZ; adet SİPARİŞ EDİLEN'dir, "yolda kalan" DEĞİL.
      (b) `eDurum = 2` (kapalı) 24.02.2025'ten beri HİÇ kullanılmamış (5.334 belgenin tamamı
      o tarihten eski) → "açık" iddiası eDurum'a güvenemez; tarih penceresi kısmi çözüm.
    tarih_tuzagi: "`s.eTarih` kullanılır — `eTarihS` DEĞİL. Pencere GETDATE() değil kesim tarihi."
    uygulama: "dashboard/Data/SatisAnaliziQueries.Liste.cs → GetAcikSiparisAsync"
    evidence: "2026-09-10 — sorgular/2026-09-10-acik-siparis-etip-ve-sezon-raf-acigi.sql blok 1a-1e"
    last_verified: "2026-09-10"

  sezonluk_raf_acigi_merkezde:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "SEZONLUK RAF AÇIĞI — mal merkezde, raf boş (eylem transfer)"
    kural: >-
      Kohort: geçen sezon **O MAĞAZADA** sattı (`SezonFsm/SezonOzl/SezonIst > 0`) ·
      bugün **O RAFTA** stok yok (`StokFsm/StokOzl/StokIst <= 0`) · merkez depoda mal var
      (`MerkezStok > 0`) · takviye muhafızı (`SonGiris IS NULL OR SonGiris < kesim-14`).
      Kayıp tutarı YALNIZ açığı olan mağazanın sezon adedi × fiyat (toplam sezon adedi
      kullanmak tutarı şişirir).
    neden_yeni_olcut: >-
      Panelin mevcut kartları TOPLAM stoğa bakıyor ve merkez stoğunu "var" sayıyor → raf boş
      olsa da "stok yeterli" görünüyor. ÖLÇÜLDÜ 2026-09-10 (mağaza bazlı, sezonda ≥10 adet):
      kohort 389 çeşit / 459 mağaza-ürün / geçen sezon 35.291 adet = 5.616.497 ₺ · merkezde
      74.830 adet. Kapsama: Sezon Stok Açığı 186 (%48, ama eylemi SİPARİŞ gibi okunuyor) ·
      Raf Bulunurluk Kaybı 52 (%13, ÜÇ rafın da boş olmasını şart koşuyor; 337'sinde başka
      mağazada stok var) · Stokta Yokluk 4 (%1) · Aşırı Stok 61 (%16, çelişki değil teşhis) ·
      **HİÇBİRİ 179 (%46)** = 15.507 adet / 1.135.340 ₺ panelde hiç görünmüyordu.
    talep_esigi_yok_olcum: >-
      Eşik ARANDI ve gerekçelenemedi. Gerçekleşme oranı (bu sezon Ağu+Eyl1-9 ÷ geçen yıl aynı
      pencere), sezon talep bandına göre — raf boş: 1-2 → 0,10 · 3-4 → 0,09 · 5-9 → 0,08 ·
      10-24 → 0,08 · 25-49 → 0,03 · 50+ → 0,06; raf dolu: 1,04-1,24 (her bantta).
      Boşluk HER BANTTA aynı derinlikte (~%92 kayıp) ⇒ talep eşiği listeyi değil SIRALAMAYI
      belirler; kart kayıp tutarına göre okunur.
    takviye_muhafizi_zorunlu: >-
      ANLIK-RAF TUZAĞI. Muhafızsız ölçümde 50+ bandı **2,93** çıkıyordu (raf boş olanlar raf
      dolu olanlardan İYİ satmış gibi): hızlı dönen üründe raf o gün boş ama ay içinde takviye
      gelmiş ve bol satmış — "bugün boş" kayıp DEĞİL, "hızlı tükendi" demek. SonGiris
      muhafızı ile 2,93 → 0,06.
    sinirlar: >-
      (a) `SonGiris` ÜRÜN düzeyinde (mağaza kırılımı yok) → "bu ürüne hiçbir mağazada takviye
      gelmedi" demek; muhafız TEMKİNLİ, gerçek kohortun bir kısmını dışarıda bırakır ama
      yanlış pozitif üretmez. (b) `MerkezStok` WMS anlık → hayalet stok riski (bkz.
      sql-server-conventions § WMS DE MUTLAK DOĞRU DEĞİL); adet küçükse fiziksel teyit ister.
    taban_genislemesi: >-
      `bkm.SatisAnaliziTaban` + `SezonFsm/SezonOzl/SezonIst` (int NULL). Ay1/Ay2/Ay3 üç
      mağazanın TOPLAMI olduğu için bu soruyu cevaplayamıyordu.
    panel_degeri: "Kesim 09.09.2026: 2.116 çeşit / 7.875.390,61 ₺ kayıp · merkezde 50.741 adet"
    uygulama: "SatisAnaliziQueries.cs → SezonRafAcigiSart/SezonRafAcigiTutar · SatisAnaliziTabanService.cs sezon CTE"
    evidence: "2026-09-10 — sorgular/2026-09-10-acik-siparis-etip-ve-sezon-raf-acigi.sql blok 2a-2b"
    last_verified: "2026-09-10"

  aylik_seri_tam_ay_hizasi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "AYLIK SERİLER TAM AY HİZALI — kesim−364 iki yarım ay üretiyordu"
    kural: >-
      Aylık grafik/seri pencereleri **son 12 TAM ay**: kesim ayının 1'inden 12 ay geriye,
      kesim ayı DIŞARIDA (`TamAyPenceresi`). Rolling `kesim−364` penceresi ile
      `DATEFROMPARTS(YEAR, MONTH, 1)` gruplaması 13 bar üretir ve ilk/son bar kırpıktır.
    olcum: >-
      2026-09-10, kesim 09.09.2026, 3 mağaza: Eyl 2025 21/30 gün → 512.619 adet (tam ayı
      910.765, yani %56'sı) · Eyl 2026 9/30 gün → 315.093. Eyl 2026'nın günlük hızı
      35.010/gün ile YILIN EN HIZLISI'ydı ama grafikte Ağustos'un (446.767) altında "düşük
      ay" gibi duruyordu. Grafikten okunan YoY −%38,5; aynı 9 güne göre gerçek −%20,9
      (398.146 → 315.093) — sapma iki kat.
      Sezon/dışı ayrımı (`MONTH IN (8,9,10)`) İKİ AYRI SEZONUN parçasını topluyordu:
      Eyl'25 kırpık + Eki'25 + Ağu'26 + Eyl'26 kırpık = 1.781.788 (tam 2025 sezonu
      1.843.439 — sayı yakın, ANLAMI yanlış). Tam-ay hizasında sezon günü tam 92 = üç tam ay.
    kapsam_ayrimi_bilincli: >-
      Yalnız AYLIK SERİLER hizalandı. Tabandaki `SatisToplam` hâlâ 365 gün — manşet KPI'ın ve
      kaynak Excel raporunun (Kübra) tanımı; 12 tam ay olsa 5.655.586 → 5.738.639 (+%1,5) ve
      her KPI kayardı. İki tanım bilerek ayrı: grafik ölçüm doğruluğu için hizalı, manşet
      süreklilik için 365 gün. Ekranda kapsam bandında yazılı.
    hizalanan: "GetAylikSatisAsync · GetAylikAlisAsync · GetAylikStokAsync · GetHizAsync"
    hizalanmayan: "GetGerceklesenAsync (POS 365g) · GetTedarikAsync (alış faturası 365g) · GetMerkezKarsiTarafAsync (365g tek toplam) — aylık seri DEĞİL"
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-turetme-asiri-stok-ve-sezon.sql yanında ölçüldü; ay-gün tablosu journal'da"
    last_verified: "2026-09-10"

  defter_guvenilir_onsarti:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "DEFTER GÜVENİLİR ÖN-ŞARTI — negatif stok fiziksel durum değil, defter hatası"
    kural: >-
      Bulunurluk / kayıp / eylem kartlarının HEPSİ şu ön-şartı taşır:
      `StokFsm >= 0 AND StokOzl >= 0 AND StokIst >= 0 AND MerkezStok >= 0 AND SatisFiyat > 0`.
      Negatif defter stoğundan "raf boş" veya "stok yok" sonucu ÇIKARILAMAZ — mal girişi karta
      yazılmamış, satış yazılmıştır. `StokX <= 0` yazan her ölçüt bu tuzağı taşır.
    neden: >-
      Vaka stkID 643638 "Missim Bijuteri 49,50 Tl" (FİYAT KARTI, "gir çık" deseni):
      11 alış hareketi / 1.113 adet karşısında 1.106 satış hareketi / 1.889 adet →
      raf FSM -216 · Özlüce -250 · İst.Yolu -36, merkez 1 adet, tutar -24.799,50 ₺.
    olcum: >-
      2026-09-10, kesim 09.09.2026, evren 275.385: güvenilmez 327 çeşit (%0,12) ama TUTAR
      ETKİSİ ORANTISIZ (yüksek satışlı fiyat kartları): Stokta Yokluk kartında 49 çeşit
      1.972.350 ₺ = kartın %8,5'i · Raf Bulunurluk 11 çeşit · Sezon Açığı 62 çeşitte bir raf
      negatif (eksik adedi şişiriyordu) · Mağaza Arası Dengesizlik 193 çeşitte MagazaStok
      pozitifken bir raf negatif (maskeleme) · Aşırı Stok 0 kaçak (matematik zaten koruyordu).
    istisna: >-
      ENVANTER DEĞERİ kartı bu şartı UYGULAMAZ — evrenin TOPLAM değerini gösterir, güvenilmez
      kayıtları çıkarmak bilançoyu yanlış yapar. Onlar "doğrulanamıyor" satırında beyan edilir.
    kart_etkisi: >-
      Ölü Stok 154,0M → 142,6M ₺ (116.924 → 115.670 çeşit) · Stokta Yokluk 23,1M → 21,1M
      (8.102 → 8.046) · Raf Bulunurluk 10,0M → 6,8M (3.476 → 1.152, B2 dahil) · Sezon Stok
      Açığı 152,5M → 150,4M · Aşırı Stok 309,4M → 308,3M · Dengesizlik 25,4M → 25,0M.
    uygulama: "dashboard/Data/SatisAnaliziQueries.cs → DefterGuvenilirSart (tek kaynak, 6 kart + liste filtreleri)"
    evidence: "2026-09-10 — sorgular/2026-09-10-acik-siparis-etip-ve-sezon-raf-acigi.sql + KPI denetimi (veri-dogrula)"
    last_verified: "2026-09-10"

  varlik_degil_yeterlilik:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "VARLIK ŞARTI ≠ YETERLİLİK ŞARTI (transfer/temin kartlarında)"
    kural: >-
      "Merkezde mal var → transfer yeter" iddiası `MerkezStok > 0` ile kurulamaz. Kartın
      önerdiği EYLEM gerçekleşebilir olmalı: eksik adedi karşılayan miktar (Sezonluk Raf
      Açığı: `MerkezStok >= eksikAdet`) ya da anlamlı transfer miktarı (Raf Bulunurluk Kaybı:
      `MerkezStok >= 5`).
    olcum: >-
      2026-09-10: Sezonluk Raf Açığı'nda 2.116 çeşidin 622'si (5.793.010 ₺ = tutarın %74'ü)
      merkez eksiği karşılamıyordu; uçta 120 çeşidin kaybı 3,49M ₺ iken merkezde 306 adet.
      Raf Bulunurluk Kaybı'nda 3.476'nın 1.808'i (%52) merkezde <=2 adet taşıyordu (1.896.000 ₺).
    esik_secimi: >-
      Raf Bulunurluk için yeterlilik ölçütü ARANDI: `> 0` → 3.464 çeşit / 9,97M ₺ ·
      14 GÜNLÜK TALEP KAPSAMASI → 3.426 (neredeyse hiç elemiyor — yavaş üründe eşik bir adedin
      altına düşüyor, Dengesizlik kartındaki AYNI tuzak) · mutlak `>= 5` → 1.152 / 6,75M ₺
      (SEÇİLEN) · ikisi birlikte → 1.151 (göreli şart bağlayıcı DEĞİL, eklenmedi).
      ⚠ 5 eşiği ÖLÇÜMLE TÜRETİLMEDİ; panel içi tutarlılıktan geliyor (DengesizSart da
      "anlamlı miktar" için 5 kullanıyor). Bu açıkça beyan edilir.
    evidence: "2026-09-10 — bant ölçümü (mevcut / 14g / >=5 / ikisi / +satışı var)"
    last_verified: "2026-09-10"

  olu_stok_pos_capraz_denetimi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "ÖLÜ STOK — POS ile çapraz denetlenir, rafa çıkmamış AYRILIR"
    kural: >-
      Ölü stok ölçütü `SatisToplam <= 0 AND ToplamStok > 0 AND yeniDegil` YETMEZ. Üç ek şart:
      (a) `PosAdet IS NULL OR PosAdet <= 0` — POS bağımsız kaynaktır, ERP defteriyle çelişirse
      ürün ölü sayılamaz; (b) `IlkGiris IS NOT NULL` — mağazaya hiç girmemiş mal satamaz,
      ona ölü damgası haksızdır ve eylemi ZITTIR ("rafa çıkar" vs "iade/imha");
      (c) defter güvenilir ön-şartı.
    olcum: >-
      2026-09-10, kesim 09.09.2026: 116.924 çeşidin 348'i POS'ta satmış (1.686.915 ₺) — ERP
      "365 günde satış yok" derken POS "sattı" diyor. 61 çeşitte `SatisToplam < 0`
      (iade > satış) — onlar da satmış. 895 çeşit / 9.711.542 ₺ aynı anda "Rafa Çıkmamış
      Envanter" kartındaydı (iki kart ZIT eylem öneriyordu).
      Sonuç: 116.924 → 115.670 çeşit · 154,0M → 142,6M ₺.
      ✅ "Hiç satılmamış" alt ölçütü POS ile HİÇ çelişmiyor (0 çeşit) — temiz.
    evidence: "2026-09-10 — KPI denetimi (veri-dogrula), taban PosAdet çapraz kontrolü"
    last_verified: "2026-09-10"

  kpi_tutar_tabani_ayrimi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    kullanir: [metrics:olu_stok_pos_capraz_denetimi]
    ad: "KPI ŞERİDİNDE TUTAR TABANI ÜÇ FARKLI ŞEY — toplanamaz"
    kural: >-
      Kartların ₺ değeri üç ayrı tabandan gelir ve HER KARTTA YAZILI olmalı:
      **stok değeri** (elimizdeki malın etiketi) · **kayıp potansiyeli** (olmayan satış:
      eksik adet × etiket) · **kâr** (365 günde kazanılan). Yan yana duran bu üç taban
      toplanabilir GÖRÜNÜR ama toplamı anlamsızdır.
    olcum: >-
      2026-09-10: 6.170 çeşit ≥2 kartta, 278'i ≥3 kartta görünüyor. Aşırı Stok ∩ Ölü Stok
      1.842 çeşit / 6.207.815 ₺ İKİ KARTTA BİRDEN sayılıyor. Ölü Stok ∩ Rafa Çıkmamış
      895 çeşit / 9.711.542 ₺ (bu ayrıldı — bkz. olu_stok_pos_capraz_denetimi).
      Çakışma ÇELİŞKİ DEĞİL teşhistir (aynı mal hem fazla hem satmıyor), ama tutarlar toplanmaz.
    ayrica: >-
      "Doğrulanamıyor" satırında ÇEŞİT 6 koşuldan, TUTAR yalnız 2 koşuldan geliyordu
      (327 çeşit vs 106) → sayı ile para AYNI KÜMEDEN DEĞİLDİ. İkisi de artık
      `DefterGuvenilmezSart`'tan gelir; tam tutar 931.395 ₺.
    evidence: "2026-09-10 — kart-kesişim matrisi ölçümü"
    last_verified: "2026-09-10"

  gerceklesen_marj_maliyet_yasi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "GERÇEKLEŞEN MARJ maliyetin YAŞINI taşır — ayrıştırılamayan sapma"
    kural: >-
      Birim maliyet tarih penceresi OLMADAN "son 5 alış faturası"ndan gelir = BUGÜNKÜ maliyet;
      payı olan POS satışı ise 365 GÜNLÜK. Marj bu asimetriyi taşır. Maliyet YENİDEN
      DEĞERLENMEZ (uydurma olur) — beyan edilir. `MaliyetTarih` kolonu bu sapmayı ölçülebilir
      kılmak için tabana eklendi (önce ölçülemiyordu).
    olcum: >-
      2026-09-10, kesim 09.09.2026, maliyeti+POS satışı olan 143.799 çeşit — maliyet yaşına
      göre marj: <3 ay %24,4 (net satışın %58'i, 433,3M ₺) · 3-6 ay %36,5 (126,7M) ·
      6-12 ay %40,0 (119,1M) · 1-2 yıl %44,1 (52,3M) · 2+ yıl %63,0 (17,4M, %2,3).
    iki_mekanizma_ayristirilamaz: >-
      (1) ENFLASYON: eski maliyet düşük → marj şişkin (ÖLÇÜM HATASI).
      (2) DEVİR HIZI: 2 yıldır alınmayan ama satan ürün yavaş dönendir ve zaten yüksek
      marjlıdır (GERÇEK). İkisi AYNI YÖNE çalışıyor; hangi payın hangisi olduğu ölçülemiyor.
      Bu yüzden düzeltme YAPILMADI, panel bandında beyan edildi.
    etki_sinirli: "Maliyeti 1 yıldan eski çeşit payı %28,7 ama NET SATIŞ payı yalnız %9,3"
    evidence: "2026-09-10 — taban MaliyetTarih kolonu + yaş bandı × marj ölçümü"
    last_verified: "2026-09-10"

  esik_turetme_istatistigi:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "EŞİK TÜRETME — Cochran-Armitage + Wilson, ve veriden-seçilen-kesimin bedeli"
    kural: >-
      Bir eşik "veriden türetildi" denilerek ÖLÇÜLDÜ sınıfına yazılamaz. Sıralı bantlarda
      oran trendi **Cochran-Armitage** ile (ki-kare 1 sd), oranlar **Wilson skor aralığı** ile
      sınanır. Kesim ancak (a) desen MONOTON ve (b) komşu bantların GA'ları ÇAKIŞMIYORSA
      desteklenmiş sayılır.
    kritik_ders: >-
      KÜÇÜK p BİR ÖLÇÜTÜ DOĞRULAMAZ. BKM vakası: "merkez stoğu" ekseninde chi2(1)=95,57 ·
      p=1,43e-22 çıktı ama desen monoton DEĞİLDİ (3,2 → 4,9 → 8,2 → 7,4 → 6,4 → 11,9) ve iki
      komşu bant GA'sı çakışıktı → ölçüt REDDEDİLDİ. Cochran-Armitage yalnız DOĞRUSAL trende
      karşı güçlüdür; U-şeklini/monoton olmayanı kaçırır.
      Kabul edilen eksen "önceki yıl talebi": chi2(1)=873,01 · p=7,24e-192 · MONOTON
      (%3,5 → 13,3 → 38,4 → 57,4 → 60,0); 1-4 [11,6-15,2] ile 5-19 [32,4-44,9] çakışmıyor.
      Üst iki bant (n=47, n=10) tek başına güvenilmez → aralarında ayrım yapılmadı.
    veriden_secilen_kesimin_bedeli: >-
      Altman & Royston 2006 (BMJ, "The cost of dichotomising continuous variables") ·
      Royston/Altman/Sauerbrei 2006 (Stat Med, "Dichotomizing continuous predictors in
      multiple regression: a bad idea"): veriden türetilen "optimal kesim" gruplar arası farkı
      ABARTIR, spuriously significant sonuç riski taşır, tekrarlanabilirliği düşüktür;
      medyandan bölmek verinin üçte birini atmakla aynı güç kaybını verir. Sürekli değişkeni
      korumak (spline/kesirli polinom) önerilir.
      ⇒ Kesimdeki oran farkı bir ETKİ ÖLÇÜSÜ olarak SUNULMAZ, yalnız kohort seçiminde
      kullanılır. Panelin üç eşiği de (aşırı stok 3× · sezon 0,50 · raf kaybı 5 satış) bu
      uyarıya tabidir ve ekranda beyan edilir.
    sinama: "\"Eşiği bir başkası aynı veriyle bağımsız türetse aynı sayıyı bulur muydu?\" Bulamayacaksa eşik SEÇİLMİŞTİR."
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-istatistik-ve-talep-deseni.sql blok 1"
    last_verified: "2026-09-10"

  talep_deseni_aralikli:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "TALEP DESENİ — çeşitlerin %91,9'u ARALIKLI, gün-stok onlarda yanıltıcı"
    kural: >-
      BKM ürün tabanı ağırlıkla **aralıklı talep** (intermittent demand) taşır. Aralıklı
      talepte ortalama, çoğu SIFIR olan dönemlere yayılır → "günlük ortalama satış" ve
      "gün-stok" ÜRÜN bazında yanıltıcıdır. Literatür talep BÜYÜKLÜĞÜNÜ ve TALEP-ARASI
      ARALIĞI ayrı tahmin eder: Croston 1972 · Syntetos-Boylan 2005 (SBA — Croston'ın
      yanlılığını düzeltir) · Syntetos/Boylan/Croston 2005 (sınıflandırma: ADI + CV², ADI
      eşiği ~1,32) · Teunter/Syntetos/Babai 2011 (TSB — eskime için sıfır-talep olasılığı).
    olcum: >-
      2026-09-10, Eyl 2025 – Ağu 2026 (12 TAM ay), satış olan ay sayısına göre, 275.385 çeşit:
      hiç satmadı 121.411 (%44,1) · 1-2 ay ADI>=6 → 76.912 (%27,9) · 3-4 ay → 27.587 (%10,0) ·
      5-8 ay → 27.045 (%9,8) · **9-12 ay, ADI<=1,33 DÜZGÜN → 22.430 (%8,1)**.
    uygulama: >-
      Croston/SBA ayrıştırması panelde YAPILMADI. Ürün bazlı gün-stok yalnız düzgün talepli
      %8,1'de güvenilir; kategori agregasında daha savunulabilir. Panel bandında beyan edildi.
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-istatistik-ve-talep-deseni.sql blok 2"
    last_verified: "2026-09-10"

  devir_hizi_sektor_kiyasi:
    tip: oran
    birim: oran
    taban: yok
    additivity: yok
    ad: "DEVİR HIZI — kategori bazlı ölçüm ve sektör hedef aralığı"
    olcum: >-
      2026-09-10, kesim 09.09.2026, güvenilir defter (mağaza stoğu ÷ 365 günlük mağaza satışı,
      adet): Dergi 5,95 · Oyuncak 3,29 · Hazırlık Kitapları 3,16 · Hediyelik 2,11 ·
      Çocuk Kitabı 2,09 · Elektronik 1,91 · Akademi 1,35 · **Kitap 1,28** · **Kırtasiye 1,25**.
      Gün-stok: Kırtasiye 291 · Kitap 285 · Akademi 270 · Dergi 61.
      Yaklaşık GMROI: 0,32-1,38 (Hazırlık 1,38 en yüksek).
    sektor_hedefi_CIKARIM: >-
      Yayınlanmış kitapçı hedefi 3,0-4,0 devir/yıl (yüksek performanslı 4-6); GMROI hedefi
      çoğu perakende kategorisinde 3,0+, tipik aralık 1,0-4,0. Kitap ve Kırtasiye hedefin
      ~%32-42'sinde dönüyor.
      ⚠ Bu bir ÇIKARIM/kıyastır, ölçüm değil: kaynak TİCARİ/SEKTÖR YAYINI (akademik ölçüm
      değil) ve BKM saf kitapçı DEĞİL — kırtasiye + sınav okulları + grup şirketi mal akışı
      (merkez çıkışının %72'si frmID 56, tüketici talebi değil).
      ⚠ GMROI hesabı STANDART DEĞİL: payda ANLIK stok maliyeti (ortalama stok değil), pay
      365 günlük POS kârı, maliyet kapsamı etiket bazında %94,7 → "yaklaşık" etiketiyle.
    esik_karari: >-
      Aşırı stok eşiği sektör hedefine ÇEKİLMEDİ. 3× eşiği yıllık devir 1,0'a denk; sektör
      hedefi ~0,25-0,33× kapsamaya karşılık gelir ve kohorta 200 binden fazla çeşit sokup
      listeyi işe yaramaz hâle getirir. Fark bilinçli ve panelde beyan edildi.
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-istatistik-ve-talep-deseni.sql blok 3"
    last_verified: "2026-09-10"

  kayit_dogrulugu_ve_sansurlu_talep:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "KAYIT DOĞRULUĞU ölçülmüş değil · KAYIP SATIŞ tahminleri ALT SINIR"
    kayit_dogrulugu: >-
      Panelin "doğrulanamıyor" oranı %0,12 (327/275.385) bir DOĞRULUK ORANI DEĞİLDİR — yalnız
      aritmetik olarak imkânsız kayıtların (negatif stok / fiyat 0) oranıdır. Literatürde
      kayıt-fiziksel uyuşmazlığı (inventory record inaccuracy) SKU'ların %50-70'inde görülür;
      DeHoratius & Raman 369.567 kaydın %65'ini hatalı bulmuş, hataların %41'i "fiziksel >
      kayıt" yönünde; hayalet stok kaynaklı kayıp ~yıllık cironun %4'ü. Gerçek sapma yalnız
      FİZİKSEL SAYIMLA bilinir ve muhtemelen çok daha büyüktür.
    sansurlu_talep: >-
      Kayıp satış tahminleri (Sezon Stok Açığı · Stokta Yokluk) ALT SINIRDIR: talep vekili
      olarak geçen yılın GERÇEKLEŞEN satışı kullanılıyor, o satış da stok tükenen günlerde
      kesilmiş (istatistikte SAĞDAN SANSÜRLÜ). Kabul görmüş düzeltme EM tabanlı sansürlü-talep
      tahmini + stok-tükenmesi kaynaklı ikame modellemesidir (Anupindi/Dada/Gupta 1998 ·
      Conlon & Mortimer). Panelde uygulanmadı → tutarlar gerçek kaybın ALTINDA, üstünde değil.
    evidence: "2026-09-10 — literatür taraması + panel oranlarının karşılaştırılması"
    last_verified: "2026-09-10"

  talep_sinifi_panelde:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "TALEP SINIFI panelde ölçüt oldu — gün-stok geçerlilik kapısı"
    kural: >-
      Taban `SatanAy` (son 12 TAM ayda satış olan ay sayısı) ve `TalepCV2` (sıfır-olmayan
      aylık talep büyüklüklerinin kareli değişim katsayısı) taşır. SINIF kodda hesaplanır
      (`TalepSinifiSql`): ADI = 12 / SatanAy · eşikler **ADI 1,32** ve **CV² 0,49**.
      0 hiç satmadı · 1 düzgün · 2 değişken · 3 aralıklı · 4 sıçramalı.
      `GunStok` yalnız ADI ≤ 1,32'de hesaplanır; aksi hâlde NULL döner ve ekranda sebebi yazar.
    esikler_disaridan: >-
      ADI 1,32 ve CV² 0,49 YAYINLANMIŞ eşiklerdir (Syntetos/Boylan/Croston 2005), BKM
      verisinden türetilmedi. Bu bilinçli: panelin diğer üç eşiği (aşırı stok 3× · sezon 0,50 ·
      raf kaybı 5 satış) Altman & Royston uyarısına tabidir, bu ikisi DEĞİL.
    olcum: >-
      2026-09-10, kesim 09.09.2026 tabanı (275.385 çeşit) — kod hesabı ham ölçümle BİREBİR:
      hiç satmadı 121.411 / 194,5M ₺ / satış 4.027 · düzgün 11.156 / 139,7M / 1.946.808 ·
      değişken 6.671 / 160,6M / 1.572.201 · aralıklı 121.590 / 396,5M / 944.251 ·
      sıçramalı 14.557 / 129,4M / 667.757.
      Panelde şerit: düzgün+değişken 17.827 çeşit / 300,3M ₺ · aralıklı+sıçramalı 136.147 /
      525,9M ₺. Satışın %68,5'i çeşitlerin %6,5'inden; stoğun %57,9'u (591,2M ₺) aralıklı ya
      da hiç satmayanlarda ve satışın oradan payı %18,5.
    yapilmadi: >-
      SBA/TSB TAHMİNİ YOK — panel yalnız SINIFLANDIRMAYI kullanıyor, sipariş önerisi üretmiyor.
      Sınıflandırma "bu metrik burada geçerli mi" sorusunu cevaplar.
    uygulama: "SatisAnaliziTabanService (tdes CTE) · SatisAnaliziQueries (TalepSinifiSql/GunStokGuvenilirSart) · Models (GunStok muhafızı, TalepDeseniAd) · panel şeridi + iki filtre + iki kolon"
    evidence: "2026-09-10 — sorgular/2026-09-10-esik-istatistik-ve-talep-deseni.sql blok 2"
    last_verified: "2026-09-10"

  hucre_eslemesi_tek_kaynak:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "HÜCRE EŞLEMESİ ÇATALLANMASI — iki yönlü sessiz boş kolon (düzeltildi)"
    kural: >-
      Kolon anahtarı → değer eşlemesi TEK yerde: `Data/SatisAnaliziHucre`. Ham değer
      `Deger()`, ekran metni `Metin()`. Kanonik anahtar kümesi
      `Models.SatisAnaliziKolonlar`. Yeni kolon eklenince tek dosya değişir.
    ne_olmustu: >-
      Ekran tablosu (`SatisAnaliziTablo.razor`) YEREL bir kopya taşıyordu, Excel endpoint'i
      ortak eşlemeyi kullanıyordu. İkisi çatallandı ve ÇİFT YÖNLÜ sessiz veri kaybı üretti:
      ekranda `sonsatis` hiç yoktu, yeni `talepdeseni`/`satanay` `_ => ""` dalına düşüp BOŞ
      görünüyordu; Excel'de ise anahtar adları farklı yazıldığı için (`sezon_kapsama` vs
      `kapsama`, `ay1..3` vs `sezon_ay1..3`) o kolonlar boş çıkıyordu. Hata mesajı YOK —
      yalnız boş hücre. Kullanıcının istediği "Son Satış" kolonu bu yüzden ekranda çalışmıyordu.
    ders: >-
      Aynı biçimlendirmeyi iki yerde tutmak "sessiz yanlış rakam" sınıfının en sinsi hâli:
      derleyici görmez, test yoksa kimse görmez, kolon sadece boş kalır.
      `emitter-ayrimi.md` — tek hesap çekirdeği, çoklu emitter; BİÇİM de tek yerde.
      Denetim komutu: kolon tanımı anahtarları ile eşleme anahtarlarını `comm` ile karşılaştır.
    evidence: "2026-09-10 — anahtar kümesi karşılaştırması + panelde doğrulama (Son Satış/Talep Deseni/Satan Ay/Kapsama dolu)"
    last_verified: "2026-09-10"

  iade_davranisi_vekili:
    tip: kural
    birim: yok
    taban: yok
    additivity: yok
    ad: "İADE HAKKI — kod anlamı çıkmadı, GÖZLENEN iade oranı vekil olarak çalışıyor"
    kod_anlami_cikmadi: >-
      `dbo.frm.frmIadeKural` 0/1/2 anlamı VERİDEN ÇIKARILAMADI (ölçüldü 2026-09-10).
      Hipotez "iade hakkı olmayan kodda fiilî iade de olmaz" idi; ölçüm çürüttü:
      frmTip=0 tedarikçilerde son 365 gün — kod 0 → 87 alışın 16'sına iade (%18,4
      [11,6-27,8]) · kod 1 → 11 alışın 4'üne (%36,4 [15,2-64,6]) · kod 2 → 90 alışın
      36'sına (%40,0 [30,5-50,3]). Adet bazında iade/alış: %19,26 / %1,40 / %5,42.
      Cochran-Armitage chi2(1)=9,86 p=0,00169 ANLAMLI ama komşu Wilson aralıklarının
      HEPSİ ÇAKIŞIK ve kod 1'de n=11.
      ⇒ `olctum-mu-cikardim-mi.md` § EŞİK TÜRETME kuralına göre AYRIM DESTEKLENMEDİ.
      Üç kodun hepsinde fiilî iade var; hiçbiri "iade yok" demiyor. Kod fiilî davranışı
      ÖNGÖRMÜYOR. B-150 veriden kapatılamaz — muhasebe/satınalma teyidi şart.
      ⚠ SORU DEĞİŞTİ: "hangi kod iade hakkı var?" yerine "bu alan bugün bir kural mı
      taşıyor, yoksa terk edilmiş bir varsayılan mı?"
    vekil_kural: >-
      Koda ihtiyaç duymadan: tedarikçinin **gözlenen 2 yıllık iade oranı**
      (iade ehTip 2 adedi ÷ alış ehTip 0+10 adedi). Ürünün tedarikçisi = son alış
      faturasının firması (730 gün içinde, `fat.eTip=0 AND eDurum<>2`).
    olcum: >-
      2026-09-10, aşırı stok kohortu (3× eşiği, güvenilir defter, 308,3M ₺):
      hiç iade yok 905 çeşit / 20,7M ₺ (%6,7) · %0-2 → 2.379 / 56,9M (%18,5) ·
      %2-10 → 20.171 / 137,9M (%44,7) · %10-25 → 1.124 / 45,1M (%14,6) ·
      %25+ → 26 / 2,1M (%0,7) · tedarikçi bilinmiyor 5.019 / 45,6M (%14,8).
