# BKM Semantik Katman — SÖZLEŞME (şemanın şeması)
# Koşar: python tools/sema_denetim.py   → exit 0 geçti · 1 KIRIK · 2 KOŞAMADI
#
# NEDEN VAR (ölçüm 2026-09-11, plan-44):
#   · entities'te ~100 alan adı YALNIZ 1 kayıtta kullanılmış → şema yok, YAML noktalamalı prose.
#   · Kanıt 4 ayrı adla yazılmış (evidence/olcum/dogrulama/kanit), açıklama 6 ayrı adla.
#   · 312 kaydın 140'ında kanıt alanı, 102'sinde last_verified yok → decay boşta dönüyor.
#   · 81 çapraz referansın tamamı prose'a gömülü → köprü adı değişse kimse görmez.
#
# TASARIM KARARI: alan adları SIFIRDAN uydurulmadı; her dosyada ZATEN BASKIN olan ad kanonik
# seçildi (evidence 149× · note 165× · last_verified 210× · confidence). Azınlık eş-anlamlılar
# bunlara katlanır. Böylece mevcut tüketiciler (tools/sema_degismez.py, tools/sema_sorgu_dumani.py,
# skill'ler, SEMANTIK_KATMAN.md) kırılmaz.
#
# ZENGİNLİK SİLİNMEZ: sözleşme dışı tek-kullanımlık alanlar (urnTip_olculdu, MOLA_OKUTULMUYOR,
# kural_1_vardiya_araligi …) `ayrinti:` haritasının altına taşınır. Üst seviye sözleşmeye uyar,
# bilgi kaybı sıfır.
#
# KADEMELİ SIKILAŞTIRMA: her kural `seviye: kirik|uyari` taşır. Faz tamamlandıkça uyarı → kırık'a
# yükseltilir. Bugün kırık olan bir kuralı gevşetmek YASAK (regresyon).

version: 1
updated: 2026-09-11
plan: "plans/44-sema-sozlesme-ve-temellendirme.md"

# ─────────────────────────────────────────────────────────────────────────────
# 1. ORTAK ALANLAR — her kayıt tipinde aynı anlama gelir
# ─────────────────────────────────────────────────────────────────────────────
common:
  required:
    confidence:
      type: sayi
      range: [0.3, 1.0]
      level: uyari            # F2 sonrası kirik
      description: "1.0 kalıcı (PK/FK) · 0.9-0.99 canlı %99+ · 0.5-0.8 gözlem · 0.3-0.5 hipotez"
  conditional_required:
    last_verified:
      type: tarih               # YYYY-MM-DD
      level: uyari            # F2 sonrası kirik
      exempt_condition: "confidence == 1.0"
      description: "Kaydın canlı sorguyla EN SON teyit tarihi. evidence=ilk keşif, bu=son teyit."
    evidence:
      type: metin
      level: uyari            # kanıt UYDURULAMAZ — ölçülünce yazılır, o yüzden kalıcı uyarı
      exempt_condition: "kanit_durumu == 'yok'"
      description: >-
        NASIL/NEREDEN doğrulandı — yöntem ve kaynak: tarih + arşiv SQL yolu + hangi karşılaştırma.
        ÇIKAN SAYILAR buraya değil `olcum:` alanına yazılır (aşağı bak).
  optional:
    measurement:
      type: metin
      description: >-
        NE ÇIKTI — ölçümün kendisi: tarih + kesim + sayılar.
        `evidence` ile AYRI ALANLAR, eşanlamlı DEĞİL. Ölçüm 2026-09-11: 20 kayıtta ikisi
        birlikte kullanılmış ve anlamları tutarlı biçimde farklıydı —
        `olcum: "2026-09-10 … 143.799 çeşit · net 748.824.435 ₺ · marj %31,17"` vs
        `evidence: "2026-09-10 — sorgular/2026-09-10-…sql blok 2"`.
        Birini ötekine katlamak bilgi yok eder. Ayrım, `olctum-mu-cikardim-mi.md`
        kuralının yapısal karşılığıdır: DEĞER ile onun ARKASINDAKİ KOMUT ayrı durur.
        Ayrıca `semantic-layer.md` § DEĞİŞMEZ ≠ ÖLÇÜM ile hizalı: `olcum` tarih damgalı ve
        bayatlayabilir; `evidence` yöntemdir, bayatlamaz.
    note: {type: metin, description: "Serbest açıklama / tanım. Kanonik açıklama alanı."}
    ttl_days: {type: tamsayi, description: "Yeniden-doğrulama aralığı. Yoksa confidence'tan türetilir."}
    evidence_status:
      type: metin
      values: [none, pending]
      description: "Kanıt YOKSA bunu yaz — sessiz eksik yerine BEYAN edilmiş eksik."
    uses:
      type: liste
      format: "<dosya>:<id>"    # ör. bridges:irshrk-stk · codes:irsHrk.ehTip · metrics:net_ciro
      level_unresolved: kirik # referans çözülemiyorsa KIRIK — kırık referans sessiz kalmaz
      description: "Açık çapraz referans. Prose'a gömülü bahis bunun yerine geçmez."
    details:
      type: harita
      description: "Sözleşme dışı zengin/tek-kullanımlık alanlar. Silme yerine kapsülleme."
    status: {type: metin, values: [teyit bekliyor, superseded], description: "Yaşam döngüsü işareti."}
    stamp_inherited:
      type: bool
      description: >-
        `last_verified` bu kaydın KENDİ doğrulamasından değil, ayrıldığı EBEVEYN kayıttan
        devralındı — bulgunun gerçek doğrulama tarihi bilinmiyor. Sessizce ebeveynin damgasını
        takmak yalan olurdu; işaret bunu görünür kılar. Yeniden ölçülünce alan SİLİNİR.
    atomicity_reason:
      type: metin
      description: >-
        Kayıt atomiklik tavanını aşıyor ama BÖLÜNMEMELİ — neden? Tek bir nesnenin dosyası
        (bir tablonun tüm kuralları) bölünürse parçalanır. Beyan edilmiş istisna sessiz
        istisnadan iyidir: gerekçe yazılmadan muafiyet YOK.

# Eş-anlamlı alanlar → kanonik karşılık. Denetçi bunları "göç bekliyor" diye sayar.
# `source` BİLEREK dosyaya göre farklı çözülür: metrics'te veri kaynağı, queries'te kaydın kökeni.
# DİKKAT: `olcum` BİLEREK `evidence`'ın eşanlamlısı DEĞİL (yukarı bak). İlk taslakta öyle
# yazılmıştı; 20 kaydın içeriği okunarak düzeltildi — `kanit`/`dogrulama` da sayı taşıyor,
# yani `evidence`'ın değil `olcum`'un eski adları.
# Eski alan adları → kanonik İngilizce karşılık. 2026-09-11 göçünden SONRA bu liste
# İLERİYE DÖNÜK ZORLAYICIDIR: biri yeniden `tip:`/`kural:`/`olcum:` yazarsa denetçi uyarır.
# Göçten önceki Türkçe adlar da burada duruyor — tarihçe silinmez, kural hâline gelir.
synonyms:
  type: [tip]
  unit: [birim]
  basis: [taban]
  uses: [kullanir]
  title: [ad]
  rule: [kural, formul, hesap]
  measurement: [olcum, kanit, kanıt, dogrulama, olculdu]
  applied_in: [uygulama, uygulandi, rapor, uygulama_durumu]
  source: [kaynak, kaynak_tablolar]
  role: [rol]
  limits: [sinir]
  details: [ayrinti]
  note: [aciklama, tanim, not, desc]
  evidence_status: [kanit_durumu]
  stamp_inherited: [damga_devralindi]
  atomicity_reason: [atomiklik_gerekcesi]
  closed_set: [kapali_kume]
  view_trap: [view_tuzagi]
  cardinality: [kardinalite]
  row_count: [satir_sayisi]
  condition: [kosul]
  direction: [yon]

file_synonyms:
  # `source` metrics'te KANONİKTİR (veri kaynağı tablo/view) — orada eş-anlamlı kaydı YOK.
  # queries'te ise kaydın KÖKENİ demekti; oradaki doğru ad `origin`.
  queries: {origin: [source, koken]}

# ADLANDIRMA KONVANSİYONU (kullanıcı kararı 2026-09-11)
#   YAPISAL adlar — dosya adları, bölüm başlıkları, `_proje.yaml` anahtarları — İNGİLİZCE.
#   Kayıt İÇERİĞİ (note / kural / evidence metinleri) TÜRKÇE.
#   Tek konvansiyon, lehçe anahtarı YOK. Kısa süre `bolum_dili: en|tr` + `bolum_esanlamli`
#   vardı; bel'in bölümleri İngilizceye çevrilince gereksiz kaldı ve SİLİNDİ. Uymayan bölüm
#   `bilinmeyen_tip` diye raporlanır — motor sessizce "tanıdım" demez. Makine eklemek yerine
#   makine silmek.
#
#   ⚠ AÇIK BORÇ: kayıt ALAN ADLARI hâlâ karışık — İngilizce (`note`/`evidence`/`confidence`/
#   `last_verified`) ile Türkçe (`kural`/`kaynak`/`olcum`/`kullanir`/`ayrinti`) bir arada.
#   Tam İngilizceye çevirmek 373 kaydı + iki koşucuyu + geçiş dönemindeki Python araçları
#   birden etkiler; bugün DOKUNULMADI. Ayrı ve kapılı bir iş olarak karar bekliyor.


# Alan DEĞERİ düzeyinde eş-anlamlılar (alan adı değil, içindeki değer).
# Alan DEĞERİ düzeyinde eş-anlamlılar — KANONİK (İngilizce) ← ESKİ adlar.
# ⚠ 2026-09-11 göçünden sonra bu blok TERS kalmıştı (`tablo: [table]`), yani `type: table`
# yazan kayıtlar `tablo`ya çözülüyor ve koşullu kuralın değer kümesinde bulunamıyordu →
# 2 kayıt `db_nesnesi_pk_ister` denetiminden SESSİZCE düşmüştü. Taban çizgisiyle sayı
# karşılaştırması olmasa görülmezdi.
value_synonyms:
  type:
    measurement: [gozlem, dogrulama_damgasi, olcum_notu, olcum]
    table: [tablo]
    view: [vw]
    schema: [sema]
    rule: [kural]
    simple: [basit]
    ratio: [oran]
    derived: [turev]

# ─────────────────────────────────────────────────────────────────────────────
# 2. KAYIT TİPLERİ — <dosya>.<bolum>
# ─────────────────────────────────────────────────────────────────────────────
types:

  entities.entities:
    description: >-
      İKİ AYRI ŞEY barındırır ve `tip:` hangisi olduğunu SÖYLEMEK ZORUNDADIR:
      (a) gerçek DB nesnesi — tablo/view/sp/tvf/openquery/sema;
      (b) bir nesne HAKKINDA not — kural/olcum.
      Ölçüm 2026-09-11: 124 kaydın ~25'i (b) sınıfındaydı ama sahte tablo adı taşıyordu
      (`irsHrk.MERKEZ_DEPO_CIKISI`, `urn.IADE_HAKKI_IZLI_DEGIL`,
      `EncoreMerkez.dbo.SalesProducts.TUTAR_SEMANTIGI`). Bir not sahte tablo adıyla
      saklanınca hem entity sayısı şişer hem de o notun HANGİ tabloya ait olduğu
      yalnız isimden tahmin edilir. Artık `tip: kural|olcum` + `kullanir: [entities:<hedef>]`.
    required:
      - field: [type]
        level: uyari            # F2 sonrası kirik
    optional: [key, columns, role, rule, source, biz_key, filter, db, row_count, applied_in, pk, grain]
    special:
      type:
        values: [table, view, sp, tvf, openquery, schema, rule, measurement]
        description: >-
          tablo/view/sp/tvf/openquery/sema = gerçek DB nesnesi (pk veya grain ister).
          kural = bir nesne hakkındaki iş kuralı · olcum = tarihli ölçüm notu.
          Son ikisi `kullanir:` ile HEDEFİNİ bildirmek zorunda.
        level: uyari
      db:
        description: >-
          Hangi veritabanı. Dashboard `master` bağlamında çalıştığı için ERP nesnesi
          3-parçalı yazılmak zorunda (sql-server-conventions § Err 208); `db` yazılıysa
          bu kural makine tarafından denetlenebilir hâle gelir.
        level: uyari
      columns:
        type: harita
        description: "Kolon adı → {label, description}. CANLI sys.columns ile doldurulur (tools/sema_kolon_cek.py), elle YAZILMAZ."
        level_drift: kirik      # sema'da olup canlıda olmayan kolon = KIRIK
      key:
        type: liste
        description: "Anahtar/önemli kolon adları (açıklamasız). columns'un fakir hâli."
    conditional:
      - title: db_nesnesi_pk_ister
        condition: {field: type, value_set: [table, view, openquery, schema]}
        requires: {at_least_one: [pk, grain, key]}
        level: uyari
        description: "Gerçek nesne grain'ini söylemeli — yoksa JOIN fan-out'u öngörülemez."
      - title: not_hedefini_soylemeli
        condition: {field: type, value_set: [rule, measurement]}
        requires: {reference_file: entities}
        level: uyari
        exempt_status: [superseded]
        description: >-
          Not, hakkında olduğu nesneyi `kullanir: [entities:<id>]` ile bildirmeli.
          `status: superseded` kayıtlar MUAF — yerini bir araca/kayda bırakmış tarihsel not
          yeni bağ kurmaz (ör. `_sema_dogrulama_2026_08_18` elle yapılan kolon kontrolüydü,
          artık `tools/sema_kolon_cek.py` her koşuda yapıyor).
    atomicity: {max_chars: 4000, level: uyari, exempt_field: atomiklik_gerekcesi}

  entities.databases:
    description: "Veritabanı kataloğu — rol, şemalar, tarih biçimi, uyumluluk."
    required:
      - field: [role]
        level: uyari
    optional: [semalar, tarih, compat]
    common_exempt: true             # küçük katalog kaydı; confidence/evidence aranmaz

  entities.ai_hints:
    description: "Sorgu üretirken her zaman geçerli kısa kurallar (düz metin listesi)."
    record_type: text_list
    common_exempt: true

  bridges.bridges:
    description: "Cross-table / cross-db join tanımı."
    required:
      - field: [from]
        level: kirik
      - field: [to]
        level: kirik
      - field: [scope]
        level: uyari
    optional: [note, view_trap, condition, direction, cardinality]
    special:
      from: {format: "<sema>.<tablo>.<kolon>", seviye_bicim: uyari}
      to:   {format: "<sema>.<tablo>.<kolon>", seviye_bicim: uyari}
      cardinality:
        values: ["1:1", "1:N", "N:1", "N:N"]
        description: "JOIN patlaması (fan-out) riskini görünür kılar. N:N ise sorguda DISTINCT/agg zorunlu."
        level: uyari
    atomicity: {max_chars: 4000, level: uyari, exempt_field: atomiklik_gerekcesi}

  codes.codes:
    description: "Enum / lookup kod kümesi."
    required:
      - field: [values, lookup]   # en az biri
        level: kirik
    optional: [join, note, closed_set, source]
    special:
      lookup: {description: "Kanonik lookup tablosu. Varsa değerler ORADAN okunur, hardcode edilmez."}
      closed_set:
        type: bool
        description: "true ise küme kapalı — yeni kod çıkarsa değişmez kırmızı vermeli (degismezler.json)."
        level: uyari
    atomicity: {max_chars: 4000, level: uyari, exempt_field: atomiklik_gerekcesi}

  metrics.metrics:
    description: "Türetilmiş iş mantığı / hesap modeli."
    required:
      - field: [title]
        level: uyari
      - field: [rule, formula, note]   # en az biri — bulgu kaydi `note` ile de kendini anlatir
        level: uyari
    optional: [source, filter, grain, applied_in, limits, variants]
    special:
      type:
        values: [simple, ratio, derived, rule]
        description: "basit=tek agregat · oran=pay/payda · turev=başka metriklerden · kural=hesap değil karar mantığı"
        level: uyari            # F5 sonrası kirik
      additivity:
        values: [full, semi, none]
        description: >-
          tam = her boyutta toplanabilir (ciro, adet) ·
          yari = zaman boyutunda TOPLANMAZ, snapshot'tır (stok bakiyesi, kadro mevcudu) ·
          yok = hiç toplanmaz, yeniden hesaplanır (oran, ortalama, yüzde).
          Yanlış toplama sessiz yanlış rakamın en yaygın kaynağı.
        level: uyari            # F5 sonrası kirik
      unit:
        values: [TL, count, ratio, days, people, multiplier, none]
        description: "`yok` = ölçü değil (tip: kural kayıtlarında). Ölçüyse birim ZORUNLU."
        level: uyari            # F5 sonrası kirik
      basis:
        values: [vat_excl, vat_incl, unknown, none]
        description: >-
          Para metriklerinde ZORUNLU. `yok` = para metriği değil.
          `belirsiz` = PARA metriği ama tabanı BEYAN EDİLMEMİŞ → kullanmadan önce ÖLÇ.
          Ölçüm 2026-09-11: 32 para metriğinin yalnız 7'si tabanını söylüyordu. Sessiz
          eksik yerine BEYAN EDİLMİŞ eksik: `marj_kdv_tabani` vakası iki tarafın farklı
          tabanda olmasından doğdu ve hiçbir alan bunu göstermiyordu.
        level: uyari            # F5 sonrası kirik
      grain:
        description: "Hangi düzeyde tek satır: ürün×ay, mağaza×gün, fiş, kişi×ay…"
        level: uyari
      limits:
        description: "Bu metrik NEYİ ölçmez. Overclaim koruması (satinalma-danisman § adil ölçüm)."
    atomicity: {max_chars: 4000, level: uyari, exempt_field: atomiklik_gerekcesi}

  queries.queries:
    description: "Doğrulanmış sorgu kataloğu (golden SQL)."
    common_exempt_fields: [confidence, evidence]
    exemption_reason: >-
      Bir golden SQL'in kanıtı ayrı bir alan DEĞİL, KOŞUYOR olmasıdır:
      `tools/sema_sorgu_dumani.py` her kaydı `SELECT COUNT(*) FROM (<sql>) t` içine sarıp
      çalıştırır; bayat kolon/nesne adı kırmızı verir. `confidence: 0.8` yazmak bu ölçümün
      yerine geçmez, onu gizler. `last_verified` ZORUNLU kalır (damga koşumla tazelenir).
    required:
      - field: [question]
        level: kirik
      - field: [verified_sql]
        level: kirik
      - field: [mcp_safe]
        level: uyari
    optional: [metrics, origin, db, server, note]
    special:
      metrics:
        type: liste
        description: "İlgili metrik id'leri. `kullanir:` ile aynı bütünlük denetimine girer."
      mcp_safe:
        type: bool
        description: "MCP sql_query'de doğrudan koşar mı (CTE/top-level ORDER BY/multi-statement yok)."

# ─────────────────────────────────────────────────────────────────────────────
# 3. GLOBAL KURALLAR
# ─────────────────────────────────────────────────────────────────────────────
rules:
  id_uniqueness:
    level: kirik
    description: "Aynı dosya içinde id tekrar edemez. Tekrar = sessizce biri kazanır."
  unknown_top_field:
    level: uyari                # F2 sonrası kirik
    description: "Sözleşmede olmayan ÜST SEVİYE alan. Çözüm: ayrinti: altına taşı (silme)."
  unresolved_reference:
    level: kirik
    description: "`kullanir:`/`metrics:` içindeki <dosya>:<id> hedefi yoksa KIRIK."
  embedded_reference:
    level: uyari
    description: "Prose içinde başka kaydın id'si geçiyor ama `kullanir:`'de yok → graf eksik."
  date_format:
    level: kirik
    description: "last_verified YYYY-MM-DD. dd.MM.yyyy YASAK (sema makine-okunur, yerel tarih kuralı SQL içindir)."
  stale:
    level: uyari
    description: "last_verified + ttl_days < bugün. Bayrak — otomatik aksiyon YOK."
  ttl_defaults:
    "0.9-0.99": 180
    "0.5-0.8": 90
    "0.3-0.5": 30
    "1.0": null                  # muaf
