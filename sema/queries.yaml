# BKM Semantik Katman — DOĞRULANMIŞ SORGU KATALOĞU (saved queries / golden SQL)
# Pattern: Vanna.ai question+verified_sql + dbt saved_queries.
# Her kayıt: soru (doğal dil) + canlı doğrulanmış SQL + tarih. LLM yeni sorgu yazarken örnek alır.
# MCP kısıtı: CTE/top-level ORDER BY/multi-statement YOK → mcp_safe: true olanlar MCP'de direkt çalışır.
version: 1
updated: 2026-09-03

queries:
  - id: aylik-magaza-net-ciro
    question: "Mağaza bazında aylık net ciro (KDV hariç)"
    metrics: [net_ciro]
    mcp_safe: false   # FORMAT+GROUP BY ok ama ORDER BY'sız yaz
    verified_sql: |
      SELECT FORMAT(H.ehTrhS,'yyyy-MM') ay, M.mekanAd,
             SUM(CASE WHEN H.ehTip IN (1,4,100) THEN H.ehTutarN ELSE 0 END)
           - SUM(CASE WHEN H.ehTip IN (3,5,101) THEN H.ehTutarN ELSE 0 END) AS net_ciro
      FROM dbo.irsHrk H WITH(NOLOCK)
      JOIN dbo.mekan_vw M ON M.mekanID=H.ehMekan
      WHERE H.ehTrhS >= CONVERT(date,'01.01.2026',104)
        AND H.ehAltDepo=0 AND H.ehTip IN (1,3,4,5,100,101)
      GROUP BY FORMAT(H.ehTrhS,'yyyy-MM'), M.mekanAd
    last_verified: 2026-04-15
    source: "SEMANTIK_KATMAN.md şablonu"

  - id: encore-pos-gunluk-ciro
    question: "EncoreMerkez POS günlük ciro (iade düşülmüş, indirim Direct)"
    mcp_safe: true
    verified_sql: |
      SELECT CONVERT(date, s.SaleDate) gun,
             SUM(CASE WHEN s.DocumentsTypeId=3 THEN -s.GrossTotal ELSE s.GrossTotal END) brut,
             SUM(CASE WHEN s.DocumentsTypeId=3 THEN -s.DiscountTotalDirect ELSE s.DiscountTotalDirect END) indirim
      FROM EncoreMerkez.dbo.Sales s WITH(NOLOCK)
      WHERE s.DocumentsTypeId IN (1,2,3,6,7,8)
        AND s.SaleDate >= CONVERT(date,'01.06.2026',104)
      GROUP BY CONVERT(date, s.SaleDate)
    last_verified: 2026-06-08

  - id: pos-urun-kategori-koprusu
    question: "POS satışını DerinSIS kategorisine bağla (Products.Code=stkID)"
    bridges: [products-code-stkid, salesproducts-products]
    mcp_safe: true
    verified_sql: |
      SELECT ub.KatAna, SUM(sp.Quantity) adet, SUM(sp.RowTotal) ciro
      FROM EncoreMerkez.dbo.SalesProducts sp WITH(NOLOCK)
      JOIN EncoreMerkez.dbo.Sales s WITH(NOLOCK) ON s.Id=sp.SalesId
      JOIN EncoreMerkez.dbo.Products p WITH(NOLOCK) ON p.Id=sp.ProductsId
      JOIN DerinSISBkm.bkm.Urunbilgi ub ON ub.stkID = CONVERT(int, p.Code)
      WHERE sp.IsValid=1 AND s.DocumentsTypeId IN (1,2,3,6,7,8)
        AND ISNUMERIC(p.Code)=1
        AND s.SaleDate >= CONVERT(date,'01.06.2026',104)
      GROUP BY ub.KatAna
    last_verified: 2026-06-09
    note: "compat 110: TRY_CONVERT yok → ISNUMERIC guard. Oyuncak ciro 700K→10,96M bu köprüyle düzeldi."

  - id: eticaret-marka-satis
    question: "E-ticaret marka/yayınevi bazında satış (dönem)"
    bridges: [orderdetails-orders, orderdetails-items]
    mcp_safe: true
    verified_sql: |
      SELECT it.BRAND, SUM(d.QUANTITY) adet,
             CAST(SUM(d.QUANTITY*d.SELLINGPRICE) AS decimal(18,0)) net
      FROM ODAKJOKER.JOKER.dbo.J_ORDER_DETAILS d
      JOIN ODAKJOKER.JOKER.dbo.J_ITEMS it ON it.LOGICALREF=d.ITEMREF
      WHERE d.ORDERDATE >= '20260601' AND d.ORDERDATE < '20260608'
      GROUP BY it.BRAND
    last_verified: 2026-06-09
    note: "Linked server tarih = YYYYMMDD ISO (DMY sessiz hata!)."

  - id: cod-teslim-performans
    question: "Kapıda ödeme teslim/iade performansı (olgun pencere)"
    metrics: [cod_ekonomi]
    mcp_safe: true
    verified_sql: |
      SELECT cs.STATUS durum, COUNT(*) siparis, CAST(SUM(o.TOTALPRICE) AS decimal(18,0)) tutar
      FROM ODAKJOKER.JOKER.dbo.J_ORDERS o
      JOIN ODAKJOKER.JOKER.dbo.J_ORDER_CARGO_STATUS cs ON cs.STATUS=o.CARGODELIVERYSTATUS
      WHERE o.PAYDEFREF=-3
        AND o.ORDERDATE >= '20260210' AND o.ORDERDATE < '20260526'
      GROUP BY cs.STATUS
    last_verified: 2026-06-09
    note: "Olgun pencere: son 15 gün hariç (kargo süreci bitmemiş olur)."

  - id: depo-hareket-kategori
    question: "Merkez depo hareket kategorileri (Mal Kabul/Heykel/İade/Sevk) yıl bazında"
    metrics: [depo_hareket_kategori]
    bridges: [palet-irs, irs-firma]
    mcp_safe: true
    verified_sql: |
      SELECT YEAR(p.pikTarih) Yil,
        CASE WHEN p.pGC=0 AND i.eFirma=56 THEN 'Heykel'
             WHEN p.pGC=0 AND i.eTip=0  THEN 'MalKabul'
             WHEN p.pGC=0 AND i.eTip=9  THEN 'IadeKabul'
             WHEN p.pGC=0 AND i.eTip=16 THEN 'GenelGiris'
             WHEN p.pGC=1 AND i.eTip=13 THEN 'MagazaSevk'
             WHEN p.pGC=1 AND i.eTip IN (90,99) THEN 'IadeSevk'
             ELSE 'Diger' END Kat,
        CAST(SUM(ABS(p.piAdet)) AS bigint) Adet
      FROM DerinSISBkm.depo.paletIcHrk p WITH(NOLOCK)
      JOIN DerinSISBkm.dbo.irs i WITH(NOLOCK) ON i.eID=p.piIrsID
      WHERE MONTH(p.pikTarih) BETWEEN 1 AND 5 AND YEAR(p.pikTarih) IN (2024,2025,2026)
      GROUP BY YEAR(p.pikTarih),
        CASE WHEN p.pGC=0 AND i.eFirma=56 THEN 'Heykel'
             WHEN p.pGC=0 AND i.eTip=0  THEN 'MalKabul'
             WHEN p.pGC=0 AND i.eTip=9  THEN 'IadeKabul'
             WHEN p.pGC=0 AND i.eTip=16 THEN 'GenelGiris'
             WHEN p.pGC=1 AND i.eTip=13 THEN 'MagazaSevk'
             WHEN p.pGC=1 AND i.eTip IN (90,99) THEN 'IadeSevk'
             ELSE 'Diger' END
    last_verified: 2026-06-10
    source: "scripts/depo_isgucu_raporu.py"

  - id: depo-toplama-verim
    question: "Depo toplama (picking) işgücü verimi — gerçek operatör"
    metrics: [depo_isgucu]
    mcp_safe: true
    verified_sql: |
      SELECT YEAR(emTarih) Yil, COUNT(DISTINCT emKisi) Personel,
             COUNT(*) Islem, CAST(SUM(emAdet) AS bigint) Adet
      FROM DerinSISBkm.depo.emirAyr WITH(NOLOCK)
      WHERE emTamam=1 AND MONTH(emTarih) BETWEEN 1 AND 5
        AND YEAR(emTarih) IN (2024,2025,2026)
      GROUP BY YEAR(emTarih)
    last_verified: 2026-06-10
    sample_result: {2024: "10p/1.02M", 2025: "9p/1.38M", 2026: "8p/2.82M (+%245 verim)"}

  - id: musteri-adi-yazarkasa
    question: "Yazarkasa fişindeki müşteri adı/telefonu"
    bridges: [sales-customer-name]
    mcp_safe: true
    verified_sql: |
      SELECT TOP 100 s.Id, ISNULL(c.Name, s.CustomerCardNo) musteri, c.PhoneNumber
      FROM EncoreMerkez.dbo.Sales s WITH(NOLOCK)
      LEFT JOIN DerinCrm.dbo.Customer c ON c.Id=s.CustomersId
      WHERE s.SaleDate >= CONVERT(date,'01.06.2026',104)
    last_verified: 2026-06-09
    note: "Group1Id=2 = personel müşteri. İç kartlar (Mağaza/Kumbara/599-699 tel) RFM'de filtrele."

  - id: eticaret-haftalik-net-kanal
    question: "E-ticaret haftalık net ciro, kanal kırılımı (iptal/iade hariç)"
    codes: [joker.J_ORDERS.STATUS, joker.J_ORDERS.APPLICATION]
    mcp_safe: true
    verified_sql: |
      SELECT CASE WHEN o.APPLICATION IN ('Mobil Uygulama (Android)','Mobil Uygulama (iOS)',
                  'Mobil Site','Web Sitesi') THEN o.APPLICATION ELSE 'Diğer' END Kanal,
             SUM(CASE WHEN o.STATUS NOT IN (1001,1006,1007,3000,4000) THEN 1 ELSE 0 END) NetSiparis,
             SUM(CASE WHEN o.STATUS NOT IN (1001,1006,1007,3000,4000) THEN o.TOTALPRICE ELSE 0 END) NetCiro
      FROM ODAKJOKER.JOKER.dbo.J_ORDERS o
      WHERE o.ORDERDATE >= '20260601' AND o.ORDERDATE < '20260608'
      GROUP BY CASE WHEN o.APPLICATION IN ('Mobil Uygulama (Android)','Mobil Uygulama (iOS)',
                    'Mobil Site','Web Sitesi') THEN o.APPLICATION ELSE 'Diğer' END
    last_verified: 2026-06-11
    sample_result: "Hafta 01-07.06.2026: net 19,1M ₺ / 18.741 sipariş (fiziksel 10,1M'nin ~2 katı)"
    source: "scripts/generate_brief.py SQL_ETICARET (brief v1.1.0)"
    note: "Tarih ISO YYYYMMDD zorunlu. Net = STATUS 1006 (iptal) + 3004/3006 (iade) hariç. TOTALPRICE kargo dahil brüt sipariş — POS net'iyle birebir kıyaslanamaz."

  - id: il-teslimat-perf
    question: "İl bazında kargo teslimat performansı — çıkış (takvim + iş günü) + teslim süresi"
    metrics: [il_teslimat_perf]
    mcp_safe: false   # TOP + ORDER BY + CROSS APPLY — dashboard'da çalışır, MCP'de ORDER BY çıkar
    verified_sql: |
      SELECT TOP 15 mus.DCITY AS Sehir, COUNT(*) AS Adet,
             CAST(AVG(CAST(DATEDIFF(HOUR,o.ORDERDATE,o.SENDDATE) AS float)/24) AS decimal(10,1)) AS CikisTakvim,
             CAST(AVG(CAST(
               DATEDIFF(DAY,o.ORDERDATE,o.SENDDATE) - DATEDIFF(WEEK,o.ORDERDATE,o.SENDDATE)*2
               - CASE WHEN DATEPART(WEEKDAY,o.ORDERDATE)=1 THEN 1 ELSE 0 END
               - CASE WHEN DATEPART(WEEKDAY,o.SENDDATE)=7 THEN 1 ELSE 0 END - ta.T AS float)) AS decimal(10,1)) AS CikisIsGunu,
             CAST(AVG(CAST(DATEDIFF(HOUR,o.SENDDATE,o.CARGODELIVERYDATE) AS float)/24) AS decimal(10,1)) AS TeslimGun
      FROM ODAKJOKER.JOKER.dbo.J_ORDERS o
      JOIN ODAKJOKER.JOKER.dbo.J_ORDER_DELIVERY_ADDRESS mus ON mus.LOGICALREF=o.DELIVERYREF
      CROSS APPLY (SELECT COUNT(*) T FROM (VALUES (CONVERT(date,'20260423')),(CONVERT(date,'20260501')),
        (CONVERT(date,'20260519')),(CONVERT(date,'20260527')),(CONVERT(date,'20260528')),
        (CONVERT(date,'20260529')),(CONVERT(date,'20260530'))) H(d)
        WHERE H.d>o.ORDERDATE AND H.d<=o.SENDDATE AND DATEPART(WEEKDAY,H.d) NOT IN (1,7)) ta
      WHERE o.SENDDATE>='20260601' AND o.SENDDATE<'20260613'
        AND o.CARGODELIVERYDATE IS NOT NULL AND o.STATUS=1005 AND mus.DCITY IS NOT NULL
      GROUP BY mus.DCITY ORDER BY Adet DESC
    last_verified: 2026-06-13
    sample_result: "MTD Haz İstanbul 9.662 sip · çıkış takvim 4,1g / iş günü 1,8g · teslim 1,4g · toplam algı 5,5g. Çıkış il-bağımsız (depo), teslim il-bağımlı (kargo)."
    source: "dashboard EticQueries.GetIlTeslimatAsync · KARGO İL TESLİMAT PERFORMANSLARI.sql (B-41)"
    note: "ÇIKIŞ iş günü olmalı (takvim 2x abartı). Depo Pzt-Cuma (Cmt 5/Paz 0). CROSS APPLY tatil tablosu hafta-içi resmi tatil çıkarır. Teslim takvim (kargo hafta sonu çalışır). Tatil sabiti yıllık güncelle."

  - id: ay-cikis-trend
    question: "Aylık kargoya çıkış süresi trendi (takvim + iş günü) — kapasite darboğazı"
    metrics: [il_teslimat_perf]
    mcp_safe: true
    verified_sql: |
      SELECT YEAR(o.SENDDATE)*100+MONTH(o.SENDDATE) AS AyKod,
             COUNT(DISTINCT o.ORDERID) AS Siparis,
             CAST(AVG(CAST(DATEDIFF(HOUR,o.ORDERDATE,o.SENDDATE) AS float)/24) AS decimal(10,1)) AS CikisTakvim,
             CAST(AVG(CAST(
               DATEDIFF(DAY,o.ORDERDATE,o.SENDDATE) - DATEDIFF(WEEK,o.ORDERDATE,o.SENDDATE)*2
               - CASE WHEN DATEPART(WEEKDAY,o.ORDERDATE)=1 THEN 1 ELSE 0 END
               - CASE WHEN DATEPART(WEEKDAY,o.SENDDATE)=7 THEN 1 ELSE 0 END - ta.T AS float)) AS decimal(10,1)) AS CikisIsGunu
      FROM ODAKJOKER.JOKER.dbo.J_ORDERS o
      CROSS APPLY (SELECT COUNT(*) T FROM (VALUES (CONVERT(date,'20251029')),(CONVERT(date,'20260101'))) H(d)
        WHERE H.d>o.ORDERDATE AND H.d<=o.SENDDATE AND DATEPART(WEEKDAY,H.d) NOT IN (1,7)) ta
      WHERE o.SENDDATE>='20250601' AND o.SENDDATE<'20260601' AND o.SENDDATE IS NOT NULL
        AND o.STATUS NOT IN (1001,1006,1007,3000,4000) AND DATEDIFF(DAY,o.ORDERDATE,o.SENDDATE)>=0
      GROUP BY YEAR(o.SENDDATE)*100+MONTH(o.SENDDATE)
    last_verified: 2026-06-13
    sample_result: "Aralık'25 158K sip → takvim 4,4 / iş günü 3,1 (yılbaşı zirve); Ağustos 62K → 1,6/1,0. Çıkış sipariş hacmiyle korele = kapasite darboğazı."
    source: "dashboard EticQueries.GetAyKargoAsync (B-41)"
    note: "Son 13 tam ay, dönem-bağımsız. CROSS APPLY tatil çıkarır (örnekte kısmi liste). Grafik iş günü serisi."

  - id: cod-iade-maliyet-ozet
    question: "Kapıda ödeme (COD) iade maliyeti özeti — sipariş/teslim/iade oranı + 2×kargo iade gideri"
    metrics: [cod_ekonomi]
    mcp_safe: true
    verified_sql: |
      SELECT COUNT(*) AS Siparis,
             SUM(CASE WHEN o.STATUS=1005 THEN 1 ELSE 0 END) AS Teslim,
             SUM(CASE WHEN o.CARGODELIVERYSTATUS=2 THEN 1 ELSE 0 END) AS Iade,
             CAST(SUM(o.SERVICEPRICE) AS decimal(18,0)) AS KapidaBedel,
             CAST(SUM(CASE WHEN o.CARGODELIVERYSTATUS=2 THEN 2*o.CARGOPRICE ELSE 0 END) AS decimal(18,0)) AS IadeMaliyet
      FROM ODAKJOKER.JOKER.dbo.J_ORDERS o
      WHERE o.PAYDEFREF=-3 AND o.SENDDATE>='20260501' AND o.SENDDATE<'20260601' AND o.SENDDATE IS NOT NULL
    last_verified: 2026-06-13
    sample_result: "Mayıs'26: 2.690 COD sip · 2.397 teslim · 291 iade (%10,8) · iade maliyeti 52.322₺ · kapıda bedel 228.381₺. Yıllık ~628K₺ iade kargo gideri BKM yutar."
    source: "dashboard EticQueries.GetCodOzetAsync · KARGO KAPIDA ÖDEME RAPOR.sql (B-41)"
    note: "İade maliyeti = 2×CARGOPRICE (gidiş+geri getirme, teslim edilmeyen COD). SERVICEPRICE pass-through (firmaya, kâr değil). CARGODELIVERYSTATUS=2=iade. Çıkış (SENDDATE) dönemi — kısmi son ay iade oranını düşük gösterir (iade gecikmeli gelir)."

  - id: kadro-as-of-sube-yil
    question: "Sube bazinda as-of kadro: 30.06 taban ve 31.08 kesim, kadrolu/sezonluk (iki yil)"
    entities: [BKM_GENEL.dbo.vw_PersonelDepartman]
    mcp_safe: true
    verified_sql: |
      SELECT v.AltLokasyon AS sube,
             SUM(CASE WHEN COALESCE(v.Kadro,'') <> 'SEZONLUK' AND v.Igt <= '20260630'
                       AND (v.Ict IS NULL OR v.Ict >= '20260630') THEN 1 ELSE 0 END) AS kadrolu_taban,
             SUM(CASE WHEN COALESCE(v.Kadro,'') <> 'SEZONLUK' AND v.Igt <= '20260831'
                       AND (v.Ict IS NULL OR v.Ict >= '20260831') THEN 1 ELSE 0 END) AS kadrolu_kesim,
             SUM(CASE WHEN v.Kadro = 'SEZONLUK' AND v.Igt <= '20260831'
                       AND (v.Ict IS NULL OR v.Ict >= '20260831') THEN 1 ELSE 0 END) AS sezonluk_kesim
      FROM dbo.vw_PersonelDepartman v
      WHERE v.Lokasyon LIKE 'MA%'
      GROUP BY v.AltLokasyon
    notlar: "as-of = Igt <= T AND (Ict IS NULL OR Ict >= T) — sp_PersonelKarsilastirma_Ozet ile
      birebir. Kapsam ayraci Lokasyon LIKE 'MA%' (GM/merkez disi). Olcum 2026-09-03: taban
      139 -> 153, kesim 135 -> 149, sezonluk 65 -> 62 (bes magaza)."
    last_verified: 2026-09-03

  - id: bordro-fte-maliyet-fazla-mesai
    question: "Bordrodan FTE (tam gun karsiligi), personel maliyeti ve fazla mesai (ay bazli)"
    entities: [BKM_GENEL.dbo.vw_PuanBil]
    metrics: [personel_maliyet_ve_fazla_mesai]
    mcp_safe: true
    verified_sql: |
      SELECT b.Yil, COUNT(*) AS kayit,
             SUM(CAST(b.Primgunu AS float)) / 30.0            AS fte,
             SUM(b.Bt + b.Isskk + b.Iisk)                     AS maliyet,
             SUM(b.fm1 + b.fm2 + b.fm3)                       AS fm_saat,
             SUM(CASE WHEN p.Kadro = 'SEZONLUK' THEN CAST(b.Primgunu AS float) ELSE 0 END) / 30.0
                                                              AS sezonluk_fte
      FROM dbo.vw_PuanBil b
      INNER JOIN dbo.vw_PersonelDepartman p ON p.Personelno = b.Personelno
      WHERE b.Yil IN (2025, 2026) AND b.Ayindex = 7
        AND p.Lokasyon LIKE 'MA%'
        AND p.AltLokasyon IN (N'FSM', N'İST. YOLU', N'ÖZLÜCE')
      GROUP BY b.Yil
    notlar: "FTE = Primgunu/30 (bordro SATIRI degil — yarim ay calisan tam sayilmaz). Maliyet =
      Bt + Isskk + Iisk (brut + isveren SGK + isveren issizlik). Join 1:1 olculdu (fan-out yok).
      ⚠ Cari ayin bordrosu KOSMADAN alinirsa maliyet %80+ eksik gorunur -> son TAM bordro ayi.
      Olcum 2026-09-03 (Temmuz, uc POS): FTE 97,13 -> 112,43 · maliyet 4,39M -> 6,78M TL ·
      FM 643 -> 783 saat."
    last_verified: 2026-09-03

  - id: okul-hizali-pencere-hacim
    question: "Okul acilisina hizali pencerede adet + ciro (iki yil, esit gun)"
    entities: [dbo.irs, dbo.irsAyr, bkm.UrunBilgi]
    mcp_safe: true
    verified_sql: |
      SELECT YEAR(bs.eTarihS) AS yil,
             COUNT(DISTINCT CAST(bs.eTarihS AS date))                      AS gun,
             SUM(ABS(CAST(dt.ehAdet AS float)))                            AS adet,
             SUM(CAST(dt.ehTutar - dt.ehIndirim + dt.ehTutarKDV AS float))  AS ciro_kdvdahil
      FROM dbo.irs bs WITH(NOLOCK)
      INNER JOIN dbo.irsAyr dt WITH(NOLOCK) ON dt.ehID = bs.eID
      LEFT JOIN bkm.UrunBilgi kat WITH(NOLOCK) ON kat.stkID = dt.ehStkID
      WHERE bs.eTip = 100
        AND bs.eMekan IN (1, 4477, 4478)
        AND (COALESCE(kat.Kategori3, N'x') NOT IN (N'Sınav Okulları', N'Sınav Kıyafet')
             AND COALESCE(kat.KatAna, N'x') NOT LIKE N'Sınav Okul%')
        AND ((YEAR(bs.eTarihS) = 2025
              AND DATEDIFF(DAY, '20250908', CAST(bs.eTarihS AS date)) BETWEEN -69 AND -14)
          OR (YEAR(bs.eTarihS) = 2026
              AND DATEDIFF(DAY, '20260914', CAST(bs.eTarihS AS date)) BETWEEN -69 AND -14))
      GROUP BY YEAR(bs.eTarihS)
    notlar: "Okul acilisi ofseti -69..-14 -> her iki yil 56 gun (gun esitligi ON KOSUL, bkz.
      metrics.hizali_pencere_gun_esitligi). Sinav ayiklamasi IKI KOLLU (Kategori3 + KatAna).
      Takvim-tarihli kiyas 2026'yi yapay dusuk gosterir (acilis 6 gun kaydi). Olcum 2026-09-03:
      adet 574.655,7 -> 775.031,55 · KDV-dahil ciro 71,82M -> 122,53M TL. ⚠ AGIR sorgu (~17 sn)."
    last_verified: 2026-09-03
